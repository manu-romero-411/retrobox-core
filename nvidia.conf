# You need to run "update-initramfs -u" after editing this file.

# Nouveau/Nova must be blacklisted here as well beside from the initrd to avoid
# a delayed loading (for example on Optimus laptops where the Nvidia card is not
# driving the main display).

blacklist nouveau
blacklist nova-core

# Enable complete power management. From:
# file:///usr/share/doc/nvidia-driver/html/powermanagement.html

options nvidia NVreg_TemporaryFilePath=/var/tmp
options nvidia NVreg_DynamicPowerManagement=0x02
options nvidia NVreg_EnableS0ixPowerManagement=0
options nvidia NVreg_PreserveVideoMemoryAllocations=1
#options nvidia NVreg_RegistryDwords="PowerMizerEnable=0x1;PerfLevelSrc=0x2222;PowerMizerDefault=0x1;PowerMizerDefaultAC=0x1"
options nvidia NVreg_EnableGpuFirmware=1
options nvidia NVreg_UsePageAttributeTable=1
options nvidia NVreg_InitializeSystemMemoryAllocations=0
options nvidia NVreg_EnableStreamMemOPs=1
options nvidia NVreg_RegistryDwords=RMIntrLockingMode=1

# el brillo en debian a veces hace cosas raras:
blacklist nvidia_wmi_ec_backlight
