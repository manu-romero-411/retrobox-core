<?xml version="1.0" encoding="UTF-8"?>
<features>
  <emulator name="ppsspp" features="">
    <sharedFeature value="powermode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="videomode" />
    <sharedFeature value="hud" />
    <sharedFeature value="hud_corner" />
    <sharedFeature value="bezel.tattoo" />
    <sharedFeature value="bezel.tattoo_corner" />
    <sharedFeature value="bezel.tattoo_file" />
    <sharedFeature value="bezel.resize_tattoo" />
    <sharedFeature value="rewind" />
    <sharedFeature value="discordrpc" />
    <feature name="GRAPHICS API" submenu="RENDERING" value="gfxbackend"
      description="Choose which graphics API library to use.">
      <choice name="OpenGL" value="0 (OPENGL)" />
      <choice name="Vulkan" value="3 (VULKAN)" />
    </feature>
    <feature name="RENDERING RESOLUTION" submenu="RENDERING" value="internal_resolution"
      description="Enhancement. Increase the rendering resolution. Makes 3D objects clearer.">
      <choice name="1x (480x272)" value="1" />
      <choice name="2x (960x544)" value="2" />
      <choice name="3x 720p (1440x816)" value="3" />
      <choice name="4x 1080p (1920x1088)" value="4" />
      <choice name="5x (2400x1360)" value="5" />
      <choice name="6x (2880x1632)" value="6" />
      <choice name="7x (3360x1904)" value="7" />
      <choice name="8x 4K (3840x2176)" value="8" />
      <choice name="9x (4320x2448)" value="9" />
      <choice name="10x (4800x2720)" value="10" />
    </feature>
    <feature name="VSYNC" submenu="RENDERING" value="vsync"
      description="Enable for more fluidity, disable if screen tearing.">
      <choice name="Disable" value="0" />
      <choice name="Enable" value="1" />
    </feature>
    <feature name="FRAME SKIPPING" submenu="FRAMESKIP CONTROL" value="frameskip"
      description="Skip frames to improve performance, at the cost of choppy motion.">
      <choice name="Off" value="0" />
      <choice name="1" value="1" />
      <choice name="2" value="2" />
      <choice name="3" value="3" />
      <choice name="4" value="4" />
      <choice name="5" value="5" />
      <choice name="6" value="6" />
      <choice name="7" value="7" />
      <choice name="8" value="8" />
    </feature>
    <feature name="AUTO FRAMESKIP" submenu="FRAMESKIP CONTROL" value="autoframeskip"
      description="Automatically reduce frameskip if the system has spare overhead.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="SKIP BUFFER EFFECTS" submenu="SPEED HACKS" value="skip_buffer_effects"
      description="Skip buffer effects faster but may not render some games. Disables resolution, MSAA, auto frameskip and duplicate frames to 60Hz.">
      <choice name="Buffered rendering" value="False" />
      <choice name="Skip buffer effects" value="True" />
    </feature>
    <feature name="DISABLE CULLING" submenu="SPEED HACKS" value="disable_culling"
      description="The PSP will cull triangles that are outside a 4096x4096 clipping box, and also triangles crossing the Z=1 plane if clipping is enabled.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="SKIP GPU READBACKS" submenu="SPEED HACKS" value="skip_gpu_readbacks"
      description="In some games, this can fix severe slowdowns, but can also cause graphical issues.">
      <choice name="No (Default)" value="0" />
      <choice name="Skip" value="1" />
      <choice name="Copy to texture" value="2" />
    </feature>
    <feature name="LAZY TEXTURE CACHING" submenu="SPEED HACKS" value="lazy_texture_caching"
      description="Faster but can cause text problems in some games.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="SPLINE/BEZIER CURVES QUALITY" submenu="SPEED HACKS" value="curves_quality"
      description="Allows reducing the visual quality of these curves for higher performance.">
      <choice name="Low" value="0" />
      <choice name="Medium" value="1" />
      <choice name="High" value="2" />
    </feature>
    <feature name="RENDER DUPLICATE FRAMES TO 60 HZ" submenu="PERFORMANCE" value="duplicate_frames"
      description="If a game runs at 30hz, PPSSPP wtill push 60 frames to the monitor.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="BUFFER GRAPHICS COMMANDS" submenu="PERFORMANCE" value="buffer_graphics"
      description="CPU-GPU latency limit. Lower values improve latency but may reduce performance.">
      <choice name="No Buffer" value="1" />
      <choice name="Up to 1" value="2" />
      <choice name="Up to 2 (Default)" value="3" />
    </feature>
    <feature name="SOFTWARE SKINNING" submenu="PERFORMANCE" value="software_skinning"
      description="Runs &quot;skinning&quot; on the CPU instead of the GPU, means that draw calls from the game can more easily be combined, which often improves things.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="HARDWARE TESSELLATION" submenu="PERFORMANCE" value="hardware_tessellation"
      description="Uses hardware to make curves.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="TEXTURE UPSCALING TYPE" submenu="TEXTURE SCALING" value="texture_scaling_type"
      description="xBRZ - a sharpening upscale algorithm, Bicubic - a smooth look, Hybrid - uses bicubic for smooth areas.">
      <choice name="xBRZ (Default)" value="0" />
      <choice name="Hybrid" value="1" />
      <choice name="Bicubic" value="2" />
      <choice name="Hybrid + Bicubic" value="3" />
    </feature>
    <feature name="TEXTURE UPSCALING LEVEL" submenu="TEXTURE SCALING" value="texture_scaling_level"
      description="There is generally no point in going beyond 4x texture scaling unless you are running at very high resolutions.">
      <choice name="Off (Default)" value="1" />
      <choice name="2x" value="2" />
      <choice name="3x" value="3" />
      <choice name="4x" value="4" />
      <choice name="5x" value="5" />
    </feature>
    <feature name="TEXTURE DEPOSTERIZE" submenu="TEXTURE SCALING" value="texture_deposterize"
      description="Fix texture banding when upscaling.">
      <choice name="Off" value="False" />
      <choice name="On" value="True" />
    </feature>
    <feature name="ANISOTROPIC FILTERING" submenu="TEXTURE FILTERING" value="anisotropic_filtering"
      description="Improves clarity of distant textures.">
      <choice name="Off" value="0" />
      <choice name="2x" value="1" />
      <choice name="4x" value="2" />
      <choice name="8x" value="3" />
      <choice name="16x" value="4" />
    </feature>
    <feature name="TEXTURE FILTERING" submenu="TEXTURE FILTERING" value="texture_filtering"
      description="Smooth textures on 3D objects.">
      <choice name="Nearest" value="2" />
      <choice name="Linear" value="3" />
      <choice name="Auto Max Quality" value="4" />
    </feature>
    <feature name="SMART 2D TEXTURE FILTERING" submenu="TEXTURE FILTERING" value="smart_2d"
      description="When enabled and upscaling, textures look better than linear filtering for a lot of 2D art.">
      <choice name="Off" value="False" />
      <choice name="On" value="True" />
    </feature>
    <feature name="GAME CHEATS" group="ADVANCED OPTIONS" value="enable_cheats"
      description="Enables Action Replay cheats.">
      <choice name="Off" value="False" />
      <choice name="On" value="True" />
    </feature>
  </emulator>
</features>