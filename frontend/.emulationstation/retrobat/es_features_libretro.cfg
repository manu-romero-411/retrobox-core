        <choice name="NONE" value="disabled"/>
        <choice name="SIMPLE" value="mix"/>
        <choice name="GHOSTING (65%)" value="ghost_65"/>
        <choice name="GHOSTING (75%)" value="ghost_75"/>
        <choice name="GHOSTING (85%)" value="ghost_85"/>
        <choice name="GHOSTING (95%)" value="ghost_95"/>
      </feature>
      <feature submenu="AUDIO" name="AUDIO FILTER" group="ADVANCED SETTINGS" value="a5200_low_pass_filter" description="Soften the hash sound effect from some games." preset="sliderauto" preset-parameters="0 95 5 %" order="306"/>
