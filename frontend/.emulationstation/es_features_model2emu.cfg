<?xml version="1.0" encoding="UTF-8"?>
<features>
  <emulator name="model2emu" features="padtokeyboard">
    <sharedFeature value="powermode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="videomode" />
    <feature name="RENDERING RESOLUTION" value="model2_renderRes"
      description="Enhancement. Increase the rendering resolution. Makes 3D objects clearer.">
      <choice name="640x480" value="0" />
      <choice name="800x600" value="1" />
      <choice name="1024x768" value="2" />
      <choice name="1280x1024" value="3" />
      <choice name="Screen Resolution (Default)" value="4" />
    </feature>
    <feature name="ENABLE WIDESCREEN" value="model2_ratio" description="Enable widescreen support.">
      <choice name="Off" value="False" />
      <choice name="On" value="True" />
    </feature>
    <feature name="ENABLE SCANLINES" value="model2_scanlines"
      description="Enable scanlines for roms that support it.">
      <choice name="Off" value="False" />
      <choice name="On" value="True" />
    </feature>
    <feature name="SHOW LIGHT GUN CROSSHAIRS" group="LIGHT GUN" value="model2_crossHairs"
      description="">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="FAKE GOURAUD" group="ADVANCED OPTIONS" value="model2_fakeGouraud"
      description="Tries to guess Per-vertex colour (gouraud) from the Model2 per-poly information (flat).">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="BILINEAR FILTERING" group="ADVANCED OPTIONS" value="model2_bilinearFiltering"
      description="Smooth textures.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="TRILINEAR FILTERING" group="ADVANCED OPTIONS" value="model2_trilinearFiltering"
      description="Enables mipmap usage and trilinear filtering. Doesn't work with some games.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="FILTER TILEMAPS" group="ADVANCED OPTIONS" value="model2_filterTilemaps"
      description="Enables bilinear filtering on tilemaps. Looks good, but can cause some stretch artifacts.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="FORCE MANAGED" group="ADVANCED OPTIONS" value="model2_forceManaged"
      description="Forces the DX driver to use Managed textures instead of Dynamic.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE MIP-MAP" group="ADVANCED OPTIONS" value="model2_enableMIP"
      description="Enables Direct3D Automip-map generation.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE MESH TRANSPARENCY" group="ADVANCED OPTIONS"
      value="model2_meshTransparency" description="Enabled meshed polygons for translucency.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE FULL-SCREEN ANTI-ALIASING" group="ADVANCED OPTIONS"
      value="model2_fullscreenAA" description="Enable full-screen antialiasing in Direct3D.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE RAW INPUT" group="ADVANCED OPTIONS" value="model2_useRawInput"
      description="Read mouse through Rawinput, allowing 2 mice for 2 player shooting games.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE SOFTWARE RENDERER" value="model2_Software"
      description="Use if you're having graphical issues or GPU problems with this emulator.">
      <choice name="Off (Default)" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="X-INPUT" value="model2_xinput"
      description="Enable X-Input mode for Xbox type controllers.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="RUMBLE" value="model2_forceFeedback"
      description="Only some games support rumble. Requires X-Input mode and may not be compatible with all controllers.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
  </emulator>
</features>