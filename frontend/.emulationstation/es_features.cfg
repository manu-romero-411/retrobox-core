      description="Enhancement. Increase the rendering resolution. Makes 3D objects clearer.">
      <choice name="1x (400x240)" value="1" />
      <choice name="2x (800x480)" value="2" />
      <choice name="3x (1200x720)" value="3" />
      <choice name="4x (1600x960)" value="4" />
      <choice name="5x (2000x1200)" value="5" />
      <choice name="6x (2400x1440)" value="6" />
      <choice name="7x (2800x1680)" value="7" />
      <choice name="8x (3200x1920)" value="8" />
      <choice name="9x (3600x2160)" value="9" />
      <choice name="10x (4000x2400)" value="10" />
