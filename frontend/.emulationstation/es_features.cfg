      <choice name="OFF" value="False" />
      <choice name="ON" value="True" />
    </feature>
    <feature name="AUTO HEIGHT" value="amiberry_auto_height"
      description="Resize automatically screen height.">
      <choice name="OFF" value="False" />
      <choice name="ON" value="True" />
