    <feature name="VSYNC" submenu="GRAPHICS" value="azahar_use_vsync_new"
      description="Fix screen tearing. CPU heavy.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="GRAPHICS API" submenu="GRAPHICS" value="azahar_graphics_api"
      description="Choose which graphics API library to use.">
      <choice name="Software" value="0" />
      <choice name="OpenGL (Default)" value="1" />
      <choice name="Vulkan" value="2" />
    </feature>
    <feature name="HARDWARE SHADER" submenu="GRAPHICS" value="azahar_use_hw_shader"
      description="Helps improve performance and requires a powerful GPU. May cause some games not launch when enabled.">
      <choice name="Off (Default)" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ACCURATE MULTIPLICATION" submenu="GRAPHICS"
      value="azahar_accurate_multiplication"
      description="Some applications requires this to be enabled for the hardware shader to render properly. However this would reduce performance in most applications.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="SHADER JIT" submenu="GRAPHICS" value="azahar_use_shader_jit"
      description="Use the JIT engine instead of the interpreter for software shader emulation. Enable this for better performance.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE ASYNC SHADER COMPILATION" submenu="GRAPHICS"
      value="azahar_async_shader_compilation"
      description="Compile shaders using background threads to avoid shader compilation stutter. May cause graphical glitches.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="ENABLE ASYNC PRESENTATION" submenu="GRAPHICS" value="azahar_async_presentation"
      description="Perform presentation on separate threads. Improves performance when using Vulkan in most applications. Adds ~1 frame of input lag.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="DISK SHADER CACHE" submenu="GRAPHICS" value="azahar_use_disk_shader_cache"
      description="Reduce stutter that happens when compiling shaders. Requires hardware shader to be enabled.">
      <choice name="Off" value="0" />
      <choice name="On" value="1" />
    </feature>
    <feature name="LOAD CUSTOM TEXTURES" submenu="GRAPHICS" value="azahar_custom_textures"
      description="Preloading is impossible from ES.">
      <choice name="Off" value="0" />
      <choice name="On" value="1-normal" />
      <choice name="Preload" value="1-preload" />
    </feature>
