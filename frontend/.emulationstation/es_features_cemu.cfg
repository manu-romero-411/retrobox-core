<?xml version="1.0" encoding="UTF-8"?>
<features>
  <emulator name="cemu" features="">
    <sharedFeature value="powermode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="videomode" />
    <sharedFeature value="bezel" />
    <sharedFeature value="bezel_stretch" />
    <sharedFeature value="hud" />
    <sharedFeature value="hud_corner" />
    <sharedFeature value="bezel.tattoo" />
    <sharedFeature value="bezel.tattoo_corner" />
    <sharedFeature value="bezel.tattoo_file" />
    <sharedFeature value="bezel.resize_tattoo" />
    <sharedFeature value="use_wheels" />
    <sharedFeature value="wheel_rotation" />
    <sharedFeature value="wheel_deadzone" />
    <sharedFeature value="wheel_midzone" />
    <sharedFeature value="discordrpc" />
    <feature name="GRAPHICS API" value="cemu_gfxbackend"
      description="Choose which graphics API library to use.">
      <choice name="OpenGL" value="0" />
      <choice name="Vulkan (Default)" value="1" />
    </feature>
    <feature name="ASYNC SHADER COMPILE (VULKAN ONLY)" group="ADVANCED OPTIONS" value="cemu_async"
      description="Speed up shader compilation.">
      <choice name="Off" value="False" />
      <choice name="On (Default)" value="True" />
    </feature>
    <feature name="RUMBLE" value="cemu_rumble"
      description="Set the controller rumble strength if supported.">
      <choice name="Off (Default)" value="0" />
      <choice name="25%" value="0.25" />
      <choice name="50%" value="0.5" />
      <choice name="75%" value="0.75" />
      <choice name="100%" value="1" />
    </feature>
    <feature name="CONTROLLER COMBINATION" value="cemu_controller_combination"
      description="Pro Controller required for games that require shake motions.">
      <choice name="GamePad + 4 Pro Controller" value="0" />
      <choice name="GamePad + 4 Sideway Wiimote" value="1" />
      <choice name="5 Pro Controller" value="2" />
      <choice name="5 Sideway Wiimote" value="3" />
      <choice name="Wii U Classic Controller" value="4" />
    </feature>
    <feature name="CONSOLE LANGUAGE" group="ADVANCED OPTIONS" value="cemu_console_language"
      description="Choose console language. Not all games may support the language choice.">
      <choice name="Current language" value="ui" />
      <choice name="Japanese" value="ja_JP" />
      <choice name="English" value="en_US" />
      <choice name="French" value="fr_FR" />
      <choice name="German" value="de_DE" />
      <choice name="Italian" value="it_IT" />
      <choice name="Spanish" value="es_ES" />
      <choice name="Chinese" value="zh_CN" />
      <choice name="Korean" value="ko_KR" />
      <choice name="Dutch" value="nl_NL" />
      <choice name="Portuguese" value="pt_PT" />
      <choice name="Russian" value="ru_RU" />
      <choice name="Taiwanese" value="zh_TW" />
    </feature>
    <feature name="AUDIO CHANNELS" value="cemu_audio_channels"
      description="Choose the audio output type.">
      <choice name="Stereo (Default)" value="1" />
      <choice name="Surround" value="2" />
    </feature>
    <feature name="AUDIO OUTPUT" group="ADVANCED OPTIONS" value="cemu_audio_config"
      description="Have Batocera set the first audio output device.">
      <choice name="Set in Config - choose if no audio output" value="False" />
      <choice name="Batocera sets first audio device (Default)" value="True" />
    </feature>
    <feature name="VSYNC" value="cemu_vsync" description="Fix screen tearing.">
      <choice name="Off (Default)" value="0" />
      <choice name="Double buffering" value="1" />
      <choice name="Triple buffering" value="2" />
    </feature>
    <feature name="UPSCALE FILTER" group="ADVANCED OPTIONS" value="cemu_upscale"
      description="Choose upscaling method.">
      <choice name="Bilinear" value="0" />
      <choice name="Bicubic" value="1" />
      <choice name="Hermite (Default)" value="2" />
      <choice name="Nearest Neighbour" value="3" />
    </feature>
    <feature name="DOWNSCALE FILTER" group="ADVANCED OPTIONS" value="cemu_downscale"
      description="Choose downscaling method.">
      <choice name="Bilinear (Default)" value="0" />
      <choice name="Bicubic" value="1" />
      <choice name="Hermite" value="2" />
      <choice name="Nearest Neighbour" value="3" />
    </feature>
    <feature name="ASPECT RATIO" value="cemu_aspect"
      description="Change the output resolution ratio.">
      <choice name="Keep Aspect Ration (Default)" value="0" />
      <choice name="Stretch" value="1" />
    </feature>
    <feature name="ENABLE MOUSE" value="cemu_touchpad"
      description="Enable mouse input to simulate touchscreen.">
      <choice name="Disabled (Default)" value="0" />
      <choice name="Enabled" value="1" />
    </feature>
    <feature name="ENABLE PERFORMANCE OVERLAY" group="ADVANCED OPTIONS" value="cemu_overlay"
      description="Enable Cemu's performance overlay.">
      <choice name="Disabled (Default)" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
    <feature name="ENABLE NOTIFICATIONS" group="ADVANCED OPTIONS" value="cemu_notifications"
      description="Enable notifications of cache, controller events etc.">
      <choice name="Disabled (Default)" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
    <feature name="ENABLE GAMEPAD VIEW" value="cemu_gamepad"
      description="Enable gamepad view for games that have interaction across two screens. Use Hotkey+R2 to switch screens.">
      <choice name="Disabled (Default)" value="False" />
      <choice name="Enabled" value="True" />
    </feature>
  </emulator>
</features>