<?xml version="1.0" encoding="UTF-8"?>
<features>
  <emulator name="dolphin" features="">
    <cores>
      <core name="dolphin" features="cheevos">
        <sharedFeature value="powermode" />
        <sharedFeature value="tdp" />
        <sharedFeature value="videomode" />
        <sharedFeature value="bezel" />
        <sharedFeature value="bezel_stretch" />
        <sharedFeature value="hud" />
        <sharedFeature value="hud_corner" />
        <sharedFeature value="bezel.tattoo" />
        <sharedFeature value="bezel.tattoo_corner" />
        <sharedFeature value="bezel.tattoo_file" />
        <sharedFeature value="bezel.resize_tattoo" />
        <sharedFeature value="use_wheels" />
        <sharedFeature value="wheel_rotation" />
        <sharedFeature value="wheel_deadzone" />
        <sharedFeature value="wheel_midzone" />
        <sharedFeature value="discordrpc" />
        <feature name="GAME ASPECT RATIO" submenu="DISPLAY" value="dolphin_aspect_ratio"
          description="The final output image, unrelated to the Wii's emulated NAND setting.">
          <choice name="Automatic ratio" value="0" />
          <choice name="Force 16:9" value="1" />
          <choice name="Force 4:3" value="2" />
          <choice name="Stretch to window" value="3" />
        </feature>
        <feature name="VSYNC" submenu="DISPLAY" value="vsync"
          description="Fix screen tearing. CPU heavy." preset="switchauto">
        </feature>
        <feature name="GRAPHICS API" submenu="RENDERING" value="gfxbackend"
          description="Choose which graphics API library to use.">
          <choice name="OpenGL" value="OGL" />
          <choice name="Vulkan" value="Vulkan" />
        </feature>
        <feature name="RENDERING RESOLUTION" submenu="RENDERING" value="internal_resolution"
          description="Enhancement. Increase the rendering resolution. Makes 3D objects clearer.">
          <choice name="1x native (640x528)" value="1" />
          <choice name="2x 720p (1280x1056)" value="2" />
          <choice name="3x 1080p (1920x1584)" value="3" />
          <choice name="4x 1440p (2560x2112)" value="4" />
          <choice name="5x (3200x2640)" value="5" />
          <choice name="6x 4K (3840x3168)" value="6" />
          <choice name="7x (4480x3696)" value="7" />
          <choice name="8x 5K (5120x4224)" value="8" />
        </feature>
        <feature name="UBERSHADERS" submenu="RENDERING" value="ubershaders"
          description="May not work well on all hardware. Hybrid is preferred, where supported.">
          <choice name="No Ubershaders" value="0" />
          <choice name="Exclusive Ubershaders" value="1" />
          <choice name="Hybrid Ubershaders" value="2" />
          <choice name="Skip Drawing" value="3" />
        </feature>
        <feature name="PRE-CACHE SHADERS" submenu="RENDERING" value="wait_for_shaders"
          description="Compile shaders on next launch of game (one time). Reduces micro-freezes. Vulkan only."
          preset="switchauto">
        </feature>
        <feature name="ANISOTROPIC FILTERING" submenu="RENDERING" value="anisotropic_filtering"
          description="Improves clarity of distant textures.">
          <choice name="Off" value="0" />
          <choice name="2x" value="1" />
          <choice name="4x" value="2" />
          <choice name="8x" value="3" />
          <choice name="16x" value="4" />
        </feature>
        <feature name="ANTI-ALIASING" submenu="RENDERING" value="antialiasing"
          description="Enhancement. Smooth out jagged edges on 3D object polygons.">
          <choice name="Off" value="0" />
          <choice name="2x" value="2" />
          <choice name="4x" value="4" />
          <choice name="8x" value="8" />
        </feature>
        <feature name="ANTI-ALIASING MODE" submenu="RENDERING" value="use_ssaa"
          description="Use SSAA instead of MSAA for anti-aliasing. SSAA may look better but has a higher performance cost."
          preset="switchauto">
        </feature>
        <feature name="LOAD CUSTOM TEXTURES" submenu="RENDERING" value="hires_textures"
          description="" preset="switchauto">
        </feature>
        <feature name="MANUAL TEXTURE SAMPLING" submenu="RENDERING" value="manual_texture_sampling"
          description="Enabling will allow for correct emulation of texture wrapping. This comes at a cost of potential worse performance."
          preset="switchauto">
        </feature>
        <feature name="DUAL CORE MODE" submenu="EMULATION" value="dual_core"
          description="Usually not much faster than single core mode." preset="switchauto">
        </feature>
        <feature name="GPU SYNC" submenu="EMULATION" value="gpu_sync"
          description="Speed hack for dual core mode to fix some glitches." preset="switchauto">
        </feature>
        <feature name="PERFORMANCE HACKS" submenu="EMULATION" value="perf_hacks"
          description="Increase emulator performance, at the cost of accuracy/stability."
          preset="switchauto">
        </feature>
        <feature name="ENABLE CHEATS" submenu="EMULATION" value="enable_cheats"
          description="To use game cheats or 16/9 Aspect Ratio Fix codes." preset="switchauto">
        </feature>
        <feature name="MEMORY MANAGEMENT UNIT" submenu="EMULATION" value="enable_mmu"
          description="Required by some games." preset="switchauto">
        </feature>
        <feature name="FAST DISK TRANSFER RATE" submenu="EMULATION" value="enable_fastdisc"
          description="Enhancement. Removes disc loading." preset="switchauto">
        </feature>
        <feature name="VBI SKIP" submenu="EMULATION" value="vbi_hack"
          description="Skips Vertical Blank Interrupts when lag is detected, allowing for smooth audio playback when emulation speed is not 100%."
          preset="switchauto">
        </feature>
        <feature name="USE PAD PROFILES" group="CONTROLS" value="use_pad_profiles"
          description="Search for custom configured joystick profiles." preset="switchauto">
        </feature>
        <feature name="RUMBLE" group="CONTROLS" value="rumble"
          description="Enable controller rumble capabilities if supported by the controller."
          preset="switchauto">
        </feature>
        <feature name="GAMECUBE PORT 1 TYPE" submenu="GAMECUBE CONTROLLER 1" group="CONTROLS"
          value="dolphin_port_1_type"
          description="Change what's plugged into the virtual GameCube ports.">
          <choice name="None" value="0" />
          <choice name="Standard Controller" value="6a" />
          <choice name="GameCube Controller" value="6b" />
          <choice name="GameCube Adapter for Wii U" value="12" />
          <choice name="Steering Wheel" value="8" />
          <choice name="Dance Mat" value="9" />
          <choice name="DK Bongos" value="10" />
          <choice name="Keyboard" value="7" />
        </feature>
        <feature name="GAMECUBE PORT 2 TYPE" submenu="GAMECUBE CONTROLLER 2" group="CONTROLS"
          value="dolphin_port_2_type"
          description="Change what's plugged into the virtual GameCube ports.">
          <choice name="None" value="0" />
          <choice name="Standard Controller" value="6a" />
          <choice name="GameCube Controller" value="6b" />
          <choice name="GameCube Adapter for Wii U" value="12" />
          <choice name="Steering Wheel" value="8" />
          <choice name="Dance Mat" value="9" />
          <choice name="DK Bongos" value="10" />
          <choice name="Keyboard" value="7" />
        </feature>
        <feature name="GAMECUBE PORT 3 TYPE" submenu="GAMECUBE CONTROLLER 3" group="CONTROLS"
          value="dolphin_port_3_type"
          description="Change what's plugged into the virtual GameCube ports.">
          <choice name="None" value="0" />
          <choice name="Standard Controller" value="6a" />
          <choice name="GameCube Controller" value="6b" />
          <choice name="GameCube Adapter for Wii U" value="12" />
          <choice name="Steering Wheel" value="8" />
          <choice name="Dance Mat" value="9" />
          <choice name="DK Bongos" value="10" />
          <choice name="Keyboard" value="7" />
        </feature>
        <feature name="GAMECUBE PORT 4 TYPE" submenu="GAMECUBE CONTROLLER 4" group="CONTROLS"
          value="dolphin_port_4_type"
          description="Change what's plugged into the virtual GameCube ports.">
          <choice name="None" value="0" />
          <choice name="Standard Controller" value="6a" />
          <choice name="GameCube Controller" value="6b" />
          <choice name="GameCube Adapter for Wii U" value="12" />
          <choice name="Steering Wheel" value="8" />
          <choice name="Dance Mat" value="9" />
          <choice name="DK Bongos" value="10" />
          <choice name="Keyboard" value="7" />
        </feature>
        <feature name="ROTATE FACE BUTTONS" submenu="GAMECUBE CONTROLLER 1" group="CONTROLS"
          value="alt_mappings_1"
          description="Moves South to West, West to North, etc. Standard controller type only."
          preset="switchauto">
        </feature>
        <feature name="ROTATE FACE BUTTONS" submenu="GAMECUBE CONTROLLER 2" group="CONTROLS"
          value="alt_mappings_2"
          description="Moves South to West, West to North, etc. Standard controller type only."
          preset="switchauto">
        </feature>
        <feature name="ROTATE FACE BUTTONS" submenu="GAMECUBE CONTROLLER 3" group="CONTROLS"
          value="alt_mappings_3"
          description="Moves South to West, West to North, etc. Standard controller type only."
          preset="switchauto">
        </feature>
        <feature name="ROTATE FACE BUTTONS" submenu="GAMECUBE CONTROLLER 4" group="CONTROLS"
          value="alt_mappings_4"
          description="Moves South to West, West to North, etc. Standard controller type only."
          preset="switchauto">
        </feature>
        <feature name="DEADZONE" submenu="GAMECUBE CONTROLLER 1" group="CONTROLS" value="deadzone_1"
          description="Set joystick deadzone.">
          <choice name="0%" value="0.0" />
          <choice name="5% (Default)" value="5.0" />
          <choice name="10%" value="10.0" />
          <choice name="15%" value="15.0" />
          <choice name="20%" value="20.0" />
          <choice name="25%" value="25.0" />
          <choice name="30%" value="30.0" />
        </feature>
        <feature name="DEADZONE" submenu="GAMECUBE CONTROLLER 2" group="CONTROLS" value="deadzone_2"
          description="Set joystick deadzone.">
          <choice name="0%" value="0.0" />
          <choice name="5% (Default)" value="5.0" />
          <choice name="10%" value="10.0" />
          <choice name="15%" value="15.0" />
          <choice name="20%" value="20.0" />
          <choice name="25%" value="25.0" />
          <choice name="30%" value="30.0" />
        </feature>
        <feature name="DEADZONE" submenu="GAMECUBE CONTROLLER 3" group="CONTROLS" value="deadzone_3"
          description="Set joystick deadzone.">
          <choice name="0%" value="0.0" />
          <choice name="5% (Default)" value="5.0" />
          <choice name="10%" value="10.0" />
          <choice name="15%" value="15.0" />
          <choice name="20%" value="20.0" />
          <choice name="25%" value="25.0" />
          <choice name="30%" value="30.0" />
        </feature>
        <feature name="DEADZONE" submenu="GAMECUBE CONTROLLER 4" group="CONTROLS" value="deadzone_4"
          description="Set joystick deadzone.">
          <choice name="0%" value="0.0" />
          <choice name="5% (Default)" value="5.0" />
          <choice name="10%" value="10.0" />
          <choice name="15%" value="15.0" />
          <choice name="20%" value="20.0" />
          <choice name="25%" value="25.0" />
          <choice name="30%" value="30.0" />
        </feature>
        <feature name="JOYSTICK GATE SIZE" submenu="GAMECUBE CONTROLLER 1" group="CONTROLS"
          value="jsgate_size_1"
          description="Set virtual joysticks gate size. Smaller increases sensitivity. Larger decreases it.">
          <choice name="Smaller" value="smaller" />
          <choice name="Normal (Default)" value="normal" />
          <choice name="Larger" value="larger" />
        </feature>
        <feature name="JOYSTICK GATE SIZE" submenu="GAMECUBE CONTROLLER 2" group="CONTROLS"
          value="jsgate_size_2"
          description="Set virtual joysticks gate size. Smaller increases sensitivity. Larger decreases it.">
          <choice name="Smaller" value="smaller" />
          <choice name="Normal (Default)" value="normal" />
          <choice name="Larger" value="larger" />
        </feature>
        <feature name="JOYSTICK GATE SIZE" submenu="GAMECUBE CONTROLLER 3" group="CONTROLS"
          value="jsgate_size_3"
          description="Set virtual joysticks gate size. Smaller increases sensitivity. Larger decreases it.">
          <choice name="Smaller" value="smaller" />
          <choice name="Normal (Default)" value="normal" />
          <choice name="Larger" value="larger" />
        </feature>
        <feature name="JOYSTICK GATE SIZE" submenu="GAMECUBE CONTROLLER 4" group="CONTROLS"
          value="jsgate_size_4"
          description="Set virtual joysticks gate size. Smaller increases sensitivity. Larger decreases it.">
          <choice name="Smaller" value="smaller" />
          <choice name="Normal (Default)" value="normal" />
          <choice name="Larger" value="larger" />
        </feature>
        <feature name="DOLBY PRO LOGIC II" group="AUDIO" value="dplii"
          description="Enables Dolby Pro Logic II for surround sound. May impact performance."
          preset="switchauto">
        </feature>
        <feature name="SHOW ON-SCREEN DISPLAY MESSAGES" submenu="DISPLAY" value="ShowDpMsg"
          description="Show on screen display messages (memory card saves..)." preset="switchauto">
        </feature>
        <systems>
          <system name="gamecube" features="">
            <feature name="WIDESCREEN HACK (GLITCHY)" submenu="DISPLAY" value="widescreen_hack"
              description="Enhancement. Only works with a 16/9 ratio and bezels disabled."
              preset="switchauto">
            </feature>
            <feature name="ENABLE BOOT ANIMATION" submenu="EMULATION" value="dolphin_SkipIPL"
              description="Enable Gamecube boot animation and BIOS access (requires IPL.bin BIOS in appropriate user directory)."
              preset="switchauto">
            </feature>
            <feature name="GAMECUBE LANGUAGE" submenu="EMULATION" value="gamecube_language"
              description="Change the Gamecube system language.">
              <choice name="English/Japanese" value="0" />
              <choice name="German" value="1" />
              <choice name="French" value="2" />
              <choice name="Spanish" value="3" />
              <choice name="Italian" value="4" />
              <choice name="Dutch" value="5" />
            </feature>
          </system>
          <system name="wii" features="">
            <sharedFeature value="use_guns" />
            <feature name="WII TV MODE" submenu="DISPLAY" value="tv_mode"
              description="Wii NAND's aspect ratio setting. Most games support both ratios natively.">
              <choice name="4:3" value="0" />
              <choice name="16:9" value="1" />
            </feature>
            <feature name="EMULATE WIIMOTE" submenu="WII CONTROLLERS" group="CONTROLS"
              value="emulatedwiimotes" description="Map your controller to an emulated Wiimote."
              preset="switchauto">
            </feature>
            <feature name="CUSTOMIZE EMULATED WIIMOTE &amp; GAMEPAD" submenu="WII CONTROLLERS"
              group="CONTROLS" value="controller_mode"
              description="Emulate a Wiimote Sideway with L2 for Shake and Nunchuk on R-stick.">
              <choice name="Off" value="disabled" />
              <choice name="Classic Controller" value="cc" />
              <choice name="Classic Controller Pro" value="pro" />
              <choice name="Wiimote Sideway" value="side" />
              <choice name="Wiimote Sideway + Swing" value="is" />
              <choice name="Wiimote Sideway + Tilt" value="it" />
              <choice name="Wiimote Sideway + Nunchuk" value="in" />
            </feature>
            <feature name="SENSOR BAR POSITION" submenu="WII CONTROLLERS" group="CONTROLS"
              value="sensorbar_position"
              description="Position of wii sensor bar relative to the disaply for real wiimotes.">
              <choice name="Bottom (Default)" value="0" />
              <choice name="Top" value="1" />
            </feature>
            <feature name="DUALSHOCK MOTION CONTROL" submenu="WII CONTROLLERS" group="CONTROLS"
              value="dsmotion" description="Emulate the Wiimote pointer with a DS4's gyroscope."
              preset="switchauto">
            </feature>
            <feature name="MOUSE AS WIIMOTE POINTER" submenu="WII CONTROLLERS" group="CONTROLS"
              value="mouseir" description="Emulate the Wiimote pointer with a mouse."
              preset="switchauto">
            </feature>
            <feature name="SHOW LIGHT GUN CROSSHAIRS" submenu="LIGHT GUNS" group="CONTROLS"
              order="99" value="dolphin_crosshair" description="" preset="switchauto">
            </feature>
          </system>
        </systems>
      </core>
    </cores>
  </emulator>
</features>