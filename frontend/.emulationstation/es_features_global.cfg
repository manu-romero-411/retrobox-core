<?xml version="1.0" encoding="UTF-8"?>
<features>
  <sharedFeatures>
    <feature name="DISCORD RPC" value="discordrpc"
      description="Enable Discord Rich Presence on emulators that support it.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="GAME ASPECT RATIO" value="ratio"
      description="Force the game to render in this aspect ratio. Not all systems support all ratios.">
      <choice name="4/3" value="4/3" />
      <choice name="16/9" value="16/9" />
      <choice name="Full" value="full" />
      <choice name="16/10" value="16/10" />
      <choice name="16/15" value="16/15" />
      <choice name="21/9" value="21/9" />
      <choice name="1/1" value="1/1" />
      <choice name="2/1" value="2/1" />
      <choice name="3/2" value="3/2" />
      <choice name="3/4" value="3/4" />
      <choice name="4/1" value="4/1" />
      <choice name="9/16" value="9/16" />
      <choice name="5/4" value="5/4" />
      <choice name="6/5" value="6/5" />
      <choice name="7/9" value="7/9" />
      <choice name="8/3" value="8/3" />
      <choice name="8/7" value="8/7" />
      <choice name="19/12" value="19/12" />
      <choice name="19/14" value="19/14" />
      <choice name="30/17" value="30/17" />
      <choice name="32/9" value="32/9" />
      <choice name="Config" value="config" />
      <choice name="Square pixel" value="squarepixel" />
      <choice name="Core provided" value="core" />
      <choice name="Custom" value="custom" />
    </feature>
    <feature name="REWIND" value="rewind"
      description="Store past states to rewind to in realtime, if the core supports it.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="AUTO SAVE/LOAD ON GAME LAUNCH" value="autosave"
      description="Load latest save state on game launch and save state when exiting game.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="SHADER SET" submenu="GAME RENDERING &amp; SHADERS" value="shaderset"
      description="" preset="shaderset">
    </feature>
    <feature name="SMOOTH GAMES (BILINEAR FILTERING)" submenu="GAME RENDERING &amp; SHADERS"
      value="smooth"
      description="Disabled if using a shader set or the output display matches the game's resolution.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="INTEGER SCALING (PIXEL PERFECT)" submenu="GAME RENDERING &amp; SHADERS"
      value="integerscale" description="Only increase the image size in integer multiples.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="DECORATION SET" submenu="DECORATIONS" value="bezel" description="" preset="bezel">
    </feature>
    <feature name="STRETCH BEZELS (4K &amp; ULTRAWIDE)" submenu="DECORATIONS" value="bezel_stretch"
      description="">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="ENABLE AI TRANSLATION SERVICE" submenu="AI GAME TRANSLATION"
      value="ai_service_enabled"
      description="During gameplay, press Hotkey + R1 to translate on-screen text. Only on libretro cores."
      preset="switchauto">
    </feature>
    <feature name="TARGET LANGUAGE" submenu="AI GAME TRANSLATION" value="ai_target_lang"
      description="The language to translate into.">
      <choice name="ENGLISH" value="En" />
      <choice name="FRANÇAIS" value="Fr" />
      <choice name="PORTUGUÊS" value="Pt" />
      <choice name="DEUTSCH" value="De" />
      <choice name="GREEK" value="El" />
      <choice name="ESPAÑOL" value="Es" />
      <choice name="CZECH" value="Cs" />
      <choice name="DANISH" value="Da" />
      <choice name="CROATIAN" value="Hr" />
      <choice name="HUNGARIAN" value="Hu" />
      <choice name="ITALIANO" value="It" />
      <choice name="JAPANESE" value="Ja" />
      <choice name="KOREAN" value="Ko" />
      <choice name="DUTCH" value="Nl" />
      <choice name="NORWEGIAN" value="Nn" />
      <choice name="POLISH" value="Po" />
      <choice name="ROMANIAN" value="Ro" />
      <choice name="РУССКИЙ" value="Ru" />
      <choice name="SVENSKA" value="Sv" />
      <choice name="TÜRKÇE" value="Tr" />
      <choice name="简体中文" value="Zh" />
    </feature>
    <feature name="AI TRANSLATION SERVICE URL" submenu="AI GAME TRANSLATION" value="ai_service_url"
      description="If nothing is specified, will use ZTranslate by default." preset="input">
    </feature>
    <feature name="PAUSE ON TRANSLATED SCREEN" submenu="AI GAME TRANSLATION"
      value="ai_service_pause" description="" preset="switchauto">
    </feature>
    <feature name="RUN-AHEAD FRAMES" submenu="LATENCY REDUCTION" value="runahead"
      description="Enables run-ahead. Doubles CPU requirements. High numbers can result in visible jitter.">
      <choice name="None" value="0" />
      <choice name="1" value="1" />
      <choice name="2" value="2" />
      <choice name="3" value="3" />
      <choice name="4" value="4" />
      <choice name="5" value="5" />
      <choice name="6" value="6" />
    </feature>
    <feature name="USE SECOND INSTANCE FOR RUN-AHEAD" submenu="LATENCY REDUCTION"
      value="secondinstance"
      description="Can prevent audio skips on button presses when using run-ahead.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="USE PRE-EMPTIVE FRAMES" submenu="LATENCY REDUCTION" value="preemptiveframes"
      description="Use preemptive frames instead of run-ahead. Only runs ahead when controller state changes.">
      <choice name="On" value="true" />
      <choice name="Off" value="false" />
    </feature>
    <feature name="AUTOMATIC FRAME DELAY" submenu="LATENCY REDUCTION" value="video_frame_delay_auto"
      description="Automatically decrease frame delay temporarily to prevent frame drops. Can introduce stuttering.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="VARIABLE REFRESH RATE" submenu="LATENCY REDUCTION" value="vrr_runloop_enable"
      description="Don't deviate from core requested timing. G-Sync, FreeSync, HDMI 2.1 VRR.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="THREADED VIDEO" submenu="LATENCY REDUCTION" value="video_threaded"
      description="Improves performance at the cost of latency and more video stuttering.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="USE LIGHT GUNS" submenu="LIGHT GUNS" group="CONTROLS" order="99" value="use_guns"
      description="Use light guns instead of pads if light guns are connected.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="USE WHEELS" submenu="WHEELS" group="CONTROLS" order="100" value="use_wheels"
      description="Use wheels instead of pads if wheels are connected.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="WHEEL ROTATION" submenu="WHEELS" group="CONTROLS" order="100"
      value="wheel_rotation" description="Maximum wheel rotation from left to right (in degrees)">
      <choice name="150" value="150" />
      <choice name="180" value="180" />
      <choice name="200" value="200" />
      <choice name="240" value="240" />
      <choice name="270" value="270" />
      <choice name="360" value="360" />
      <choice name="720" value="720" />
      <choice name="900" value="900" />
      <choice name="1080" value="1080" />
    </feature>
    <feature name="WHEEL DEADZONE" submenu="WHEELS" group="CONTROLS" order="100"
      value="wheel_deadzone"
      description="Zone for which the game doesn't react to the wheel (in degrees)">
      <choice name="5" value="5" />
      <choice name="10" value="10" />
      <choice name="15" value="15" />
      <choice name="20" value="20" />
      <choice name="25" value="25" />
      <choice name="30" value="30" />
      <choice name="35" value="35" />
      <choice name="40" value="40" />
      <choice name="45" value="45" />
      <choice name="50" value="50" />
    </feature>
    <feature name="WHEEL MIDZONE" submenu="WHEELS" group="CONTROLS" order="100"
      value="wheel_midzone"
      description="Reserve a non dead zone at the center of the wheel to go straight ahead (in degrees)">
      <choice name="1" value="1" />
      <choice name="2" value="2" />
      <choice name="3" value="3" />
      <choice name="4" value="4" />
      <choice name="5" value="5" />
      <choice name="6" value="6" />
      <choice name="7" value="7" />
      <choice name="8" value="8" />
      <choice name="9" value="9" />
      <choice name="10" value="10" />
    </feature>
    <feature name="RUMBLE LEVEL" value="rumble_gain"
      description="For emulators and controllers supporting force feedback.">
      <choice name="disabled" value="1" />
      <choice name="20%" value="20" />
      <choice name="40%" value="40" />
      <choice name="60%" value="60" />
      <choice name="80%" value="80" />
      <choice name="100%" value="100" />
    </feature>
    <feature name="AUDIO VOLUME GAIN" value="audio_volume"
      description="Set game audio level gain in dB.">
      <choice name="-12" value="-12.0" />
      <choice name="-10" value="-10.0" />
      <choice name="-8" value="-8.0" />
      <choice name="-6" value="-6.0" />
      <choice name="-4" value="-4.0" />
      <choice name="-2" value="-2.0" />
      <choice name="0 (No gain)" value="0" />
      <choice name="+2" value="2.0" />
      <choice name="+4" value="4.0" />
      <choice name="+6" value="6.0" />
      <choice name="+8" value="8.0" />
      <choice name="+10" value="10.0" />
      <choice name="+12" value="12.0" />
    </feature>
    <feature name="BORDER MODE" group="LIGHT GUN" value="bordersmode"
      description="Show/Hide guns borders for specific systems">
      <choice name="normal" value="normal" />
      <choice name="hidden" value="hidden" />
    </feature>
  </sharedFeatures>
  <globalFeatures>
    <sharedFeature value="discordrpc" />
    <sharedFeature value="powermode" />
    <sharedFeature value="batterymode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="videomode" />
    <sharedFeature value="ratio" />
    <sharedFeature value="shaderset" />
    <sharedFeature value="smooth" />
    <sharedFeature value="integerscale" />
    <sharedFeature value="bezel" />
    <sharedFeature value="bezel_stretch" />
    <sharedFeature value="ai_service_enabled" />
    <sharedFeature value="ai_target_lang" />
    <sharedFeature value="ai_service_url" />
    <sharedFeature value="ai_service_pause" />
    <sharedFeature value="rewind" />
    <sharedFeature value="runahead" />
    <sharedFeature value="preemptiveframes" />
    <sharedFeature value="secondinstance" />
    <sharedFeature value="video_frame_delay_auto" />
    <sharedFeature value="vrr_runloop_enable" />
    <sharedFeature value="video_threaded" />
    <sharedFeature value="rumble_gain" />
  </globalFeatures>
</features>