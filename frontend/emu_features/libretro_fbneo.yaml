emulator_name: libretro
core_name: fbneo
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  ADVANCED OPTIONS:
    items:
      - name: CPU CLOCK
        value: "fbneo-cpu-speed-adjust"
        description: Can fix slowdown. Only works on some drivers.
        choices:
          - name: "30%"
            value: "30%"
          - name: "40%"
            value: "40%"
          - name: "50%"
            value: "50%"
          - name: "60%"
            value: "60%"
          - name: "70%"
            value: "70%"
          - name: "80%"
            value: "80%"
          - name: "90%"
            value: "90%"
          - name: "100%"
            value: "100%"
          - name: "110%"
            value: "110%"
          - name: "120%"
            value: "120%"
          - name: "130%"
            value: "130%"
          - name: "140%"
            value: "140%"
          - name: "150%"
            value: "150%"
          - name: "160%"
            value: "160%"
          - name: "170%"
            value: "170%"
          - name: "180%"
            value: "180%"
          - name: "190%"
            value: "190%"
          - name: "200%"
            value: "200%"
  GENERAL:
    items:
      - name: FRAMESKIP
        value: "fbneo-frameskip"
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: No skipping
            value: 0
          - name: 1
            value: 1
          - name: 2
            value: 2
          - name: 3
            value: 3
          - name: 4
            value: 4
      - name: SPECIAL CONTROL LAYOUTS
        value: altlayout
        description: Controls for 5/6 button games and other unique controls
        choices:
          - name: Default Only
            value: default
          - name: Modern Fightstick Style
            value: fightstick
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: "fbneo-lightgun-crosshair-emulation"
        description: ""
        choices:
          - name: Off
            value: always hide
          - name: On
            value: always show
systems:
  - name: neogeo
    groups:
      GENERAL:
        items:
          - name: NEO GEO BIOS
            value: "fbneo-neogeo-mode-switch"
            description: ""
            choices:
              - name: Console AES World
                value: AES Asia
              - name: Console AES Japan
                value: AES Japan
              - name: Arcade MVS Europe
                value: MVS Asia/Europe
              - name: Arcade MVS USA
                value: MVS USA
              - name: Arcade MVS Japan
                value: MVS Japan
              - name: Arcade Universe BIOS (Cheats)
                value: Universe BIOS
      ADVANCED OPTIONS:
        items:
          - name: MEMORY CARD MODE
            value: "fbneo-memcard-mode"
            description: ""
            choices:
              - name: Off
                value: disabled
              - name: Shared
                value: shared
              - name: "Per-game"
                value: "per-game"
