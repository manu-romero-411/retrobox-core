emulator_name: libretro
core_name: vice_x128
features:
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: MODEL TYPE
        value: c128_model
        description: ""
        choices:
          - name: C128 PAL
            value: C128 PAL
          - name: C128 NTSC
            value: C128 NTSC
          - name: C128 DCR PAL
            value: C128 DCR PAL
          - name: C128 DCR NTSC
            value: C128 DCR NTSC
      - name: COLOR FILTER
        value: vice_external_palette
        description: Can be used to simulate colors of particular displays.
        choices:
          - name: default
            value: default
          - name: colodore
            value: colodore
          - name: "pepto-pal"
            value: "pepto-pal"
          - name: "pepto-ntsc"
            value: "pepto-ntsc"
          - name: "pepto-ntsc-sony"
            value: "pepto-ntsc-sony"
          - name: cjam
            value: cjam
          - name: c64hq
            value: c64hq
          - name: c64s
            value: c64s
          - name: ccs64
            value: ccs64
          - name: "community-colors"
            value: "community-colors"
          - name: deekay
            value: deekay
          - name: frodo
            value: frodo
          - name: godot
            value: godot
          - name: pc64
            value: pc64
          - name: ptoing
            value: ptoing
          - name: rgb
            value: rgb
          - name: vice
            value: vice
      - name: ASPECT RATIO
        value: vice_aspect_ratio
        description: Change the output resolution ratio.
        choices:
          - name: PAL 576x312px
            value: pal
          - name: NTSC 492x262px
            value: ntsc
      - name: Button Options
        value: vice_retropad_options
        description: RetroPad Face Button Options.
        choices:
          - name: "B = Fire"
            value: disabled
          - name: "B = Fire, A = Up"
            value: jump
          - name: "Y = Fire"
            value: rotate
          - name: "Y = Fire, B = Up"
            value: rotate_jump
      - name: CONTROLLER PORT
        value: vice_joyport
        description: "Most games use port 2, some use port 1."
        choices:
          - name: Port 1
            value: 1
          - name: Port 2
            value: 2
      - name: CONTROLLER TYPE
        value: vice_joyport_type
        description: ""
        choices:
          - name: Joystick
            value: 1
          - name: Paddles
            value: 2
          - name: Mouse (1351)
            value: 3
          - name: "Trackball (Atari CX-22)"
            value: 6
          - name: Koalapad
            value: 10
  ADVANCED OPTIONS:
    items:
      - name: ZOOM/CROP (HIDE BORDERS)
        value: vice_zoom_mode
        description: Hides borders on many games. Some games used the borders.
        choices:
          - name: "Auto-disable zoom"
            value: auto_disable
          - name: Auto zoom
            value: automatic
          - name: Off
            value: disabled
          - name: small
            value: small
          - name: medium
            value: medium
          - name: maximum
            value: maximum
      - name: RAM EXPANSION UNIT
        value: vice_ram_expansion_unit
        description: Some games and homebrews require more RAM
        choices:
          - name: Disabled
            value: none
          - name: 128kB (1700)
            value: 128kB
          - name: 256kB (1764)
            value: 256kB
          - name: 512kB (1750)
            value: 512kB
          - name: 1024kB
            value: 1024kB
          - name: 2048kB
            value: 2048kB
          - name: 4096kB
            value: 4096kB
          - name: 8192kB
            value: 8192kB
          - name: 16384kB
            value: 16384kB
      - name: KEYBOARD PASSTHROUGH
        value: vice_keyboard_pass_through
        description: Keyboard shortcuts unavailable if passing through the keyboard.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
