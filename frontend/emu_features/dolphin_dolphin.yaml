emulator_name: dolphin
core_name: dolphin
features:
  - cheevos
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
  - discordrpc
groups:
  GENERAL:
    submenus:
      DISPLAY:
        - name: GAME ASPECT RATIO
          value: dolphin_aspect_ratio
          description: "The final output image, unrelated to the Wii's emulated NAND setting."
          choices:
            - name: Automatic ratio
              value: 0
            - name: "Force 16:9"
              value: 1
            - name: "Force 4:3"
              value: 2
            - name: Stretch to window
              value: 3
        - name: VSYNC
          value: vsync
          description: Fix screen tearing. CPU heavy.
          preset: switchauto
        - name: "SHOW ON-SCREEN DISPLAY MESSAGES"
          value: ShowDpMsg
          description: Show on screen display messages (memory card saves..).
          preset: switchauto
      RENDERING:
        - name: GRAPHICS API
          value: gfxbackend
          description: Choose which graphics API library to use.
          choices:
            - name: OpenGL
              value: OGL
            - name: Vulkan
              value: Vulkan
        - name: RENDERING RESOLUTION
          value: internal_resolution
          description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
          choices:
            - name: 1x native (640x528)
              value: 1
            - name: 2x 720p (1280x1056)
              value: 2
            - name: 3x 1080p (1920x1584)
              value: 3
            - name: 4x 1440p (2560x2112)
              value: 4
            - name: 5x (3200x2640)
              value: 5
            - name: 6x 4K (3840x3168)
              value: 6
            - name: 7x (4480x3696)
              value: 7
            - name: 8x 5K (5120x4224)
              value: 8
        - name: UBERSHADERS
          value: ubershaders
          description: "May not work well on all hardware. Hybrid is preferred, where supported."
          choices:
            - name: No Ubershaders
              value: 0
            - name: Exclusive Ubershaders
              value: 1
            - name: Hybrid Ubershaders
              value: 2
            - name: Skip Drawing
              value: 3
        - name: "PRE-CACHE SHADERS"
          value: wait_for_shaders
          description: "Compile shaders on next launch of game (one time). Reduces micro-freezes. Vulkan only."
          preset: switchauto
        - name: ANISOTROPIC FILTERING
          value: anisotropic_filtering
          description: Improves clarity of distant textures.
          choices:
            - name: Off
              value: 0
            - name: 2x
              value: 1
            - name: 4x
              value: 2
            - name: 8x
              value: 3
            - name: 16x
              value: 4
        - name: "ANTI-ALIASING"
          value: antialiasing
          description: Enhancement. Smooth out jagged edges on 3D object polygons.
          choices:
            - name: Off
              value: 0
            - name: 2x
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
        - name: "ANTI-ALIASING MODE"
          value: use_ssaa
          description: "Use SSAA instead of MSAA for anti-aliasing. SSAA may look better but has a higher performance cost."
          preset: switchauto
        - name: LOAD CUSTOM TEXTURES
          value: hires_textures
          description: ""
          preset: switchauto
        - name: MANUAL TEXTURE SAMPLING
          value: manual_texture_sampling
          description: Enabling will allow for correct emulation of texture wrapping. This comes at a cost of potential worse performance.
          preset: switchauto
      EMULATION:
        - name: DUAL CORE MODE
          value: dual_core
          description: Usually not much faster than single core mode.
          preset: switchauto
        - name: GPU SYNC
          value: gpu_sync
          description: Speed hack for dual core mode to fix some glitches.
          preset: switchauto
        - name: PERFORMANCE HACKS
          value: perf_hacks
          description: "Increase emulator performance, at the cost of accuracy/stability."
          preset: switchauto
        - name: ENABLE CHEATS
          value: enable_cheats
          description: To use game cheats or 16/9 Aspect Ratio Fix codes.
          preset: switchauto
        - name: MEMORY MANAGEMENT UNIT
          value: enable_mmu
          description: Required by some games.
          preset: switchauto
        - name: FAST DISK TRANSFER RATE
          value: enable_fastdisc
          description: Enhancement. Removes disc loading.
          preset: switchauto
        - name: VBI SKIP
          value: vbi_hack
          description: "Skips Vertical Blank Interrupts when lag is detected, allowing for smooth audio playback when emulation speed is not 100%."
          preset: switchauto
  CONTROLS:
    submenus:
      GAMECUBE CONTROLLER 1:
        - name: GAMECUBE PORT 1 TYPE
          value: dolphin_port_1_type
          description: Change what's plugged into the virtual GameCube ports.
          choices:
            - name: None
              value: 0
            - name: Standard Controller
              value: 6a
            - name: GameCube Controller
              value: 6b
            - name: GameCube Adapter for Wii U
              value: 12
            - name: Steering Wheel
              value: 8
            - name: Dance Mat
              value: 9
            - name: DK Bongos
              value: 10
            - name: Keyboard
              value: 7
        - name: ROTATE FACE BUTTONS
          value: alt_mappings_1
          description: "Moves South to West, West to North, etc. Standard controller type only."
          preset: switchauto
        - name: DEADZONE
          value: deadzone_1
          description: Set joystick deadzone.
          choices:
            - name: "0%"
              value: 0.0
            - name: "5% (Default)"
              value: 5.0
            - name: "10%"
              value: 10.0
            - name: "15%"
              value: 15.0
            - name: "20%"
              value: 20.0
            - name: "25%"
              value: 25.0
            - name: "30%"
              value: 30.0
        - name: JOYSTICK GATE SIZE
          value: jsgate_size_1
          description: Set virtual joysticks gate size. Smaller increases sensitivity. Larger decreases it.
          choices:
            - name: Smaller
              value: smaller
            - name: Normal (Default)
              value: normal
            - name: Larger
              value: larger
