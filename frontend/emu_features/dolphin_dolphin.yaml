systems:
  - name: gamecube
    groups:
      GENERAL:
        submenus:
          DISPLAY:
            - name: WIDESCREEN HACK (GLITCHY)
              value: widescreen_hack
              description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
              preset: switchauto
          EMULATION:
            - name: ENABLE BOOT ANIMATION
              value: dolphin_SkipIPL
              description: Enable Gamecube boot animation and BIOS access (requires IPL.bin BIOS in appropriate user directory).
              preset: switchauto
            - name: GAMECUBE LANGUAGE
              value: gamecube_language
              description: Change the Gamecube system language.
              choices:
                - name: English/Japanese
                  value: 0
                - name: German
                  value: 1
                - name: French
                  value: 2
                - name: Spanish
                  value: 3
                - name: Italian
                  value: 4
                - name: Dutch
                  value: 5
  - name: wii
    groups:
      GENERAL:
        submenus:
          DISPLAY:
            - name: WII TV MODE
              value: tv_mode
              description: Wii NAND's aspect ratio setting. Most games support both ratios natively.
              choices:
                - name: "4:3"
                  value: 0
                - name: "16:9"
                  value: 1
      CONTROLS:
        submenus:
          WII CONTROLLERS:
            - name: EMULATE WIIMOTE
              value: emulatedwiimotes
              description: Map your controller to an emulated Wiimote.
              preset: switchauto
            - name: "CUSTOMIZE EMULATED WIIMOTE & GAMEPAD"
              value: controller_mode
              description: "Emulate a Wiimote Sideway with L2 for Shake and Nunchuk on R-stick."
              choices:
                - name: Off
                  value: disabled
                - name: Classic Controller
                  value: cc
                - name: Classic Controller Pro
                  value: pro
                - name: Wiimote Sideway
                  value: side
                - name: Wiimote Sideway + Swing
                  value: is
                - name: Wiimote Sideway + Tilt
                  value: it
                - name: Wiimote Sideway + Nunchuk
                  value: in
            - name: SENSOR BAR POSITION
              value: sensorbar_position
              description: Position of wii sensor bar relative to the disaply for real wiimotes.
              choices:
                - name: Bottom (Default)
                  value: 0
                - name: Top
                  value: 1
            - name: DUALSHOCK MOTION CONTROL
              value: dsmotion
              description: Emulate the Wiimote pointer with a DS4's gyroscope.
              preset: switchauto
            - name: MOUSE AS WIIMOTE POINTER
              value: mouseir
              description: Emulate the Wiimote pointer with a mouse.
              preset: switchauto
          LIGHT GUNS:
            - name: SHOW LIGHT GUN CROSSHAIRS
              order: 99
              value: dolphin_crosshair
              description: ""
              preset: switchauto
