      VIDEO:
        - name: HYBRID RATIO
          value: melondsds_hybrid_ratio
          description: Size of the largest screen when using a hybrid screen layout.
          order: 160
          choices:
            - name: "3:1"
              value: 3
            - name: "2:1"
              value: 2
        - name: HYBRID SMALL SCREEN MODE
          value: melondsds_hybrid_smallscreen
          description: Select which screen will be shown when using hybrid layout.
          order: 161
          choices:
            - name: SHOW BOTH
              value: both
            - name: SHOW OPPOSITE
              value: one
