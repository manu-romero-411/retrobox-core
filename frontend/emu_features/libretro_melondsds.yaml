emulator_name: libretro
core_name: melondsds
features:
  - cheevos
sharedFeatures:
  - autosave
groups:
  GENERAL:
    submenus:
      VIDEO SETTINGS:
        - name: RENDERER MODE
          value: melondsds_render_mode
          description: "Software mode is faster and more accurate, while OpenGL mode supports scaling 3D graphics."
          choices:
            - name: Software
              value: software
            - name: OpenGL (Overwrites Libretro API settings)
              value: opengl
        - name: INTERNAL RESOLUTION
          value: melondsds_resolution
          description: Degree in which 3D graphics are scaled up. OpenGL renderer only.
          choices:
            - name: 1x native (256 x 192)
              value: 1
            - name: 2x native (512 x 384)
              value: 2
            - name: 3x native (768 x 576)
              value: 3
            - name: 4x native (1024 x 768)
              value: 4
            - name: 5x native (1280 x 960)
              value: 5
            - name: 6x native (1536 x 1152)
              value: 6
            - name: 7x native (1792 x 1344)
              value: 7
            - name: 8x native (2048 x 1536)
              value: 8
        - name: IMPROVED POLYGON SPLITTING
          value: melondsds_poygon
          description: Enable this if your game's 3D modles are not rendered correctly. OpenGL renderer only.
          choices:
            - name: Disabled
              value: disabled
            - name: Enabled
              value: enabled
        - name: SCREEN FILTERING
          value: melondsds_filtering
          description: Affects how the emulated screens are scaled. OpenGL renderer only.
          choices:
            - name: Nearest
              value: nearest
            - name: Linear
              value: linear
      SCREEN SETTINGS:
        - name: CURSOR MODE
          value: melondsds_cursor
          description: Determines how the cursor should apprear on the botton screen.
          choices:
            - name: Never
              value: never
            - name: While Touching
              value: touching
            - name: Until Timeout
              value: timeout
            - name: Always
              value: always
        - name: CURSOR TIMEOUT
          value: melondsds_cursor_timeout
          description: "Cursor timeout in seconds when using Cursor Mode - Until Timeout."
          choices:
            - name: 1 second
              value: 1
            - name: 2 seconds
              value: 2
            - name: 3 seconds
              value: 3
            - name: 5 seconds
              value: 5
            - name: 10 seconds
              value: 10
            - name: 15 seconds
              value: 15
            - name: 20 seconds
              value: 20
            - name: 30 seconds
              value: 30
            - name: 60 seconds
              value: 60
        - name: TOUCH MODE
          value: melondsds_touchmode
          description: Determine how the console's touch screen in emulated.
          choices:
            - name: Joystick
              value: joystick
            - name: Pointer
              value: pointer
        - name: SCREEN GAP (ONLY ON DS top/bottom MODE)
