      ON-SCREEN DISPLAY & NOTIFCATIONS:
        - name: WARN ABOUT UNSUPPORTED FEATURES
          value: melondsds_show_unsupported
          description: "Enable to display an on-screen message if trying to use unsupported features."
          choices:
            - name: Disabled
              value: disabled
            - name: Enabled
              value: enabled
        - name: WARN ABOUT BIOS PROBLEMS
          value: melondsds_show_bios
          description: Enable to display if your BIOS haas known problems.
          choices:
            - name: Disabled
              value: disabled
            - name: Enabled
              value: enabled
        - name: SHOW SCREEN LAYOUT
          value: melondsds_show_layout
          description: Enable to show which screen layout with the configured sequence is active.
          choices:
