emulator_name: amiberry
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - ratio
  - bezel
  - bezel_stretch
groups:
  ADVANCED OPTIONS:
    items:
      - name: LINE MODE
        value: amiberry_linemode
        description: Adjust screen line draw mode.
        choices:
          - name: SINGLE
            value: none
          - name: DOUBLE
            value: double
          - name: SCANLINES
            value: scanlines
      - name: REMOVE INTERLACE ARTIFACTS
        value: amiberry_flickerfixer
        description: Fix flickering in a static screen like Workbench.
        choices:
          - name: OFF
            value: False
          - name: ON
            value: True
  GENERAL:
    items:
      - name: VIDEO RESOLUTION
        value: amiberry_resolution
        description: "Manually define which internal resolution to use. AUTO = High."
        choices:
          - name: Low
            value: lores
          - name: High
            value: hires
          - name: Super high
            value: superhires
      - name: SCALING METHOD
        value: amiberry_scalingmethod
        description: Change pixel scaling and filtering method.
        choices:
          - name: Automatic
            value: automatic
          - name: Pixelated (Nearest)
            value: pixelated
          - name: Smooth (Linear)
            value: smooth
      - name: AUTO HEIGHT
        value: amiberry_auto_height
        description: Resize automatically screen height.
        choices:
          - name: OFF
            value: False
          - name: ON
            value: True
  KEYBOARD OPTIONS:
    items:
      - name: VIRTUAL KEYBOARD
        value: amiberry_virtual_keyboard
        description: Enable the Virtual Keyboard.
        choices:
          - name: OFF
            value: 0
          - name: ON
            value: 1
      - name: LARGER KEYBOARD
        value: amiberry_hires_keyboard
        description: "High-Resolution Keyboard, which is larger and might be easier to see."
        choices:
          - name: OFF
            value: 0
          - name: ON
            value: 1
      - name: KEYBOARD LAYOUT
        value: amiberry_vkbd_language
        description: This setting controls the default language layout for the virtual keyboard.
        choices:
          - name: US (Default)
            value: US
          - name: UK
            value: UK
          - name: FR
            value: FR
          - name: DE
            value: DE
      - name: KEYBOARD TRANSPARENCY
        value: amiberry_vkbd_transparency
        description: "Set the on-screen keyboard transparency (0-100%)."
        preset: slider
        preset-parameters: 0 100 5 60
