emulator_name: xroar
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
systems:
  - name: mc10
    groups:
      GENERAL:
        items:
          - name: RAM Size
            value: xroar_ram
            description: "Select the amount of RAM. MC-10 has 4K by default, expandable to 20K with a 16K expansion module."
            choices:
              - name: 4K
                value: 4
              - name: 20K
                value: 20
groups:
  GENERAL:
    items:
      - name: Machine Type
        value: xroar_machine
        description: Select the emulated hardware architecture machine type and architecture.
        choices:
          - name: Dragon 32
            value: dragon32
          - name: Dragon 64
            value: dragon64
          - name: Tano Dragon (NTSC)
            value: tano
          - name: Dragon Professional (Alpha)
            value: dragonpro
          - name: "Dragon 200-E"
            value: dragon200e
          - name: Dragon 64 + SAMx8 (512K)
            value: dragonx8
          - name: Tandy CoCo (PAL)
            value: coco
          - name: Tandy CoCo (NTSC)
            value: cocous
          - name: "Tandy CoCo 2B (PAL,T1)"
            value: coco2b
          - name: "Tandy CoCo 2B (NTSC,T1)"
            value: coco2bus
          - name: Tandy Deluxe CoCo
            value: deluxecoco
          - name: Tandy CoCo 3
            value: coco3
          - name: Tandy CoCo 3 (6309)
            value: coco3h
          - name: Tandy CoCo 3 (PAL)
            value: coco3p
          - name: "Tandy CoCo 3 (PAL, 6309)"
            value: coco3ph
          - name: "Dynacom MX-1600"
            value: mx1600
          - name: "Prologica CP-400"
            value: cp400
          - name: "Tandy MC-10"
            value: mc10
          - name: "Matra & Hachette Alice"
            value: alice
      - name: Cartridge Autostart
        value: xroar_cartauto
        description: ""
        choices:
          - name: Enabled
            value: True
          - name: Disabled
            value: False
      - name: VSYNC
        value: xroar_vsync
        description: ""
        choices:
          - name: Enabled
            value: True
          - name: Disabled
            value: False
      - name: TV Type
        value: xroar_tv_type
        description: Select the TV standard for video output.
        choices:
          - name: PAL
            value: pal
          - name: NTSC
            value: ntsc
          - name: "PAL-M"
            value: "pal-m"
      - name: TV Input
        value: xroar_tv_input
        description: Select the video signal type.
        choices:
          - name: Composite (Colour)
            value: svideo
          - name: Composite (Mono)
            value: mono
          - name: RGB
            value: rgb
      - name: Keyboard Translation
        value: xroar_kbd_translate
        description: Enable host keyboard translation to map typed characters to the emulated machine.
        choices:
          - name: Enabled
            value: True
          - name: Disabled
            value: False
