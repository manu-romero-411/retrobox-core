emulator_name: libretro
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - ratio
  - shaderset
  - smooth
  - integerscale
  - bezel
  - bezel_stretch
  - ai_service_enabled
  - ai_target_lang
  - ai_service_url
  - ai_service_pause
  - runahead
  - preemptiveframes
  - secondinstance
  - video_frame_delay_auto
  - vrr_runloop_enable
  - video_threaded
  - rumble_gain
  - audio_volume
  - bordersmode
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: gfxbackend
        description: Choose which graphics API library to use. Vulkan may not work for every core.
        choices:
          - name: OpenGL
            value: gl
          - name: GLCore
            value: glcore
          - name: Vulkan
            value: vulkan
  ADVANCED OPTIONS:
    items:
      - name: AUDIO DRIVER
        value: audio_driver
        description: "Changing driver can improve audio performance and reduce distortion. Alsathread is recommended for low-end systems."
        choices:
          - name: ALSA
            value: alsa
          - name: ALSAThread
            value: alsathread
          - name: TinyALSA
            value: tinyalsa
          - name: SDL2
            value: sdl2
          - name: Pulse (Default)
            value: pulse
      - name: AUDIO LATENCY
        value: audio_latency
        description: In milliseconds. Can reduce crackling/cutting out.
        choices:
          - name: 256
            value: 256
          - name: 192
            value: 192
          - name: 128
            value: 128
          - name: 64
            value: 64
          - name: 32
            value: 32
          - name: 16
            value: 16
          - name: 8
            value: 8
      - name: ALLOW ROTATION
        value: video_allow_rotate
        description: Allow cores to set rotation.
        choices:
          - name: On
            value: true
          - name: Off
            value: false
      - name: CONTROLLER TO LIGHT GUN
        value: lightgun_map
        description: Map controller inputs to light gun inputs.
        choices:
          - name: On
            value: true
          - name: Off
            value: false
      - name: DISPLAY FPS
        value: display_fps
        description: "Show FPS overlay in-game."
        choices:
          - name: On
            value: true
          - name: Off
            value: false
