emulator_name: libretro
core_name: fceumm
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: fceumm_show_crosshair
        description: ""
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
  GENERAL:
    items:
      - name: REDUCE SPRITE FLICKERING
        value: fceumm_nospritelimit
        description: Enhancement. Remove the eight sprites per line limit.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: CONTROLLER 1 TYPE
        value: controller1_nes
        description: ""
        choices:
          - name: Autodetect
            value: 1
          - name: NES Gamepad
            value: 513
          - name: NES Zapper
            value: 258
      - name: CONTROLLER 2 TYPE
        value: controller2_nes
        description: Paddle can only be used in port 2.
        choices:
          - name: Autodetect
            value: 1
          - name: NES Gamepad
            value: 513
          - name: NES Zapper
            value: 258
          - name: Arkanoid paddle
            value: 514
  ADVANCED OPTIONS:
    items:
      - name: CROP OVERSCAN
        value: fceumm_cropoverscan
        description: Zooms in to hide black borders. Borders are different per game.
        choices:
          - name: None
            value: none
          - name: Horizontal
            value: h
          - name: Vertical
            value: v
          - name: Both
            value: both
      - name: COLOR FILTER
        value: fceumm_palette
        description: Can be used to simulate colors of particular displays.
        choices:
          - name: default
            value: default
          - name: asqrealc
            value: asqrealc
          - name: "nintendo-vc"
            value: "nintendo-vc"
          - name: rgb
            value: rgb
          - name: "yuv-v3"
            value: "yuv-v3"
          - name: "unsaturated-final"
            value: "unsaturated-final"
          - name: "sony-cxa2025as-us"
            value: "sony-cxa2025as-us"
          - name: pal
            value: pal
          - name: "bmf-final2"
            value: "bmf-final2"
          - name: "bmf-final3"
            value: "bmf-final3"
          - name: "smooth-fbx"
            value: "smooth-fbx"
          - name: "composite-direct-fbx"
            value: "composite-direct-fbx"
          - name: "pvm-style-d93-fbx"
            value: "pvm-style-d93-fbx"
          - name: "ntsc-hardware-fbx"
            value: "ntsc-hardware-fbx"
          - name: "nes-classic-fbx-fs"
            value: "nes-classic-fbx-fs"
          - name: nescap
            value: nescap
          - name: wavebeam
            value: wavebeam
          - name: custom
            value: custom
      - name: BLARGG NTSC FILTER
        value: fceumm_ntsc_filter
        description: "Core-powered video filter."
        choices:
          - name: Off
            value: disabled
          - name: Composite (color bleeding + artifacts)
            value: composite
          - name: SVideo (color bleeding only)
            value: svideo
          - name: RGB (crisp image)
            value: rgb
      - name: SOUND QUALITY
        value: fceumm_sndquality
        description: Only supported games. Higher settings increase system requirements.
        choices:
          - name: Low
            value: Low
          - name: High
            value: High
          - name: Very High
            value: Very High
      - name: OVERCLOCK (UNSTABLE)
        value: fceumm_overclocking
        description: Enhancement. Reduces system slowdown. Causes issues in some games.
        choices:
          - name: disabled
            value: disabled
          - name: "2x-Postrender"
            value: "2x-Postrender"
          - name: "2x-VBlank"
            value: "2x-VBlank"
