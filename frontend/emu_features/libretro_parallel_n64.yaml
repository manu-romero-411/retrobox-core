emulator_name: libretro
core_name: parallel_n64
features:
  - cheevos
sharedFeatures:
  - autosave
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    submenus:
      CONTROLLER 1:
        - name: CONTROLLER TYPE
          value: "parallel-n64-controller1"
          description: Useful for N64 style controllers. Limited hotkeys for controllers without dedicated hotkey.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "parallel-n64-pak1"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
      CONTROLLER 2:
        - name: CONTROLLER TYPE
          value: "parallel-n64-controller2"
          description: Useful for N64 style controllers.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "parallel-n64-pak2"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
      CONTROLLER 3:
        - name: CONTROLLER TYPE
          value: "parallel-n64-controller3"
          description: Useful for N64 style controllers.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "parallel-n64-pak3"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
      CONTROLLER 4:
        - name: CONTROLLER TYPE
          value: "parallel-n64-controller4"
          description: Useful for N64 style controllers.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "parallel-n64-pak4"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
    items:
      - name: GRAPHICS PLUGIN
        value: "parallel-n64-gfxplugin"
        description: Choose the Parallel N64 graphics plugin.
        choices:
          - name: Glide64
            value: glide64
          - name: Gln64
            value: gln64
          - name: Rice
            value: rice
          - name: Angrylion
            value: angrylion
          - name: Parallel
            value: parallel
      - name: RENDERING RESOLUTION
        value: "parallel-n64-screensize"
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (320x240)
            value: 320x240
          - name: 2x (640x480)
            value: 640x480
          - name: 3x (960x720)
            value: 960x720
          - name: 4x (1280x960)
            value: 1280x960
          - name: 4.5x (1440x1080)
            value: 1440x1080
          - name: 5x (1600x1200)
            value: 1600x1200
          - name: 6x (1920x1440)
            value: 1920x1440
          - name: 7x (2240x1680)
            value: 2240x1680
          - name: 9x (2880x2160)
            value: 2880x2160
          - name: 18x (5760x4320)
            value: 5760x4320
      - name: AUTO WIDESCREEN
        value: "parallel_n64-widescreen"
        description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: WIDESCREEN HACK (GLITCHY)
        value: "parallel-n64-aspectratiohint"
        description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
        choices:
          - name: Off
            value: normal
          - name: On
            value: widescreen
      - name: JOYSTICK DEADZONE
        value: "parallel-n64-deadzone"
        description: Use to eliminate joystick drift/unwanted input. Effects all controllers.
        choices:
          - name: "0%"
            value: 0
          - name: "5%"
            value: 5
          - name: "15% (Default)"
            value: 15
          - name: "20%"
            value: 20
          - name: "25%"
            value: 25
          - name: "30%"
            value: 30
      - name: JOYSTICK SENSITIVITY
        value: "parallel-n64-sensitivity"
        description: Use to make joystick movement more or less sensitive. Effects all controllers.
        choices:
          - name: "50%"
            value: 50
          - name: "55%"
            value: 55
          - name: "60%"
            value: 60
          - name: "65%"
            value: 65
          - name: "70%"
            value: 70
          - name: "75%"
            value: 75
          - name: "80%"
            value: 80
          - name: "85%"
            value: 85
          - name: "90%"
            value: 90
          - name: "95%"
            value: 95
          - name: "100% (Default)"
            value: 100
          - name: "105%"
            value: 105
          - name: "110%"
            value: 110
          - name: "115%"
            value: 115
          - name: "120%"
            value: 120
          - name: "125%"
            value: 125
          - name: "130%"
            value: 130
          - name: "135%"
            value: 135
          - name: "140%"
            value: 140
          - name: "145%"
            value: 145
          - name: "150%"
            value: 150
  ADVANCED OPTIONS:
    items:
      - name: TEXTURE FILTERING
        value: "parallel-n64-filtering"
        description: Smooth textures on 3D objects.
        choices:
          - name: Automatic
            value: automatic
          - name: "N64 3-point"
            value: "N64 3-point"
          - name: Bilinear
            value: bilinear
          - name: Nearest
            value: nearest
      - name: FRAME RATE
        value: "parallel-n64-framerate"
        description: Full speed can break some games.
        choices:
          - name: Original
            value: original
          - name: Full speed
            value: fullspeed
