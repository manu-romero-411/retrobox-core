emulator_name: libretro
core_name: mednafen_psx
features:
  - cheevos
sharedFeatures:
  - autosave
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    items:
      - name: SHOW BIOS BOOTLOGO
        value: beetle_psx_hw_skip_bios
        description: Enhancement. Skipping it can break some games.
        choices:
          - name: Show
            value: disabled
          - name: Skip
            value: enabled
      - name: RENDERING RESOLUTION
        value: beetle_psx_hw_internal_resolution
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (320x240)
            value: 1x(native)
          - name: 2x (640x480)
            value: 2x
          - name: 4x (1280x960)
            value: 4x
          - name: 8x (2560x1920)
            value: 8x
          - name: 16x (5120x3840)
            value: 16x
      - name: WIDESCREEN HACK (GLITCHY)
        value: beetle_psx_hw_widescreen_hack
        description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: MULTITAP
        value: multitap_mednafen
        description: Allows up to 5 or 8 controllers in supported games.
        choices:
          - name: Off
            value: disabled
          - name: Port 1
            value: port1
          - name: Port 2
            value: port2
          - name: Port 1+2
            value: port12
      - name: CONTROLLER 1 TYPE
        value: beetle_psx_hw_Controller1
        description: DualShock has rumble support. Not all games support DualShock.
        choices:
          - name: Digital Controller
            value: 1
          - name: Analog Controller
            value: 261
          - name: DualShock Controller
            value: 517
          - name: Analog Joystick (Flystick)
            value: 773
          - name: Namco GunCon
            value: 260
          - name: NeGcon
            value: 1029
          - name: NeGcon (Rumble)
            value: 1285
          - name: Justifier
            value: 516
          - name: PlayStation Mouse
            value: 258
      - name: CONTROLLER 2 TYPE
        value: beetle_psx_hw_Controller2
        description: DualShock has rumble support. Not all games support DualShock.
        choices:
          - name: Digital Controller
            value: 1
          - name: Analog Controller
            value: 261
          - name: DualShock Controller
            value: 517
          - name: Analog Joystick (Flystick)
            value: 773
          - name: Namco GunCon
            value: 260
          - name: NeGcon
            value: 1029
          - name: NeGcon (Rumble)
            value: 1285
          - name: Justifier
            value: 516
          - name: PlayStation Mouse
            value: 258
  ADVANCED OPTIONS:
    items:
      - name: OVERCLOCK (UNSTABLE)
        value: beetle_psx_hw_cpu_freq_scale
        description: Enhancement. Reduces system slowdown. Causes issues in some games.
        choices:
          - name: "50%"
            value: "50%"
          - name: "60%"
            value: "60%"
          - name: "70%"
            value: "70%"
          - name: "80%"
            value: "80%"
          - name: "90%"
            value: "90%"
          - name: "100%(native)"
            value: "100%(native)"
          - name: "110%"
            value: "110%"
          - name: "120%"
            value: "120%"
          - name: "130%"
            value: "130%"
          - name: "140%"
            value: "140%"
          - name: "150%"
            value: "150%"
          - name: "160%"
            value: "160%"
          - name: "170%"
            value: "170%"
          - name: "180%"
            value: "180%"
          - name: "190%"
            value: "190%"
          - name: "200%"
            value: "200%"
          - name: "250%"
            value: "250%"
          - name: "300%"
            value: "300%"
          - name: "350%"
            value: "350%"
          - name: "4000%"
            value: "400%"
          - name: "450%"
            value: "450%"
          - name: "500%"
            value: "500%"
          - name: "550%"
            value: "550%"
          - name: "600%"
            value: "600%"
          - name: "650%"
            value: "650%"
          - name: "700%"
            value: "700%"
          - name: "750%"
            value: "750%"
      - name: FRAME DUPING (SPEED UP)
        value: beetle_psx_hw_frame_duping
        description: Small performance increase (may drop frames).
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: CPU DYNAREC (SPEED UP)
        value: beetle_psx_hw_cpu_dynarec
        description: Much faster than interpreter (but may have issues).
        choices:
          - name: Disabled (Beatle Interpreter)
            value: disabled
          - name: Max Performance
            value: execute
          - name: Cycle Timing Check
            value: execute_once
          - name: Lightrec Interpreter
            value: run_interpreter
      - name: DYNAREC CODE INVALIDATION
        value: beetle_psx_hw_dynarec_invalidate
        description: ""
        choices:
          - name: Full (more compatible)
            value: full
          - name: DMA Only (Slightly Faster)
            value: dma
