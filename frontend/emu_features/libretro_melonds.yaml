emulator_name: libretro
core_name: melonds
features:
  - cheevos
sharedFeatures:
  - autosave
groups:
  GENERAL:
    items:
      - name: NDS VERSION
        value: melonds_console_mode
        description: ""
        choices:
          - name: DS (Default)
            value: DS
          - name: DSi
            value: DSi
      - name: SKIP DS SYSTEM MENU
        value: melonds_boot_directly
        description: "Disable to access the system's settings, like time and language."
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: USE FIRMWARE SETTINGS
        value: melonds_use_fw_settings
        description: Use language and username from the NDS Firmware
        choices:
          - name: ON
            value: enable
          - name: OFF (Default)
            value: disable
      - name: LANGUAGE
        value: melonds_language
        description: Select language will be used if 'Use Firmware Settings' is disabled or if firmware file was not found.
        choices:
          - name: English (Default)
            value: English
          - name: French
            value: French
          - name: German
            value: German
          - name: Italian
            value: Italian
          - name: Spanish
            value: Spanish
          - name: Japanese
            value: Japanese
      - name: SCREEN LAYOUT
        value: melonds_screen_layout
        description: Arrange the dual screen layout.
        choices:
          - name: top/bottom
            value: Top/Bottom
          - name: bottom/top
            value: Bottom/Top
          - name: left/right
            value: Left/Right
          - name: right/left
            value: Right/Left
          - name: top only
            value: Top Only
          - name: bottom only
            value: Bottom Only
          - name: hybrid top ratio 2
            value: "Hybrid Top-Ratio2"
          - name: hybrid top ratio 3
            value: "Hybrid Top-Ratio3"
          - name: hybrid bottom ratio 2
            value: "Hybrid Bottom-Ratio2"
          - name: hybrid bottom ratio 3
            value: "Hybrid Bottom-Ratio3"
      - name: TOUCH SCREEN MODE
        value: melonds_touch_mode
        description: Select the input type to navigate the touch screen
        choices:
          - name: None
            value: Disabled
          - name: Mouse
            value: Mouse
          - name: Touch Screen
            value: Touch
          - name: Right Stick
            value: Joystick
