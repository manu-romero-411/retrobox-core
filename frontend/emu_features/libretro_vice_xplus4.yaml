emulator_name: libretro
core_name: vice_xplus4
features:
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: MODEL TYPE
        value: plus4_model
        description: ""
        choices:
          - name: PLUS4 PAL
            value: PLUS4 PAL
          - name: PLUS4 NTSC
            value: PLUS4 NTSC
          - name: C16 PAL
            value: C16 PAL
          - name: C16 NTSC
            value: C16 NTSC
          - name: V364 NTSC
            value: V364 NTSC
          - name: 232 NTSC
            value: 232 NTSC
      - name: ASPECT RATIO
        value: vice_aspect_ratio
        description: Change the output resolution ratio.
        choices:
          - name: PAL 576x312px
            value: pal
          - name: NTSC 492x262px
            value: ntsc
      - name: Button Options
        value: vice_retropad_options
        description: RetroPad Face Button Options.
        choices:
          - name: "B = Fire"
            value: disabled
          - name: "B = Fire, A = Up"
            value: jump
          - name: "Y = Fire"
            value: rotate
          - name: "Y = Fire, B = Up"
            value: rotate_jump
      - name: CONTROLLER PORT
        value: vice_joyport
        description: "Most games use port 2, some use port 1."
        choices:
          - name: Port 1
            value: 1
          - name: Port 2
            value: 2
      - name: CONTROLLER TYPE
        value: vice_joyport_type
        description: ""
        choices:
          - name: Joystick
            value: 1
          - name: Paddles
            value: 2
          - name: Mouse (1351)
            value: 3
          - name: "Trackball (Atari CX-22)"
            value: 6
          - name: Koalapad
            value: 10
  ADVANCED OPTIONS:
    items:
      - name: COLOR FILTER
        value: vice_plus4_external_palette
        description: Can be used to simulate colors of particular displays.
        choices:
          - name: default
            value: default
          - name: colodore_ted
            value: colodore_ted
          - name: "yape-pal"
            value: "yape-pal"
          - name: "yape-ntsc"
            value: "yape-ntsc"
      - name: ZOOM/CROP (HIDE BORDERS)
        value: vice_zoom_mode
        description: Hides borders on many games. Some games used the borders.
        choices:
          - name: "Auto-disable zoom"
            value: auto_disable
          - name: Auto zoom
            value: automatic
          - name: Off
            value: disabled
          - name: small
            value: small
          - name: medium
            value: medium
          - name: maximum
            value: maximum
      - name: KEYBOARD PASSTHROUGH
        value: vice_keyboard_pass_through
        description: Keyboard shortcuts unavailable if passing through the keyboard.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
