emulator_name: raze
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: raze_api
        description: Choose which graphics API library to use.
        choices:
          - name: OpenGL (x86 only)
            value: 0
          - name: Vulkan
            value: 1
          - name: OpenGLES (Default)
            value: 2
      - name: SKIP INTRO VIDEOS
        value: nologo
        description: ""
        choices:
          - name: Skip
            value: 1
          - name: Show (Default)
            value: 0
