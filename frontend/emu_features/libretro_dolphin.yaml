emulator_name: libretro
core_name: dolphin
sharedFeatures:
  - autosave
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: wii_resolution
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x native (640x528)
            value: x1 (640 x 528)
          - name: 2x 720p (1280x1056)
            value: x2 (1280 x 1056)
          - name: 3x 1080p (1920x1584)
            value: x3 (1920 x 1584)
          - name: 4x 1440p (2560x2112)
            value: x4 (2560 x 2112)
          - name: 5x (3200x2640)
            value: x5 (3200 x 2640)
          - name: 6x 4K (3840x3168)
            value: x6 (3840 x 3168)
      - name: LANGUAGE
        value: wii_language
        description: Wii NAND's language setting.
        choices:
          - name: English
            value: English
          - name: French
            value: French
          - name: German
            value: German
          - name: Spanish
            value: Spanish
          - name: Italian
            value: Italian
          - name: Dutch
            value: Dutch
          - name: Japanese
            value: Japanese
          - name: Simplified Chinese
            value: Simplified Chinese
          - name: Traditional Chinese
            value: Traditional Chinese
          - name: Korean
            value: Korean
      - name: WIDESCREEN HACK (GLITCHY)
        value: wii_widescreen_hack
        description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
  ADVANCED OPTIONS:
    items:
      - name: UBERSHADERS
        value: wii_shader_mode
        description: "May not work well on all hardware. Hybrid is preferred, where supported."
        choices:
          - name: No Ubershaders
            value: sync
          - name: Exclusive Ubershaders
            value: sync UberShaders
          - name: Hybrid Ubershaders
            value: "a-sync UberShaders"
          - name: Skip Drawing
            value: "a-sync Skip Rendering"
      - name: ANISOTROPIC FILTERING
        value: wii_anisotropic
        description: Improves clarity of distant textures.
        choices:
          - name: Off
            value: 1x
          - name: 2x
            value: 2x
          - name: 4x
            value: 4x
          - name: 8x
            value: 8x
          - name: 16x
            value: 16x
      - name: OSD MESSAGES
        value: wii_osd
        description: Enables or disable on screen messages.
        choices:
          - name: Disabled
            value: disabled
          - name: Enabled
            value: enabled
