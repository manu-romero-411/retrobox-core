    items:
      - name: SHOW BIOS BOOTLOGO
        value: gb_bootloader
        description: ""
        choices:
          - name: Show
            value: enabled
          - name: Skip
            value: disabled
      - name: LCD GHOSTING EFFECT
        value: gb_mix_frames
        description: Required for certain visual effects.
        choices:
          - name: Off
            value: disabled
          - name: Simple
            value: mix
          - name: LCD Ghosting (Accurate)
            value: lcd_ghosting
          - name: LCD Ghosting (Fast)
            value: lcd_ghosting_fast
