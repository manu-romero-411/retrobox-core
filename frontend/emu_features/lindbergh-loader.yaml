emulator_name: "lindbergh-loader"
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    items:
      - name: FREE PLAY
        value: lindbergh_freeplay
        description: Enable free play for supported games.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: REGION
        value: lindbergh_region
        description: Choose the arcade machine console region. This may be required to start the game.
        choices:
          - name: Japan (Default)
            value: JP
          - name: United States
            value: US
          - name: Export
            value: EX
      - name: ASPECT RATIO
        value: lindbergh_aspect
        description: "Set to maintain the aspect ratio (4:3) in games like Sega Race TV and Primeval Hunt."
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: FPS LIMITER
        value: lindbergh_limit
        description: "Enable this to limit the FPS in games that are uncapped, such as OutRun 2."
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: FPS TARGET
        value: lindbergh_fps
        description: Set the target FPS (only functions if FPS LIMITER is enabled).
        choices:
          - name: 30 fps
            value: 30
          - name: 50 fps
            value: 50
          - name: 60 fps (Default)
            value: 60
          - name: 75 fps
            value: 75
          - name: 100 fps
            value: 100
          - name: 120 fps
            value: 120
      - name: CONTROLLER MODE
        value: lindbergh_controller
        description: "Choose the controller configuration. EVDEV for a wide range of controllers, lightguns and steering wheels. SDL2 for gamepads only."
        choices:
          - name: SDL2
            value: 1
          - name: EVDEV (Default)
            value: 2
      - name: FORCE FEEDBACK
        value: lindbergh_ffb
        description: Enable force feedback (rumble) for supported games.
        choices:
          - name: Off
            value: 0
          - name: On (Default)
            value: 1
  GAME OPTIONS:
    items:
      - name: HUMMER FLICKER FIX
        value: lindbergh_hummer
        description: Set to 'On' if you experience flickering in Hummer.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: OUTRUN LENS GLARE
        value: lindbergh_lens
        description: Enable lens glare effects in OutRun 2.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: BOOST RENDER RES
        value: lindbergh_boost
        description: Upscale the rendering resolution to match the display size.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: PRIMEVAL HUNT MODE
        value: lindbergh_hunt
        description: Set the Primeval Hunt touchscreen mode.
        choices:
          - name: No touchscreen (Default)
            value: 1
          - name: Side by side
            value: 2
          - name: 3DS mode (right side)
            value: 3
          - name: 3DS mode (bottom side)
            value: 4
      - name: CARD READER
        value: lindbergh_card
        description: "Enable to emulate the card reader in Virtua Tennis 3, ID4/5 or R-Tuned."
        choices:
          - name: Off
            value: 0
          - name: On (Default)
            value: 1
      - name: CPU SPEED
        value: lindbergh_speed
        description: House of the Dead 4 speed fix. Select the base CPU frequency of your processor.
        preset: sliderauto
        preset-parameters: 0.5 6.0 0.1 GHz
      - name: IP ADDRESS
        value: lindbergh_ip
        description: Enable the IP address for OutRun 2 network play against another PC on the same local network.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: NETWORK PATCHES
        value: lindbergh_network_patches
        description: "Required for multi-cabinet networking with specific IP address."
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: RAMBO GUNS SWITCH
        value: lindbergh_rambo_switch
        description: Switch the gun display style in Rambo.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: CROSSHAIRS
        value: lindbergh_crosshairs
        description: "Enable crosshairs in supported lightgun games (Ghost Squad Evolution, HotD4/SP, Primeval Hunt, Rambo)."
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: SKIP OUTRUN CABINET CHECK
        value: lindbergh_cabinet_skip
        description: Bypass steering wheel and actuator hardware checks in OutRun 2 SP SDX. This may help booting on some systems but will disable force feedback.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: ORIGINAL FONTS
        value: lindbergh_disable_font
        description: Use the original fonts instead of the built in font.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: ORIGINAL LOGOS
        value: lindbergh_disable_logos
        description: Use the original logos instead of the built in logos.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
  ADVANCED OPTIONS:
    items:
      - name: RUN TEST MODE
        value: lindbergh_test
        description: Run the game in test mode to customise certain game options.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: USE ZINK FOR RENDERING
        value: lindbergh_zink
        description: "Fixes specific shadows and textures in the Virtua Tennis 3 and Virtua Fighter 5 franchises for non-Nvidia GPUs. May require the FPS limiter."
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: DEBUG MODE
        value: lindbergh_debug
        description: Enable debug logging to assist with troubleshooting issues.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
