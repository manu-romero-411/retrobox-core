emulator_name: libretro
core_name: "mesen-s"
features:
  - netplay
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  ADVANCED OPTIONS:
    items:
      - name: BLARGG NTSC FILTER
        value: "mesen-s_ntsc_filter"
        description: "Core-powered video filter."
        choices:
          - name: Disabled
            value: disabled
          - name: Composite (Blargg)
            value: Composite (Blargg)
          - name: "S-Video (Blargg)"
            value: "S-Video (Blargg)"
          - name: RGB (Blargg)
            value: RGB (Blargg)
          - name: Monochrome (Blargg)
            value: Monochrome (Blargg)
      - name: "HIGH-RES BLENDING"
        value: "mesen-s_blend_high_res"
        description: "Blur high-res mode, allowing for better transparency effects."
        choices:
          - name: On
            value: enabled
          - name: Off
            value: disabled
      - name: CUBIC AUDIO INTERPOLATION
        value: "mesen-s_cubic_interpolation"
        description: Enhancement. Swap from SNES' guassian interpolation to cubic. Improves sound quality.
        choices:
          - name: On
            value: enabled
          - name: Off
            value: disabled
      - name: GAME BOY MODE
        value: "mesen-s_gbmodel"
        description: Change behaviour when emulating GB games. Auto uses SGB for GB and GBC for GBC.
        choices:
          - name: Game Boy
            value: Game Boy
          - name: Game Boy Color
            value: Game Boy Color
          - name: Super Game Boy
            value: Super Game Boy
      - name: SUPER GAME BOY 2
        value: "mesen-s_sgb2"
        description: Emulate the Super Game Boy 2 for SGB. Runs games at the correct speed.
        choices:
          - name: On
            value: enabled
          - name: Off
            value: disabled
      - name: OVERCLOCK (UNSTABLE)
        value: "mesen-s_overclock"
        description: Enhancement. Reduces system slowdown. Causes issues in some games.
        choices:
          - name: None
            value: None
          - name: Low
            value: Low
          - name: Medium
            value: Medium
          - name: High
            value: High
          - name: Very High
            value: Very High
      - name: OVERCLOCK TYPE
        value: "mesen-s_overclock_type"
        description: "Prefer \"Before NMI\", change to After NMI only if needed by the game."
        choices:
          - name: Before NMI
            value: Before NMI
          - name: After NMI
            value: After NMI
      - name: SUPER FX OVERCLOCK
        value: "mesen-s_superfx_overclock"
        description: Enhancement. Reduces slowdown in mode 7 games.
        choices:
          - name: "100%"
            value: "100%"
          - name: "200%"
            value: "200%"
          - name: "300%"
            value: "300%"
          - name: "400%"
            value: "400%"
          - name: "500%"
            value: "500%"
          - name: "1000%"
            value: "1000%"
