emulator_name: moonlight
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - ratio
groups:
  ADVANCED OPTIONS:
    items:
      - name: VIDEO STREAM CODEC
        value: moonlight_codec
        description: "h265 (HEVC) is CPU heavy and increases latency, but is more bandwidth efficient."
        choices:
          - name: h264 (less latency)
            value: h264
          - name: h265 (HEVC) (higher quality at lower bitrates)
            value: h265
  GENERAL:
    items:
      - name: VIDEO STREAM RESOLUTION
        value: moonlight_resolution
        description: ""
        choices:
          - name: 720p (1280x720)
            value: 0
          - name: 1080p (1920x1080)
            value: 1
          - name: 4K (3840x2160)
            value: 2
      - name: ROTATE
        value: moonlight_rotate
        description: Output rotation independent of xrandr or framebuffer settings.
        choices:
          - name: 0 degrees
            value: 0
          - name: 90 degrees
            value: 90
          - name: 180 degrees
            value: 180
          - name: 270 degrees
            value: 270
      - name: VIDEO STREAM FRAME RATE
        value: moonlight_framerate
        description: ""
        choices:
          - name: 30FPS
            value: 0
          - name: 60FPS
            value: 1
          - name: 120FPS
            value: 2
      - name: VIDEO STREAM BITRATE
        value: moonlight_bitrate
        description: "Higher number for higher picture quality, but requires more bandwidth."
        choices:
          - name: 5Mbps (good for 720p)
            value: 0
          - name: 10Mbps (good for 1080p 60FPS)
            value: 1
          - name: 20Mbps (not supported by some routers)
            value: 2
          - name: 50Mbps (highest quality available)
            value: 3
      - name: DYNAMICALLY CALCULATE OPTIMAL SETTINGS
        value: moonlight_sops
        description: "Streaming Optimal Playable Settings, overrides other settings if enabled."
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: QUIT ON HOST
        value: moonlight_quitapp
        description: Close app on the remote host when quitting Moonlight.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: VIEW ONLY
        value: moonlight_viewonly
        description: "Disable all input processing (view-only mode)."
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: LAN / WAN STREAMING
        value: moonlight_remote
        description: Enable QOS settings to optimize for internet or local network.
        choices:
          - name: WAN
            value: yes
          - name: LAN (Default)
            value: no
      - name: SURROUND SOUND
        value: moonlight_surround
        description: Enables surround sound if your audio card supports it (Consumes more bandwidth).
        choices:
          - name: 5.1
            value: 5.1
          - name: 7.1
            value: 7.1
