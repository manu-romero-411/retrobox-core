          - name: "150%"
            value: 150
  ADVANCED OPTIONS:
    items:
      - name: TEXTURE FILTERING MODE
        value: "mupen64plus-BilinearMode"
        description: "Enhancement. 3 point is accurate to N64, standard is better."
        choices:
          - name: standard
            value: standard
          - name: 3 point
            value: 3point
      - name: "ANTI-ALIASING (MSAA)"
        value: "mupen64plus-MultiSampling"
        description: Enhancement. Smooth out jagged edges on 3D objects polygons.
        choices:
          - name: Off
            value: 0
          - name: 2x
            value: 2
          - name: 4x
            value: 4
          - name: 8x
            value: 8
          - name: 16x
            value: 16
      - name: TEXTURE FILTERING
        value: "mupen64plus-txFilterMode"
        description: Smooth textures on 3D objects.
        choices:
          - name: Off
            value: None
          - name: Smooth 1
            value: Smooth filtering 1
          - name: Smooth 2
            value: Smooth filtering 2
          - name: Smooth 3
            value: Smooth filtering 3
          - name: Smooth 4
            value: Smooth filtering 4
          - name: Sharp 1
            value: Sharp filtering 1
          - name: Sharp 2
            value: Sharp filtering 2
      - name: TEXTURE UPSCALING
        value: "mupen64plus-txEnhancementMode"
        description: Enhancement. Upscale textures.
        choices:
          - name: Off
            value: None
          - name: As Is
            value: As Is
          - name: X2
            value: X2
          - name: X2SAI
            value: X2SAI
          - name: HQ2X
            value: HQ2X
          - name: HQ2XS
            value: HQ2XS
          - name: LQ2X
            value: LQ2X
          - name: LQ2XS
            value: LQ2XS
          - name: HQ4X
            value: HQ4X
          - name: 2xBRZ
            value: 2xBRZ
          - name: 3xBRZ
            value: 3xBRZ
          - name: 4xBRZ
            value: 4xBRZ
          - name: 5xBRZ
            value: 5xBRZ
          - name: 6xBRZ
            value: 6xBRZ
      - name: RDP PLUGIN
        value: "mupen64plus-rdpPlugin"
        description: ""
        choices:
          - name: GLideN64 (Fastest)
            value: gliden64
          - name: "ParaLLEl-RDP"
            value: parallel
          - name: Angrylion (Most Compatible)
            value: angrylion
      - name: RSP PLUGIN
        value: "mupen64plus-rspPlugin"
        description: ""
        choices:
          - name: HLE (Fastest)
            value: hle
          - name: ParaLLEl (Best LLE)
            value: parallel
          - name: CXD4 (LLE Fallback)
            value: cxd4
      - name: CPU CORE
        value: "mupen64plus-cpuCore"
        description: ""
        choices:
          - name: Dynarec (Fastest)
            value: dynamic_recompiler
          - name: Cached Interpreter
            value: cached_interpreter
          - name: Pure Interpreter (Most Accurate)
            value: pure_interpreter
      - name: FRAME RATE
        value: "mupen64plus-Framerate"
        description: Full speed can break some games.
        choices:
          - name: Original
            value: Original
          - name: Full speed
            value: Fullspeed
      - name: "PARALLEL-RDP UPSCALER"
        value: "mupen64plus-parallel-rdp-upscaling"
        description: "Only applies when using Parallel-RDP as the chosen RDP Plugin."
        choices:
          - name: 1x (Default)
            value: 1x
          - name: 2x
            value: 2x
          - name: 4x
            value: 4x
          - name: 8x
            value: 8x
