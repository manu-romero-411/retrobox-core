emulator_name: libretro
core_name: "mupen64plus-next"
features:
  - cheevos
sharedFeatures:
  - autosave
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    submenus:
      CONTROLLER 1:
        - name: CONTROLLER TYPE
          value: "mupen64plus-controller1"
          description: Useful for N64 style controllers. Limited hotkeys for controllers without dedicated hotkey.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "mupen64plus-pak1"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
      CONTROLLER 2:
        - name: CONTROLLER TYPE
          value: "mupen64plus-controller2"
          description: Useful for N64 style controllers.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "mupen64plus-pak2"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
      CONTROLLER 3:
        - name: CONTROLLER TYPE
          value: "mupen64plus-controller3"
          description: Useful for N64 style controllers.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "mupen64plus-pak3"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
      CONTROLLER 4:
        - name: CONTROLLER TYPE
          value: "mupen64plus-controller4"
          description: Useful for N64 style controllers.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: CONTROLLER PAK
          value: "mupen64plus-pak4"
          description: Emulate a pak in the controller expansion port.
          choices:
            - name: Off
              value: none
            - name: Memory Pak
              value: memory
            - name: Rumble Pak
              value: rumble
            - name: Rumble Pak (Automatic)
              value: auto_rumble
    items:
      - name: "4:3 RENDERING RESOLUTION"
        value: "mupen64plus-43screensize"
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (320x240)
            value: 320x240
          - name: 2x (640x480)
            value: 640x480
          - name: 3x (960x720)
            value: 960x720
          - name: 4x (1280x960)
            value: 1280x960
          - name: 5x (1600x1200)
            value: 1600x1200
          - name: 6x (1920x1440)
            value: 1920x1440
          - name: 7x (2240x1680)
            value: 2240x1680
          - name: 8x (2560x1920)
            value: 2560x1920
          - name: 10x (3200x2400)
            value: 3200x2400
          - name: 11x (3520x2640)
            value: 3520x2640
          - name: 12x (3840x2880)
            value: 3840x2880
      - name: "16:9 RENDERING RESOLUTION"
        value: "mupen64plus-169screensize"
        description: "Enhancement. Increase the rendering resolution when in 16:9 ratio. Makes 3D objects clearer."
        choices:
          - name: 640x360
            value: 640x360
          - name: 960x540
            value: 960x540
          - name: 1280x720
            value: 1280x720
          - name: 1920x1080
            value: 1920x1080
          - name: 2560x1440
            value: 2560x1440
          - name: 3840x2160
            value: 3840x2160
          - name: 7680x4320
            value: 7680x4320
      - name: AUTO WIDESCREEN
        value: "mupen64plus-next-autowidescreen"
        description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: WIDESCREEN HACK (GLITCHY)
        value: "mupen64plus-aspect"
        description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
        choices:
          - name: Off
            value: 243
          - name: On
            value: "16:9 adjusted"
      - name: JOYSTICK DEADZONE
        value: "mupen64plus-deadzone"
        description: Use to eliminate joystick drift/unwanted input. Effects all controllers.
        choices:
          - name: "0%"
            value: 0
          - name: "5%"
            value: 5
          - name: "15% (Default)"
            value: 15
          - name: "20%"
            value: 20
          - name: "25%"
            value: 25
          - name: "30%"
            value: 30
      - name: JOYSTICK SENSITIVITY
        value: "mupen64plus-sensitivity"
        description: Use to make joystick movement more or less sensitive. Effects all controllers.
        choices:
