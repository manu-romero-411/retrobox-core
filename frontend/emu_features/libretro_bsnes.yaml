emulator_name: libretro
core_name: bsnes
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  GENERAL:
    items:
      - name: VIDEO FILTERS
        value: bsnes_video_filter
        description: Apply a video filter to mimic various NTSC TV signals.
        choices:
          - name: Off
            value: None
          - name: NTSC (RF)
            value: NTSC (RF)
          - name: NTSC (RGB)
            value: NTSC (RGB)
          - name: "NTSC (S-Video)"
            value: "NTSC (S-Video)"
          - name: NTSC (Composite)
            value: NTSC (Composite)
