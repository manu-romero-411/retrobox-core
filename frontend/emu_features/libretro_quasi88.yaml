emulator_name: libretro
core_name: quasi88
features:
  - netplay
  - padtokeyboard
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: PC MODEL
        value: q88_basic_mode
        description: ""
        choices:
          - name: N88 BASIC V2
            value: N88 V2
          - name: N88 BASIC V1H
            value: N88 V1H
          - name: N88 BASIC V1S
            value: N88 V1S
          - name: N BASIC
            value: N
      - name: CPU CLOCK
        value: q88_cpu_clock
        description: Slow down or speed up games as appropriate.
        choices:
          - name: 1 MHz (Underclock)
            value: 1
          - name: 2 MHz (Underclock)
            value: 2
          - name: 4 MHz (NEC uPD780)
            value: 4
          - name: 8 MHz (NEC uPID7008)
            value: 8
          - name: 16 MHz (Overclock)
            value: 16
          - name: 32 MHz (Overclock)
            value: 32
          - name: 64 MHz (Overclock)
            value: 64
  ADVANCED OPTIONS:
    items:
      - name: "EMULATE PCG-8100"
        value: "q88_pcg-8100"
        description: Required for some games.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
