emulator_name: libretro
core_name: px68k
features:
  - padtokeyboard
groups:
  GENERAL:
    items:
      - name: CPU CLOCK
        value: px68k_cpuspeed
        description: Slow down or speed up games as appropriate.
        choices:
          - name: 10Mhz
            value: 10Mhz
          - name: 16Mhz
            value: 16Mhz
          - name: 25Mhz
            value: 25Mhz
          - name: 33Mhz (Overclock)
            value: 33Mhz (OC)
          - name: 66Mhz (Overclock)
            value: 66Mhz (OC)
          - name: 100Mhz (Overclock)
            value: 100Mhz (OC)
          - name: 150Mhz (Overclock)
            value: 150Mhz (OC)
          - name: 200Mhz (Overclock)
            value: 200Mhz (OC)
      - name: EMULATED RAM SIZE
        value: px68k_ramsize
        description: ""
        choices:
          - name: 1MB
            value: 1MB
          - name: 2MB
            value: 2MB
          - name: 3MB
            value: 3MB
          - name: 4MB
            value: 4MB
          - name: 5MB
            value: 5MB
          - name: 6MB
            value: 6MB
          - name: 7MB
            value: 7MB
          - name: 8MB
            value: 8MB
          - name: 9MB
            value: 9MB
          - name: 10MB
            value: 10MB
          - name: 11MB
            value: 11MB
          - name: 12MB
            value: 12MB
      - name: FRAMESKIP
        value: px68k_frameskip
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: Full Frame
            value: Full Frame
          - name: 1/2 Frame
            value: 1/2 Frame
          - name: 1/3 Frame
            value: 1/3 Frame
          - name: 1/4 Frame
            value: 1/4 Frame
          - name: 1/5 Frame
            value: 1/5 Frame
          - name: 1/6 Frame
            value: 1/6 Frame
          - name: 1/8 Frame1
            value: 1/8 Frame1
          - name: 16 Frame
            value: 16 Frame
          - name: 1/32 Frame
            value: 1/32 Frame
          - name: 1/60 Frame
            value: 1/60 Frame
          - name: Auto Frame Skip
            value: Auto Frame Skip
      - name: JOYPAD TYPE
        value: px68k_joytype
        description: Applies to both players.
        choices:
          - name: Default (2 Buttons)
            value: Default (2 Buttons)
          - name: Megadrive (8 Buttons)
            value: "CPSF-MD (8 Buttons)"
          - name: Super Famicom (8 Buttons)
            value: "CPSF-SFC (8 Buttons)"
