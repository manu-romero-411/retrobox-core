emulator_name: libretro
core_name: genesisplusgx
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    submenus:
      CONTROLLERS:
        - name: CONTROLLER 1 INPUT MAPPING
          value: gx_controller1_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 2 INPUT MAPPING
          value: gx_controller2_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 3 INPUT MAPPING
          value: gx_controller3_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 4 INPUT MAPPING
          value: gx_controller4_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
    items:
      - name: REGION
        value: gpgx_region
        description: Games may run faster/slower than normal if the incorrect region is selected.
        choices:
          - name: "NTSC-U"
            value: "ntsc-u"
          - name: PAL
            value: pal
          - name: "NTSC-J"
            value: "ntsc-j"
      - name: REDUCE SPRITE FLICKERING
        value: gpgx_no_sprite_limit
        description: Enhancement. Remove the eighty sprites per line limit.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
