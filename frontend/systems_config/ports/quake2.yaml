quake2:
  fullname: Quake II
  manufacturer: Ports
  release: 1997
  hardware: port
  path: /var/penguintb/juegos/roms/quake2
  extension:
  - .quake2
  - .zip
  - .7zip
  platform:
  - pc
  theme: quake2
  group: ports
  emulators:
    libretro:
      vitaquake2: vitaquake2
    vkquake2:
      vkquake2:
        incompatible_extensions:
        - .zip
        - .7zip
    yquake2:
      yquake2:
        default: true
        incompatible_extensions:
        - .zip
        - .7zip
