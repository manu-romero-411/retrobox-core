apps:
  fullname: Apps
  manufacturer: _Retrobox
  release: None
  hardware: system
  path: ../resources/apps
  extension:
  - .webapp
  - .kodi
  platform:
  - apps
  theme: apps
  emulators:
    chrome:
      chrome:
        default: true
        incompatible_extensions:
        - .kodi
    firefox:
      firefox:
        incompatible_extensions:
        - .kodi
    kodi:
      kodi:
        incompatible_extensions:
        - .webapp
