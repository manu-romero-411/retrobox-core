ps2:
  fullname: PlayStation 2
  manufacturer: Sony
  release: 2000
  hardware: console
  path: /var/penguintb/juegos/roms/ps2
  extension:
  - .iso
  - .mdf
  - .nrg
  - .bin
  - .img
  - .dump
  - .gz
  - .cso
  - .chd
  - .m3u
  - .elf
  platform:
  - ps2
  theme: ps2
  emulators:
    libretro:
      pcsx2: pcsx2
      play:
        incompatible_extensions:
        - .m3u
    pcsx2:
      pcsx2:
        default: true
        incompatible_extensions:
        - .m3u
    play:
      play:
        incompatible_extensions:
        - .m3u
