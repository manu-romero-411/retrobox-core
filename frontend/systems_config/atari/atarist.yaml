atarist:
  fullname: Atari ST
  manufacturer: Atari
  release: 1985
  hardware: computer
  path: /var/penguintb/juegos/roms/atarist
  extension:
  - .st
  - .msa
  - .stx
  - .dim
  - .ipf
  - .m3u
  - .zip
  - .7z
  - .hd
  - .gemdos
  platform:
  - atarist
  theme: atarist
  emulators:
    clk:
      clk:
        incompatible_extensions:
        - .m3u
        - .7z
    hatari:
      hatari: hatari
    libretro:
      hatari:
        default: true
        incompatible_extensions:
        - .hd
        - .gemdos
      hatarib: hatarib
