dreamcast:
  fullname: Dreamcast
  manufacturer: Sega
  release: 1998
  hardware: console
  path: /var/penguintb/juegos/roms/dreamcast
  extension:
  - .cdi
  - .cue
  - .gdi
  - .chd
  - .m3u
  platform:
  - dreamcast
