uzebox:
  fullname: Uzebox
  manufacturer: Atmel
  release: 2008
  hardware: console
  path: /var/penguintb/juegos/roms/uzebox
  extension:
  - .uze
  - .bin
  - .zip
  platform:
  - uzebox
  theme: uzebox
  emulators:
    libretro:
      mame: mame
      uzem:
        default: true
        incompatible_extensions:
        - .bin
        - .zip
    mame:
      mame: mame
