c64:
  fullname: Commodore 64
  manufacturer: Commodore
  release: 1982
  hardware: computer
  path: /var/penguintb/juegos/roms/c64
  extension:
  - .d64
  - .d71
  - .d81
  - .crt
  - .prg
  - .tap
  - .t64
  - .m3u
  - .zip
  - .7z
  - .nib
  - .g64
  platform:
  - c64
  theme: c64
  group: c64
  emulators:
    libretro:
      vice_x64:
        default: true
      vice_x64sc: vice_x64sc
      vice_xscpu64: vice_xscpu64
    vice:
      x64:
        incompatible_extensions:
        - .m3u
        - .7z
      x64dtv:
        incompatible_extensions:
        - .m3u
        - .7z
      xscpu64:
        incompatible_extensions:
        - .m3u
        - .7z
