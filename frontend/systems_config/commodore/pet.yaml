pet:
  fullname: Commodore PET
  manufacturer: Commodore
  release: 1977
  hardware: computer
  path: /var/penguintb/juegos/roms/pet
  extension:
  - .a0
  - .b0
  - .crt
  - .d64
  - .d81
  - .prg
  - .tap
  - .t64
  - .m3u
  - .zip
  - .7z
  platform:
  - pet
  theme: pet
  emulators:
    libretro:
      vice_xpet: vice_xpet
    vice:
      xpet:
        default: true
        incompatible_extensions:
        - .m3u
        - .7z
