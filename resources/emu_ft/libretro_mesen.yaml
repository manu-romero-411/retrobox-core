emulator_name: libretro
core_name: mesen
features:
  - netplay
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: CONSOLE REGION
        value: mesen_region
        description: Dendy is a popular Russian clone with unique characteristics.
        choices:
          - name: NTSC
            value: NTSC
          - name: PAL
            value: PAL
          - name: Dendy
            value: Dendy
      - name: DISPLAY ROTATION
        value: mesen_screenrotation
        description: "Rotate the screen, useful for certain vertical gameplay homebrews."
        choices:
          - name: None
            value: None
          - name: 90 degrees
            value: 90 degrees
          - name: 180 degrees
            value: 180 degrees
          - name: 270 degrees
            value: 270 degrees
      - name: NTSC FILTER
        value: mesen_ntsc_filter
        description: "Core-powered video filter. Bisqwit filters are CPU heavy."
        choices:
          - name: Disabled
            value: Disabled
          - name: Composite (Blargg)
            value: Composite (Blargg)
          - name: "S-Video (Blargg)"
            value: "S-Video (Blargg)"
          - name: RGB (Blargg)
            value: RGB (Blargg)
          - name: Monochrome (Blargg)
            value: Monochrome (Blargg)
          - name: Bisqwit 2x
            value: Bisqwit 2x
          - name: Bisqwit 4x
            value: Bisqwit 4x
          - name: Bisqwit 8x
            value: Bisqwit 8x
      - name: REDUCE SPRITE FLICKERING
        value: mesen_nospritelimit
        description: Enhancement. Remove the eight sprite per line limit.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: COLOR PALETTE
        value: mesen_palette
        description: ""
        choices:
          - name: Default
            value: Default
          - name: Composite Direct (FirebrandX)
            value: Composite Direct (by FirebrandX)
          - name: Nes Classic
            value: Nes Classic
          - name: Nestopia (RGB)
            value: Nestopia (RGB)
          - name: Original Hardware (FirebrandX)
            value: Original Hardware (by FirebrandX)
          - name: PVM Style (FirebrandX)
            value: PVM Style (by FirebrandX)
          - name: Sony CXA2025AS
            value: Sony CXA2025AS
          - name: Unsaturated v6 (FirebrandX)
            value: Unsaturated v6 (by FirebrandX)
          - name: YUV v3 (Firebrand)
            value: YUV v3 (by FirebrandX)
          - name: Custom
            value: Custom
      - name: LOAD CUSTOM TEXTURES
        value: mesen_hdpacks
        description: For use with HD texture packs.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: (FDS) AUTOMATICALLY LOAD DISK SIDE A
        value: mesen_fdsautoinsertdisk
        description: Avoids having to manually load side A every time.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
  ADVANCED OPTIONS:
    items:
      - name: (FDS) FAST FORWARD DISK LOADING
        value: mesen_fdsfastforwardload
        description: Reduce load time at the cost of accuracy.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: DEFAULT POWER ON RAM STATE
        value: mesen_ramstate
        description: Useful for speedruns/glitches.
        choices:
          - name: All 0s (Default)
            value: All 0s (Default)
          - name: All 1s
            value: All 1s
          - name: Random Values
            value: Random Values
      - name: OVERCLOCK (UNSTABLE)
        value: mesen_overclock
        description: Enhancement. Reduces system slowdown. Causes issues in some games.
        choices:
          - name: None
            value: None
          - name: Low
            value: Low
          - name: Medium
            value: Medium
          - name: High
            value: High
          - name: Very High
            value: Very High
      - name: OVERCLOCK TYPE
        value: mesen_overclock_type
        description: "Prefer \"Before NMI\", change to After NMI only if needed by the game."
        choices:
          - name: Before NMI
            value: Before NMI (Recommended)
          - name: After NMI
            value: After NMI
