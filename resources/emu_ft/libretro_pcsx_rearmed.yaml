emulator_name: libretro
core_name: pcsx_rearmed
features:
  - cheevos
sharedFeatures:
  - autosave
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    items:
      - name: SHOW BIOS BOOTLOGO
        value: show_bios_bootlogo
        description: "Off is safer, On for specific games."
        choices:
          - name: Show
            value: enabled
          - name: Skip
            value: disabled
      - name: FRAMESKIP
        value: frameskip_pcsx
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: Off
            value: 0
          - name: 1
            value: 1
          - name: 2
            value: 2
          - name: 3
            value: 3
      - name: ENHANCED RENDERING RESOLUTION
        value: neon_enhancement
        description: Double the rendering resolution.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
          - name: On (Speed hack)
            value: enabled_with_speedhack
      - name: MULTITAP
        value: pcsx_rearmed_multitap
        description: Allows up to 5 or 8 controllers in supported games.
        choices:
          - name: Off
            value: disabled
          - name: Port1
            value: port 1 only
          - name: Port2
            value: port 2 only
          - name: Port1+2
            value: both
      - name: CONTROLLER 1 TYPE
        value: controller1_pcsx
        description: DualShock has rumble support. Not all games support DualShock.
        choices:
          - name: Digital Controller
            value: 1
          - name: Analog Controller
            value: 261
          - name: DualShock Controller
            value: 517
          - name: Namco GunCon
            value: 260
          - name: Hyper Blaster/Justifier
            value: 516
          - name: NeGcon
            value: 773
          - name: PlayStation Mouse
            value: 258
      - name: CONTROLLER 2 TYPE
        value: controller2_pcsx
        description: DualShock has rumble support. Not all games support DualShock.
        choices:
          - name: Digital Controller
            value: 1
          - name: Analog Controller
            value: 261
          - name: DualShock Controller
            value: 517
          - name: Namco GunCon
            value: 260
          - name: Hyper Blaster/Justifier
            value: 516
          - name: NeGcon
            value: 773
          - name: PlayStation Mouse
            value: 258
  ADVANCED OPTIONS:
    items:
      - name: SPECIFIC GAME FIXES
        value: game_fixes_pcsx
        description: ""
        choices:
          - name: Off
            value: disabled
          - name: Capcom VS games Expand Screen Width
            value: Capcom_fighting
          - name: Chrono Chross Odd/Even Bit Hack
            value: Chrono_Chross
          - name: Dark Forces Flat Tex Triangles Fix
            value: Dark_Forces
          - name: Diablo Music Fix
