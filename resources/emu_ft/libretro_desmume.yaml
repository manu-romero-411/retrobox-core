emulator_name: libretro
core_name: desmume
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: internal_resolution_desmume
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (256x192)
            value: 256x192
          - name: 2x (512x384)
            value: 512x384
          - name: 3x (768x576)
            value: 768x576
          - name: 4x (1024x768)
            value: 1024x768
          - name: 5x (1280x960)
            value: 1280x960
          - name: 6x (1536x1152)
            value: 1536x1152
          - name: 7x (1792x1344)
            value: 1792x1344
          - name: 8x (2048x1536)
            value: 2048x1536
          - name: 9x (2304x1728)
            value: 2304x1728
          - name: 10x (2560x1920)
            value: 2560x1920
      - name: TEXTURE SMOOTHING
        value: texture_smoothing
        description: Smooths out textures on 3D objects.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: SCREEN LAYOUT
        value: screens_layout
        description: Arrange the dual screen layout.
        choices:
          - name: top/bottom
            value: top/bottom
          - name: bottom/top
            value: bottom/top
          - name: left/right
            value: left/right
          - name: right/left
            value: right/left
          - name: top only
            value: top only
          - name: bottom only
            value: bottom only
          - name: quick switch
            value: quick switch
          - name: hybrid/top
            value: hybrid/top
          - name: hybrid/bottom
            value: hybrid/bottom
      - name: FRAMESKIP
        value: frameskip_desmume
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: Off
            value: 0
          - name: 1
            value: 1
          - name: 2
            value: 2
          - name: 3
            value: 3
          - name: 4
            value: 4
          - name: 5
            value: 5
          - name: 6
            value: 6
          - name: 7
            value: 7
          - name: 8
            value: 8
          - name: 9
            value: 9
  ADVANCED OPTIONS:
    items:
      - name: TEXTURE UPSCALING (XBRZ)
        value: texture_scaling
        description: Enhancement. Upscales textures on 3D objects.
        choices:
          - name: Off
            value: 1
          - name: 2x
            value: 2
          - name: 4x
            value: 4
      - name: "ANTI-ALIASING (MSAA)"
        value: multisampling
        description: Enhancement. Smooth out jagged edges on 3D object polygons.
        choices:
          - name: Off
            value: disabled
          - name: 2x
            value: 2
          - name: 4x
            value: 4
          - name: 8x
            value: 8
          - name: 16x
            value: 16
          - name: 32x
            value: 32
