emulator_name: libretro
core_name: swanstation
features:
  - cheevos
sharedFeatures:
  - autosave
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    items:
      - name: SHOW BIOS BOOTLOGO
        value: swanstation_PatchFastBoot
        description: Enhancement. Skipping it can break some games.
        choices:
          - name: Show
            value: false
          - name: Skip
            value: true
      - name: USE SOFTWARE RENDERING
        value: gpu_software
        description: "More accurate emulation, but slower."
        choices:
          - name: Off
            value: false
          - name: On
            value: true
      - name: RENDERING RESOLUTION
        value: swanstation_resolution_scale
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (320x240)
            value: 1
          - name: 2x (640x480)
            value: 2
          - name: 3x (960x720)
            value: 3
          - name: 4x (1280x960)
            value: 4
          - name: 5x (1600x1200)
            value: 5
          - name: 6x (1920x1440)
            value: 6
          - name: 7x (2240x1680)
            value: 7
          - name: 8x (2560x1920)
            value: 8
          - name: 9x (2880x2160)
            value: 9
      - name: TEXTURE FILTERING
        value: swanstation_texture_filtering
        description: Enhancement. Smooth/upscale textures.
        choices:
          - name: Nearest
            value: Nearest
          - name: Bilinear
            value: Bilinear
          - name: JINC2
            value: JINC2
          - name: xBR
            value: xBR
      - name: WIDESCREEN HACK (GLITCHY)
        value: swanstation_widescreen_hack
        description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
        choices:
          - name: Off
            value: false
          - name: On
            value: true
      - name: CONTROLLER 1 TYPE
        value: swanstation_Controller1
        description: DualShock has rumble support. Not all games support DualShock.
        choices:
          - name: None
            value: 0
          - name: Digital Controller (Gamepad)
            value: 1
          - name: Analog Controller (DualShock)
            value: 261
          - name: Analog Joystick
            value: 517
          - name: NeGcon
            value: 773
          - name: NeGcon (Rumble)
            value: 1029
          - name: Namco GunCon
            value: 260
          - name: PlayStation Mouse
            value: 258
      - name: CONTROLLER 2 TYPE
        value: swanstation_Controller2
        description: DualShock has rumble support. Not all games support DualShock.
        choices:
          - name: None
            value: 0
          - name: Digital Controller (Gamepad)
            value: 1
          - name: Analog Controller (DualShock)
            value: 261
          - name: Analog Joystick
            value: 517
          - name: NeGcon
            value: 773
          - name: NeGcon (Rumble)
            value: 1029
          - name: Namco GunCon
            value: 260
          - name: PlayStation Mouse
            value: 258
  ADVANCED OPTIONS:
    items:
      - name: ENABLE PGXP CORRECTIONS
        value: swanstation_pgxp
        description: "Reduces wobbly polygons & warping textures."
        choices:
          - name: Disabled
            value: false
          - name: Enabled (Default)
            value: true
      - name: "ANTI-ALIASING (MSAA/SSAA)"
        value: swanstation_antialiasing
        description: Enhancement. Smooth out jagged edges on 3D object polygons.
        choices:
          - name: Off
            value: 1
          - name: 2x MSAA
            value: 2
          - name: 4x MSAA
            value: 4
          - name: 8x MSAA
            value: 8
          - name: 16x MSAA
            value: 16
          - name: 32x MSAA
            value: 32
          - name: 2x SSAA
            value: "2-ssaa"
          - name: 4x SSAA
            value: "4-ssaa"
          - name: 8x SSAA
            value: "8-ssaa"
          - name: 16x SSAA
            value: "16-ssaa"
          - name: 32x SSAA
            value: "32-ssaa"
      - name: CROP OVERSCAN
        value: swanstation_CropMode
        description: Zooms in to hide black borders. Borders are different per game.
        choices:
          - name: Off
            value: None
          - name: Only Overscan Area
            value: Overscan
          - name: All Borders
            value: Borders
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: swanstation_Controller_ShowCrosshair
        description: None
        choices:
          - name: Off
            value: false
          - name: On
            value: true
