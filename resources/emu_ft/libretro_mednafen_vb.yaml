emulator_name: libretro
core_name: mednafen_vb
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: 3D MODE
        value: 3d_mode
        description: Select the 3D rendering mode.
        choices:
          - name: Anaglyph
            value: anaglyph
          - name: Cyberscope
            value: cyberscope
          - name: Side by side
            value: "side-by-side"
          - name: VLI
            value: vli
          - name: HLI
            value: hli
      - name: COLOR PALETTE (2D)
        value: 2d_color_mode
        description: ""
        choices:
          - name: original
            value: "black & red"
          - name: black/white
            value: "black & white"
          - name: black/blue
            value: "black & blue"
          - name: black/cyan
            value: "black & cyan"
          - name: black/electric cyan
            value: "black & electric cyan"
          - name: black/green
            value: "black & green"
          - name: black/magenta
            value: "black & magenta"
          - name: black/yellow
            value: "black & yellow"
