emulator_name: libretro
core_name: stella
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  DISPLAY:
    items:
      - name: CONSOLE DISPLAY
        value: stella_console
        description: Select the console video standard / display mode.
        choices:
          - name: Auto (Default)
            value: auto
          - name: NTSC
            value: ntsc
          - name: PAL
            value: pal
          - name: SECAM
            value: secam
          - name: NTSC50
            value: ntsc50
          - name: PAL60
            value: pal60
          - name: SECAM60
            value: secam60
      - name: PALETTE COLORS
        value: stella_palette
        description: Select the palette used to render colors.
        choices:
          - name: Standard (Default)
            value: standard
          - name: Z26
            value: z26
          - name: User
            value: user
          - name: Custom
            value: custom
      - name: TV EFFECTS
        value: stella_filter
        description: "Enable TV-like filtering / effects."
        choices:
          - name: Disabled (Default)
            value: disabled
          - name: Composite
            value: composite
          - name: "S-Video"
            value: "s-video"
          - name: RGB
            value: rgb
          - name: Badly adjusted
            value: badly adjusted
      - name: CROP HORIZONTAL OVERSCAN
        value: stella_crop_hoverscan
        description: Crop horizontal overscan.
        choices:
          - name: Disabled (Default)
            value: disabled
          - name: Enabled
            value: enabled
      - name: CROP VERTICAL OVERSCAN
        value: stella_crop_voverscan
        description: Crop vertical overscan (lines). Core default (0).
        preset: sliderauto
        preset-parameters: 0 24 1
      - name: NTSC ASPECT
        value: stella_ntsc_aspect
        description: NTSC aspect ratio correction. Core default (PAR).
        preset: sliderauto
        preset-parameters: "75 125 1 %"
      - name: PAL ASPECT
        value: stella_pal_aspect
        description: PAL aspect ratio correction. Core default (PAR).
        preset: sliderauto
        preset-parameters: "75 125 1 %"
      - name: PHOSPHOR MODE
        value: stella_phosphor
        description: Enable phosphor mode (motion blur) for flickering effects.
        choices:
          - name: Auto (Default)
            value: auto
          - name: Off
            value: off
          - name: On
            value: on
      - name: PHOSPHOR BLEND
        value: stella_phosphor_blend
        description: "Phosphor blend level. Core default (60%)."
        preset: sliderauto
        preset-parameters: "0 100 5 %"
  AUDIO:
    items:
      - name: STEREO SOUND
        value: stella_stereo
        description: Stereo sound output.
        choices:
          - name: Auto (Default)
            value: auto
          - name: Off
            value: off
          - name: On
            value: on
  CONTROLS:
    items:
      - name: PADDLE MOUSE SENSITIVITY
        value: stella_paddle_mouse_sensitivity
        description: Mouse sensitivity for paddles. Core default (10).
        preset: sliderauto
        preset-parameters: 1 30 1
      - name: PADDLE JOYPAD SENSITIVITY
        value: stella_paddle_joypad_sensitivity
        description: Joypad sensitivity for paddles. Core default  (3).
        preset: sliderauto
        preset-parameters: 1 20 1
      - name: PADDLE ANALOG SENSITIVITY
        value: stella_paddle_analog_sensitivity
        description: Analog sensitivity for paddles. Core default (20).
        preset: sliderauto
        preset-parameters: 0 30 1
      - name: PADDLE ANALOG DEADZONE
        value: stella_paddle_analog_deadzone
        description: Analog deadzone for paddles. Core default (15).
        preset: sliderauto
        preset-parameters: 0 30 1
      - name: PADDLE ANALOG ABSOLUTE
        value: stella_paddle_analog_absolute
        description: Use absolute analog input for paddles.
        choices:
          - name: Disabled (Default)
            value: disabled
          - name: Enabled
            value: enabled
  LIGHT GUN:
    items:
      - name: LIGHT GUN CROSSHAIRS
        value: stella_lightgun_crosshair
        description: Show a crosshair for lightgun games.
        choices:
          - name: Disabled (Default)
            value: disabled
          - name: Enabled
            value: enabled
