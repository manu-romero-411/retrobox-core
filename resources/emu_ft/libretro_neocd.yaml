emulator_name: libretro
core_name: neocd
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: CONSOLE REGION
        value: neocd_region
        description: Can change the language of some games.
        choices:
          - name: Japan
            value: Japan
          - name: USA
            value: USA
          - name: Europe
            value: Europe
      - name: NEO GEO CD BIOS
        value: neocd_bios
        description: Universe BIOS is not compatible with cheats.
        choices:
          - name: CDZ
            value: neocd_z.rom (CDZ)
          - name: CDZ MAME
            value: neocd.bin (CDZ)
          - name: CDZ Universe 3.3
            value: "uni-bioscd.rom (CDZ, Universe 3.3)"
      - name: "PER-GAME SAVES"
        value: neocd_per_content_saves
        description: Use one save file per game.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
