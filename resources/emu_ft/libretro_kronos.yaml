emulator_name: libretro
core_name: kronos
features:
  - cheevos
sharedFeatures:
  - autosave
groups:
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: kronos_resolution
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: original
            value: original
          - name: 480p
            value: 480p
          - name: 720p
            value: 720p
          - name: 1080p
            value: 1080p
          - name: 4k
            value: 4k
          - name: 8k
            value: 8k
      - name: IMPROVED MESH
        value: kronos_meshmode
        description: Replace meshed transparency by real transparency.
        choices:
          - name: Disabled
            value: disabled
          - name: Enabled
            value: enabled
      - name: IMPROVED BANDING
        value: kronos_bandingmode
        description: Apply gouraud shading instead of flat shading.
        choices:
          - name: Disabled
            value: disabled
          - name: Enabled
            value: enabled
      - name: AUTO WIDESCREEN
        value: "kronos-autowidescreen"
        description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: MULTITAP
        value: kronos_multitap
        description: Allows up to 7 or 12 controllers in supported games.
        choices:
          - name: Off
            value: disabled
          - name: Port1
            value: port1
          - name: Port2
            value: port2
          - name: Port1+2
            value: port12
      - name: BIOS Language
        value: kronos_language_id
        description: Choose system BIOS language.
        choices:
          - name: English
            value: English
          - name: German
            value: German
          - name: French
            value: French
          - name: Spanish
            value: Spanish
          - name: Italian
            value: Italian
          - name: Japanese
            value: Japanese
