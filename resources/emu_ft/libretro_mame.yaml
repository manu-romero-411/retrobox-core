emulator_name: libretro
core_name: mame
features:
  - netplay
  - padtokeyboard
sharedFeatures:
  - autosave
groups:
  ADVANCED OPTIONS:
    items:
      - name: OVERCLOCK (UNSTABLE)
        value: mame_cpu_overclock
        description: Enhancement. Reduces system slowdown. Causes issues in some games.
        choices:
          - name: default
            value: default
          - name: 30
            value: 30
          - name: 35
            value: 35
          - name: 40
            value: 40
          - name: 45
            value: 45
          - name: 50
            value: 50
          - name: 55
            value: 55
          - name: 60
            value: 60
          - name: 65
            value: 65
          - name: 70
            value: 70
          - name: 75
            value: 75
          - name: 80
            value: 80
          - name: 85
            value: 85
          - name: 90
            value: 90
          - name: 95
            value: 95
          - name: 100
            value: 100
          - name: 105
            value: 105
          - name: 110
            value: 110
          - name: 115
            value: 115
          - name: 120
            value: 120
          - name: 125
            value: 125
          - name: 130
            value: 130
          - name: 135
            value: 135
          - name: 140
            value: 140
          - name: 145
            value: 145
          - name: 150
            value: 150
      - name: HIGH SCORE PLUGIN
        value: hiscoreplugin
        description: Enable or disable high score saving
        choices:
          - name: Enabled (Default)
            value: 1
          - name: Disabled
            value: 0
      - name: COIN SOUND PLUGIN
        value: coindropplugin
        description: Play a coin drop sound effect when an insert coin button is pressed
        choices:
          - name: Enabled
            value: 1
          - name: Disabled (Default)
            value: 0
      - name: SHARE MAME ARTWORK
        value: sharemameart
        description: "Use the same art paths as standalone MAME - not recommended if using decorations or shaders."
        choices:
          - name: On (Default)
            value: 1
          - name: Off
            value: 0
      - name: CROP ARTWORK
        value: artworkcrop
        description: Crop MAME artwork to maximize the game screen and only fill unused space.
        choices:
          - name: On (Default)
            value: 1
          - name: Off
            value: 0
      - name: CUSTOM CONFIG
        value: customcfg
        description: "Use a custom MAME config, do not overwrite config on launch."
        choices:
          - name: On
            value: 1
          - name: Off (Default)
            value: 0
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: mame_altres
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 640x480
            value: 640x480
          - name: 800x600
            value: 800x600
          - name: 960x720
            value: 960x720
          - name: 1024x768
            value: 1024x768
          - name: 1280x720
            value: 1280x720
          - name: 1600x800
            value: 1600x800
          - name: 1920x1080
            value: 1920x1080
          - name: 2560x1440
            value: 2560x1440
          - name: 3840x2160
            value: 3840x2160
      - name: SPECIAL CONTROL LAYOUTS
        value: altlayout
        description: Controls for 5/6 button games and other unique controls
        choices:
          - name: Default Only
            value: default
          - name: SNES Style
            value: snes
          - name: Genesis/Megadrive Style
            value: megadrive
          - name: Modern Fightstick Style
            value: fightstick
          - name: Neo Geo Mini Pad
            value: neomini
          - name: Neo Geo CD Pad
            value: neocd
          - name: Twin Stick with Triggers
            value: twinstick
          - name: "Rotated 4-Way Stick (Q*Bert)"
            value: qbert
  LIGHT GUN:
    items:
      - name: "OFF-SCREEN RELOAD BUTTON"
        value: offscreenreload
        description: Set gun button 2 to reload.
        choices:
          - name: On
            value: 1
          - name: Off (Default)
            value: 0
