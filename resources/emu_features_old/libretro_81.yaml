emulator_name: libretro
core_name: 81
features:
  - netplay
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  ADVANCED OPTIONS:
    items:
      - name: COLORIZATION
        value: 81_chroma_81
        description: Emulate Chroma 81 interface (colorization).
        choices:
          - name: Autodetect
            value: automatic
          - name: Off
            value: disabled
          - name: On (forced)
            value: enabled
      - name: WRX HIGH RESOLUTION
        value: 81_highres
        description: Required for some homebrew.
        choices:
          - name: Autodetect
            value: automatic
          - name: Off
            value: none
          - name: On (forced)
            value: WRX
