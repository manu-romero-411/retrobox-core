emulator_name: libretro
core_name: snes9x
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  ADVANCED OPTIONS:
    items:
      - name: REDUCE SPRITE FLICKERING (UNSTABLE)
        value: reduce_sprite_flicker
        description: "Enhancement. Remove the thirty-two sprites per line limit. Crashes certain games."
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: OVERCLOCK (UNSTABLE)
        value: reduce_slowdown
        description: "Overclock the SNES CPU (Gradius 3, Super R-Type)."
        choices:
          - name: Off
            value: disabled
          - name: Light (load times)
            value: light
          - name: Compatible
            value: compatible
          - name: Max (demanding games)
            value: max
      - name: SUPER FX OVERCLOCK
        value: overclock_superfx
        description: Enhancement. Reduces slowdown in mode 7 games. Can cause issues in certain games.
        choices:
          - name: "50%"
            value: "50%"
          - name: "60%"
            value: "60%"
          - name: "70%"
            value: "70%"
          - name: "80%"
            value: "80%"
          - name: "90%"
            value: "90%"
          - name: "100%"
            value: "100%"
          - name: "150%"
            value: "150%"
          - name: "200%"
            value: "200%"
          - name: "250%"
            value: "250%"
          - name: "300%"
            value: "300%"
          - name: "350%"
            value: "350%"
          - name: "400%"
            value: "400%"
          - name: "450%"
            value: "450%"
          - name: "500%"
            value: "500%"
      - name: "BLEND HIGH-RES MODE"
        value: hires_blend
        description: "Blur high-res mode, allowing for better transparency effects."
        choices:
          - name: Off
            value: disabled
          - name: Merge
            value: merge
          - name: Blur
            value: blur
  GENERAL:
    items:
      - name: CONTROLLER 1 TYPE
        value: controller1_snes9x
        description: ""
        choices:
          - name: SNES Gamepad
            value: 1
          - name: SNES Mouse
            value: 2
      - name: CONTROLLER 2 TYPE
        value: controller2_snes9x
        description: Light guns can only be used in port 2.
        choices:
          - name: SNES Gamepad
            value: 1
          - name: SNES Mouse
            value: 2
          - name: SNES Multitap
            value: 257
          - name: Super Scope
            value: 260
          - name: Konami Justifier
            value: 516
          - name: M.A.C.S. Rifle
            value: 1028
      - name: CONTROLLER 3 TYPE
        value: controller3_snes9x
        description: "Konami Justifier P2 is daisy chained from controller 2, appears as port 3 to system."
        choices:
          - name: SNES Gamepad
            value: 1
          - name: Konami Justifier (P2)
            value: 772
      - name: BLARGG NTSC FILTER
        value: snes9x_blargg_filter
        description: Apply a video filter to mimic various NTSC TV signals.
        choices:
          - name: Off
            value: disabled
          - name: Monochrome
            value: monochrome
          - name: RF
            value: rf
          - name: RGB
            value: rgb
          - name: "S-Video"
            value: "s-video"
          - name: Composite
            value: composite
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: superscope_crosshair
        description: ""
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
