emulator_name: libretro
core_name: bluemsx
features:
  - padtokeyboard
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: ZOOM (HIDE BORDERS)
        value: bluemsx_overscan
        description: Hides borders on many games. Some games used the borders.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
          - name: MSX2
            value: MSX2
      - name: REDUCE SPRITE FLICKERING
        value: bluemsx_nospritelimits
        description: Enhancement. Remove the four sprites per line limit.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
