emulator_name: libretro
core_name: pcsx2
sharedFeatures:
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    submenus:
      SYSTEM:
        - name: BIOS FAST BOOT
          value: lr_pcsx2_fast_boot
          description: "Skip the bios boot logo, may cause default language issues."
          choices:
            - name: Disabled
              value: disabled
            - name: Enabled
              value: enabled
        - name: FAST CD/DVD ACCESS
          value: lr_pcsx2_fast_cdvd
          description: A small  number of games will have compatibility problems with this enabled.
          choices:
            - name: Disabled
              value: disabled
            - name: Enabled
              value: enabled
        - name: CHEATS
          value: lr_pcsx2_cheats
          description: "Enables cheats files to be read from the `cheats` directory."
          choices:
            - name: Disabled
              value: disabled
            - name: Enabled
              value: enabled
        - name: LANGUAGE UNLOCK
          value: lr_pcsx2_language_unlock
          description: Helps forcing an international Japanese version to English. Unlocking more European languages etc.
          choices:
            - name: Disabled
              value: disabled
            - name: Enabled
              value: enabled
      GRAPHICS:
        - name: RENDERING RESOLUTION
          value: lr_pcsx2_resolution
          description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
          choices:
            - name: 1x Native (PS2)
              value: 1x Native (PS2)
            - name: 2x Native (~720p)
              value: 2x Native (~720p)
            - name: 3x Native (~1080p)
              value: 3x Native (~1080p)
            - name: 4x Native (~1440p/2K)
              value: 4x Native (~1440p/2K)
            - name: 5x Native (~1800p/3K)
              value: 5x Native (~1800p/3K)
            - name: 6x Native (~2160p/4K)
              value: 6x Native (~2160p/4K)
            - name: 7x Native (~2530p)
              value: 7x Native (~2530p)
            - name: 8x Native (~2880p/5K)
              value: 8x Native (~2880p/5K)
            - name: 9x Native (~3240p)
              value: 9x Native (~3240p)
            - name: 10x Native (~3600p/6K)
              value: 10x Native (~3600p/6K)
            - name: 11x Native (~3960p)
              value: 11x Native (~3960p)
            - name: 12x Native (~4320p/8K)
              value: 12x Native (~4320p/8K)
            - name: 13x Native (~5824p)
              value: 13x Native (~5824p)
            - name: 14x Native (~6272p)
              value: 14x Native (~6272p)
            - name: 15x Native (~6720p)
              value: 15x Native (~6720p)
            - name: 16x Native (~7168p)
              value: 16x Native (~7168p)
        - name: TEXTURE FILTERING
          value: lr_pcsx2_texture_filtering
          description: Enhancement. Smooth/upscale textures on 3D objects.
          choices:
            - name: Nearest
              value: Nearest
            - name: Bilinear (Forced)
              value: Bilinear (Forced)
            - name: Bilinear (PS2)
              value: Bilinear (PS2)
            - name: Bilinear (Forced excluding sprite)
              value: Bilinear (Forced excluding sprite)
        - name: TRILINEAR FILTERING
          value: lr_pcsx2_trilinear_filtering
          description: Control the texture's trilinear filtering of the emulation.
          choices:
            - name: OFF
              value: False
            - name: Trilinear (PS2)
              value: Trilinear (PS2)
            - name: Trilinear (Forced)
              value: Trilinear (Forced)
        - name: ANISOTROPIC FILTERING
          value: lr_pcsx2_anisotropic
          description: Improves clarity of distant textures.
          choices:
            - name: OFF
              value: disabled
            - name: 2x
              value: 2x
            - name: 4x
              value: 4x
            - name: 8x
              value: 8x
            - name: 16x
              value: 16x
        - name: DITHERING
          value: lr_pcsx2_dithering
          description: Reduces banding between colours and improves the preceived colour depth.
          choices:
            - name: OFF
              value: False
            - name: Scaled
              value: Scaled
            - name: Unscaled
              value: Unscaled
            - name: Force 32bit
              value: Force 32bit
        - name: BLENDING ACCURACY
          value: lr_pcsx2_blending
          description: "The higher the setting, the more blending is emulated in the shader accurately, and the higher the speed penalty will be."
          choices:
            - name: Minimum
              value: Minimum
            - name: Basic
              value: Basic
            - name: Medium
              value: Medium
            - name: High
              value: High
            - name: Full
              value: Full
            - name: Maximum
              value: Maximum
