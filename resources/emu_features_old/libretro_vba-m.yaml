emulator_name: libretro
core_name: "vba-m"
features:
  - cheevos
sharedFeatures:
  - rewind
  - autosave
systems:
  - name: gb
    groups:
      GENERAL:
        items:
          - name: GB COLORIZATION
            value: palettes
            description: Add color to Game Boy games.
            choices:
              - name: original gameboy
                value: original gameboy
              - name: black and white
                value: black and white
              - name: gba sp
                value: gba sp
              - name: blue sea
                value: blue sea
              - name: dark knight
                value: dark knight
              - name: green forest
                value: green forest
              - name: hot desert
                value: hot desert
              - name: pink dreams
                value: pink dreams
              - name: weird colors
                value: weird colors
      ADVANCED OPTIONS:
        items:
          - name: COLOR CORRECTION
            value: gbcoloroption_gb
            description: Simulate LCD color inaccuracy.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
          - name: SUPER GB BORDERS
            value: showborders_gb
            description: Only for Super Game Boy enhanced games.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
  - name: gbc
    groups:
      ADVANCED OPTIONS:
        items:
          - name: COLOR CORRECTION
            value: gbcoloroption_gbc
            description: Simulate LCD color inaccuracy.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
          - name: SUPER GB BORDERS
            value: showborders_gbc
            description: Only for Super Game Boy enhanced games.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
