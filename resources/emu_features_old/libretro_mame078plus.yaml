emulator_name: libretro
core_name: mame078plus
features:
  - netplay
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  GENERAL:
    items:
      - name: CONTROL MAPPING
        value: "mame2003-plus_analog"
        description: ""
        choices:
          - name: Analog
            value: analog
          - name: Digital
            value: digital
      - name: FRAMESKIP
        value: "mame2003-plus_frameskip"
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: Off
            value: 0
          - name: 1
            value: 1
          - name: 2
            value: 2
          - name: 3
            value: 3
          - name: 4
            value: 4
          - name: 5
            value: 5
      - name: VERTICAL ROTATION (TATE)
        value: "mame2003-plus_tate_mode"
        description: Rotates screen by 90 degrees. Intended for rotating displays.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: NEO GEO BIOS
        value: "mame2003-plus_neogeo_bios"
        description: ""
        choices:
          - name: Console AES World
            value: "asia-aes"
          - name: Arcade MVS Europe
            value: euro
          - name: Arcade MVS USA
            value: us
          - name: Arcade MVS Japan
            value: japan
          - name: Arcade Universe BIOS 4.0 (Cheats)
            value: unibios40
          - name: Arcade Universe BIOS 3.3 (Cheats)
            value: unibios33
  ADVANCED OPTIONS:
    items:
      - name: INPUT INTERFACE
        value: "mame2003-plus_input_interface"
        description: Keyboard shortcuts unavailable if passing through the keyboard.
        choices:
          - name: Retropad
            value: retropad
          - name: Keyboard passthrough
            value: keyboard
          - name: Simultaneous
            value: simultaneous
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: "mame2003-plus_crosshair_enabled"
        description: ""
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
