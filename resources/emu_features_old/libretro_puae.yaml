      ADVANCED OPTIONS:
        items:
          - name: BOOT ANIMATION FIRST
            value: puae_cd_startup_delayed_insert
            description: Inserts CD during boot animation to prevent loading fail.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
          - name: CD TURBO SPEED
            value: puae_cd_speed
            description: Removes loading but can add possible glitches/crashes.
            choices:
              - name: Off
