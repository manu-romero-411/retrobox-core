emulator_name: libretro
core_name: puae
features:
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: AMIGA MODEL
        value: puae_model
        description: Force a specific model and prevent tags detection.
        choices:
          - name: Autodetect (by game name tag)
            value: automatic
          - name: A500 (512KB Chip + 512KB Slow)
            value: A500
          - name: A500+ (1MB Chip)
            value: A500PLUS
          - name: A600 (2MB Chip + 8MB Fast)
            value: A600
          - name: A1200 (2MB Chip + 8MB Fast)
            value: A1200
          - name: A4000/040 (2MB Chip + 8MB Fast)
            value: A4040
          - name: CDTV (1MB Chip)
            value: CDTV
          - name: CD32 Default (2MB Chip)
            value: CD32
          - name: CD32 (2MB Chip + 8MB Fast)
            value: CD32FR
      - name: CPU COMPATIBILITY
        value: cpu_compatibility
        description: Help games which are too quick or that have bugs.
        choices:
          - name: Normal
            value: normal
          - name: More compatible
            value: compatible
          - name: "Cycle-exact"
            value: exact
      - name: CPU CLOCK
        value: cpu_multiplier
        description: "Works with 'Cycle-exact' mode and for a few games."
        choices:
          - name: Default by model
            value: 0
          - name:  3.54 MHz
            value: 1
          - name:  7.09 MHz (A500 speed)
            value: 2
          - name: 14.18 MHz (A1200 speed)
            value: 4
          - name: 28.37 MHz
            value: 8
          - name: 35.46 MHz
            value: 10
          - name: 42.56 MHz
            value: 12
          - name: 56.75 MHz
            value: 16
      - name: CPU SPEED
        value: cpu_throttle
        description: "Ignored with 'Cycle-exact'."
        choices:
          - name: "-90%"
            value: "-900.0"
          - name: "-80%"
            value: "-800.0"
          - name: "-70%"
            value: "-700.0"
          - name: "-60%"
            value: "-600.0"
          - name: "-50%"
            value: "-500.0"
          - name: "-40%"
            value: "-400.0"
          - name: "-30%"
            value: "-300.0"
          - name: "-20%"
            value: "-200.0"
          - name: "-10%"
            value: "-100.0"
          - name: Default
            value: 0.0
          - name: "+100%"
            value: 1000.0
          - name: "+200%"
            value: 2000.0
          - name: "+300%"
            value: 3000.0
          - name: "+400%"
            value: 4000.0
          - name: "+500%"
            value: 5000.0
          - name: "+600%"
            value: 6000.0
          - name: "+700%"
            value: 7000.0
          - name: "+800%"
            value: 8000.0
          - name: "+900%"
            value: 9000.0
          - name: "+1000%"
            value: 10000.0
      - name: VIDEO FORMAT STANDARD
        value: video_standard
        description: ""
        choices:
          - name: PAL 288x576px 50Hz (auto)
            value: PAL auto
          - name: PAL 288x576px 50Hz
            value: PAL
          - name: NTSC 240x480px 60Hz
            value: NTSC
          - name: NTSC 240x480px 60Hz (auto)
            value: NTSC auto
      - name: VIDEO RESOLUTION
        value: video_resolution
        description: "Manually define which resolution to use.&#x0a;Auto defaults to High and switches to Super-High when needed."
        choices:
          - name: Low 360p
            value: lores
          - name: High 720p
            value: hires
          - name: "Super-high 1440p"
            value: superhires
      - name: FRAMESKIP
        value: gfx_framerate
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: Off
            value: disabled
          - name: 1
            value: 1
          - name: 2
            value: 2
      - name: MOUSE SPEED
        value: mouse_speed
        description: Affects mouse speed globally.
        choices:
          - name: original
            value: 100
          - name: "50%"
            value: 50
          - name: "70%"
            value: 70
          - name: "120%"
            value: 120
          - name: "150%"
            value: 150
          - name: "170%"
            value: 170
          - name: "200%"
            value: 200
      - name: JUMP ON B
        value: pad_options
        description: Makes second fire button press up instead.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: jump
  ADVANCED OPTIONS:
    items:
      - name: ZOOM/CROP (HIDE BORDERS)
        value: zoom_mode
        description: Hides borders on many games. Some games use the borders.
        choices:
          - name: Off
            value: none
          - name: Auto zoom
            value: automatic
          - name: minimum
            value: minimum
          - name: smaller
            value: smaller
          - name: small
            value: small
          - name: medium
            value: medium
          - name: large
            value: large
          - name: larger
            value: larger
          - name: maximum
            value: maximum
systems:
  - name: amiga500
    groups:
      ADVANCED OPTIONS:
        items:
          - name: FLOPPY TURBO SPEED
            value: puae_floppy_speed
            description: Removes loading but can add possible glitches/crashes.
            choices:
              - name: Off
                value: 100
              - name: On
                value: 0
          - name: 2P GAMEPAD MAPPING (KEYRAH)
            value: keyrah_mapping
            description: Keypad to joyport mappings for 2 players.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
          - name: WHDLOAD LAUNCHER
            value: whdload
            description: "Enable launching pre-installed WHDLoad installs."
            choices:
              - name: Off
                value: disabled
              - name: On
                value: config
          - name: DISABLE EMULATOR JOYSTICK
            value: disable_joystick
            description: Passes all physical keyboard events for Pad2Key.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
      GENERAL:
        items:
          - name: CONTROLLER 1 TYPE
            value: controller1_puae
            description: Select controller type for Amiga P1.
            choices:
              - name: Retropad
                value: 1
              - name: CD32 Pad
                value: 517
              - name: Analog Joystick
                value: 773
              - name: Joystick
                value: 261
              - name: Keyboard
                value: 259
          - name: CONTROLLER 2 TYPE
            value: controller2_puae
            description: Select controller type for Amiga P2.
            choices:
              - name: Retropad
                value: 1
              - name: CD32 Pad
                value: 517
              - name: Analog Joystick
                value: 773
              - name: Joystick
                value: 261
              - name: Keyboard
                value: 259
