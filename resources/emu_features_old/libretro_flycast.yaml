emulator_name: libretro
core_name: flycast
features:
  - cheevos
sharedFeatures:
  - autosave
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  ADVANCED OPTIONS:
    items:
      - name: SYNCHRONOUS RENDERING
        value: reicast_synchronous_rendering
        description: Can avoid flashing screen issues. Significant performance cost.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: ALPHA SORTING
        value: reicast_alpha_sorting
        description: Enhance graphics accuracy at the cost of inscreased performance requirements.
        order: 259
        choices:
          - name: "per-strip (fast, least accurate)"
            value: "per-strip (fast, least accurate)"
          - name: "per-triangle (normal)"
            value: "per-triangle (normal)"
          - name: "per-pixel (accurate)"
            value: "per-pixel (accurate)"
      - name: DIGITAL SOUND PROCESSOR
        value: reicast_dsp
        description: Enable the Dreamcast DSP for more accurate audio. Only recommended for fast systems.
        choices:
          - name: Disabled (Default)
            value: disabled
          - name: Enabled
            value: enabled
      - name: "TEXTURE MIP-MAPPING (BLUR)"
        value: reicast_mipmapping
        description: Smooth textures on distant 3D objects based on angle.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: ANISOTROPIC FILTERING
        value: reicast_anisotropic_filtering
        description: "Improves clarity of distant textures when mip-mapping is enabled."
        choices:
          - name: Off
            value: False
          - name: 2x
            value: 2
          - name: 4x
            value: 4
          - name: 8x
            value: 8
          - name: 16x
            value: 16
      - name: TEXTURE UPSCALING (XBRZ)
        value: reicast_texupscale
        description: Enhancement. Upscales screen textures (2D games only).
        choices:
          - name: Off
            value: 1
          - name: 2x
            value: 2
          - name: 4x
            value: 4
          - name: 6x
            value: 6
      - name: NATIVE DEPTH INTERPOLATION
        value: reicast_native_depth_interpolation
        description: Helps with texture corruption and depth issues on AMD GPUs. Can also help Intel GPUs in some cases.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: FORCE WINDOWS CE MODE
        value: reicast_force_wince
        description: Required for some games.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: reicast_internal_resolution
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (640x480)
            value: 640x480
          - name: 1.25x (800x600)
            value: 800x600
          - name: 1.5x (960x720)
            value: 960x720
          - name: 1.6x (1024x768)
            value: 1024x768
          - name: 2x (1280x960)
            value: 1280x960
          - name: 2.25x (1440x1080)
            value: 1440x1080
          - name: 2.5x (1600x1200)
            value: 1600x1200
          - name: 3x (1920x1440)
            value: 1920x1440
          - name: 4x (2560x1920)
            value: 2560x1920
          - name: 5x (3200x2400)
            value: 3200x2400
          - name: 6x (3840x2880)
            value: 3840x2880
          - name: 7x (4480x3360)
            value: 4480x3360
          - name: 8x (5120x3840)
            value: 5120x3840
          - name: 9x (5760x4320)
            value: 5760x4320
          - name: 10x (6400x4800)
            value: 6400x4800
          - name: 11x (7040x5280)
            value: 7040x5280
          - name: 12x (7680x5760)
            value: 7680x5760
      - name: FRAMESKIP
        value: reicast_frame_skipping
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: Off
            value: disabled
          - name: 1
            value: 1
          - name: 2
            value: 2
          - name: 3
            value: 3
          - name: 4
            value: 4
          - name: 5
            value: 5
          - name: 6
            value: 6
      - name: CONSOLE REGION
        value: reicast_region
        description: Choose the Dreamcast console region.
        choices:
          - name: USA
            value: Usa
          - name: Europe
            value: Europe
          - name: Japan
            value: Japan
          - name: Default
            value: Default
      - name: BIOS LANGUAGE
        value: reicast_language
        description: Dreamcast BIOS's language setting. Can change the language of some games. Some games default to Japanese.
        choices:
          - name: English
            value: English
          - name: German
            value: German
          - name: French
            value: French
          - name: Spanish
            value: Spanish
          - name: Italian
            value: Italian
          - name: Japanese
            value: Japanese
          - name: Default
            value: Default
      - name: AUTO WIDESCREEN
        value: "flycast-autowidescreen"
        description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: WIDESCREEN CHEAT (PRIORITY)
        value: reicast_widescreen_cheats
        description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: WIDESCREEN HACK (GLITCHY)
        value: reicast_widescreen_hack
        description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: CONTROLLER 1 TYPE
        value: controller1_dc
        description: ""
        choices:
          - name: Gamepad
            value: 1
