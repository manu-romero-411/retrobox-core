emulator_name: libretro
core_name: virtualjaguar
features:
  - padtokeyboard
  - cheevos
sharedFeatures:
  - autosave
groups:
  ADVANCED OPTIONS:
    items:
      - name: FAST BLITTER (LESS COMPATIBLE)
        value: usefastblitter
        description: For weak machines. Some games will not work with this.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: DOOM RES HACK
        value: doom_res_hack
        description: Enable for Doom to run at its correct resolution.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
  GENERAL:
    items:
      - name: SHOW BIOS BOOTLOGO
        value: bios_vj
        description: "Off is safer, On for specific games."
        choices:
          - name: Show
            value: enabled
          - name: Skip
            value: disabled
