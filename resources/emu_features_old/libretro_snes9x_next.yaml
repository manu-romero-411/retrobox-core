emulator_name: libretro
core_name: snes9x_next
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  GENERAL:
    items:
      - name: REDUCE SPRITE FLICKERING
        value: 2010_reduce_sprite_flicker
        description: "Enhancement. Remove the thirty-two sprites per line limit. Crashes certain games."
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: CONTROLLER 1 TYPE
        value: controller1_snes9x_next
        description: ""
        choices:
          - name: SNES Gamepad
            value: 1
          - name: SNES Mouse
            value: 2
      - name: CONTROLLER 2 TYPE
        value: controller2_snes9x_next
        description: Light guns/multitap.
        choices:
          - name: SNES Gamepad
            value: 1
          - name: SNES Mouse
            value: 2
          - name: SNES Multitap
            value: 257
          - name: Super Scope
            value: 260
          - name: Konami Justifier
            value: 516
          - name: Dual Konami Justifiers
            value: 772
      - name: BLARGG NTSC FILTER
        value: snes9x_2010_blargg_filter
        description: Apply a video filter to mimic various NTSC TV signals.
        choices:
          - name: Off
            value: disabled
          - name: Monochrome
            value: monochrome
          - name: RF
            value: rf
          - name: RGB
            value: rgb
          - name: "S-Video"
            value: "s-video"
          - name: Composite
            value: composite
  ADVANCED OPTIONS:
    items:
      - name: OVERCLOCK (UNSTABLE)
        value: 2010_reduce_slowdown
        description: "Overclock the SNES CPU (Gradius 3, Super R-Type)."
        choices:
          - name: Off
            value: disabled
          - name: Light (load times)
            value: light
          - name: Compatible
            value: compatible
          - name: Max (demanding games)
            value: max
      - name: SUPER FX OVERCLOCK
        value: 2010_overclock_superfx
        description: Enhancement. Reduces slowdown in mode 7 games.
        choices:
          - name: 5 MHz (Underclock)
            value: 5 MHz (Underclock)
          - name: 8 MHz (Underclock)
            value: 8 MHz (Underclock)
          - name: 9 MHz (Underclock)
            value: 9 MHz (Underclock)
          - name: 10 MHz (Default)
            value: 10 MHz (Default)
          - name: 11 MHz
            value: 11 MHz
          - name: 12 MHz
            value: 12 MHz
          - name: 13 MHz
            value: 13 MHz
          - name: 14 MHz
            value: 14 MHz
          - name: 15 MHz
            value: 15 MHz
          - name: 20 MHz
            value: 20 MHz
          - name: 30 MHz
            value: 30 MHz
          - name: 40 MHz
            value: 40 MHz
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: superscope_crosshair
        description: ""
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
