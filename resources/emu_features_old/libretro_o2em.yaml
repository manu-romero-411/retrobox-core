emulator_name: libretro
core_name: o2em
features:
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: EMULATED SYSTEM
        value: o2em_bios
        description: ""
        choices:
          - name: Odyssey 2 (NTSC)
            value: o2rom.bin
          - name: Videopac G7000 (European)
            value: c52.bin
          - name: Videopac+ G7400 (European)
            value: g7400.bin
          - name: Videopac+ G7400 (France)
            value: jopac.bin
      - name: CONSOLE REGION
        value: o2em_region
        description: ""
        choices:
          - name: Autodetect
            value: autodetect
          - name: NTSC 60Hz
            value: NTSC
          - name: PAL 50Hz
            value: PAL
      - name: SWAP GAMEPADS
        value: o2em_swap_gamepads
        description: Some games accept input from port 2 instead of port 1.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
  ADVANCED OPTIONS:
    items:
      - name: CROP OVERSCAN
        value: o2em_crop_overscan
        description: Zooms in to hide black borders.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: CRT GHOSTING EFFECT
        value: o2em_mix_frames
        description: Required for certain visual effects.
        choices:
          - name: Off
            value: disabled
          - name: Simple
            value: mix
          - name: "Ghosting (65%)"
            value: ghost_65
          - name: "Ghosting (75%)"
            value: ghost_75
          - name: "Ghosting (85%)"
            value: ghost_85
          - name: "Ghosting (95%)"
            value: ghost_95
      - name: AUDIO FILTER
        value: o2em_low_pass_range
        description: Soften the hash sound effect from some games.
        choices:
          - name: Off
            value: 0
          - name: "10%"
            value: 10
          - name: "20%"
            value: 20
          - name: "30%"
            value: 30
          - name: "40%"
            value: 40
          - name: "50%"
            value: 50
          - name: "60%"
            value: 60
          - name: "70%"
            value: 70
          - name: "80%"
            value: 80
          - name: "90%"
            value: 90
