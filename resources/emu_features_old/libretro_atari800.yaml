emulator_name: libretro
core_name: atari800
features:
  - padtokeyboard
systems:
  - name: atari800
    groups:
      ADVANCED OPTIONS:
        items:
          - name: ATARI SYSTEM
            value: atari800_system
            description: ""
            choices:
              - name: 400/600XL/800 (48K) (OS B)
                value: 400/800 (OS B)
              - name: 800XL/1200XL/XEGS (64K)
                value: 800XL (64K)
              - name: 130XE (128K)
                value: 130XE (128K)
              - name: Modern XL/XE (320K CS)
                value: Modern XL/XE(320K CS)
              - name: Modern XL/XE (576K)
                value: Modern XL/XE(576K)
              - name: Modern XL/XE (1088K)
                value: Modern XL/XE(1088K)
          - name: SIO ACCELERATION
            value: atari800_sioaccel
            description: Speeds up file loading. Some games won't load with this.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
          - name: "HI-RES ARTIFACTING"
            value: atari800_artifacting
            description: "Emulate NTSC quirks to show more colors in hi-res mode."
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
      GENERAL:
        items:
          - name: VIDEO FORMAT STANDARD
            value: atari800_ntscpal
            description: ""
            choices:
              - name: NTSC 240x480px 60Hz
                value: NTSC
              - name: PAL 288x576px 50Hz
                value: PAL
          - name: INTERNAL RESOLUTION
            value: atari800_resolution
            description: Use an alternate resolution. Some games need this.
            choices:
              - name: 336x240
                value: 336x240
              - name: 320x240
                value: 320x240
              - name: 384x240
                value: 384x240
              - name: 384x272
                value: 384x272
              - name: 384x288
                value: 384x288
              - name: 400x300
                value: 400x300
          - name: INTERNAL BASIC INTERPRETER
            value: atari800_internalbasic
            description: Enable the BASIC interpreter. Some games need this.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
  - name: atari5200
    groups:
      ADVANCED OPTIONS:
        items:
          - name: JOYSTICK HACK (FOR ROBOTRON 2084)
            value: atari800_opt2
            description: Treats the right analog stick as the second joystick.
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
