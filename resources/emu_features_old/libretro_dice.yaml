emulator_name: libretro
core_name: dice
groups:
  CONTROLS:
    items:
      - name: USE MOUSE POINTER FOR PADDLE 1
        value: ttl_use_mouse_pointer_for_paddle_1
        description: Use the system mouse pointer as paddle controller 1.  Does not let you choose a specific mouse if you have several.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: USE MOUSE FOR PADDLE 1
        value: ttl_retromouse_paddle0
        description: "Use a specific mouse for Paddle 1, chosen by Port 1's Mouse Index."
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: USE MOUSE FOR PADDLE 2
        value: ttl_retromouse_paddle1
        description: "Use a specific mouse for Paddle 2, chosen by Port 2's Mouse Index."
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: USE MOUSE FOR PADDLE 3
        value: ttl_retromouse_paddle2
        description: "Use a specific mouse for Paddle 3, chosen by Port 3's Mouse Index."
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: USE MOUSE FOR PADDLE 4
        value: ttl_retromouse_paddle3
        description: "Use a specific mouse for Paddle 4, chosen by Port 4's Mouse Index."
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: MOUSE AXIS FOR PADDLE 1 HORIZONTAL
        value: ttl_retromouse_paddle0_x
        description: "Mouse axis for player 1, horizontal screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: MOUSE AXIS FOR PADDLE 1 VERTICAL
        value: ttl_retromouse_paddle0_y
        description: "Mouse axis for player 1, vertical screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: MOUSE AXIS FOR PADDLE 2 HORIZONTAL
        value: ttl_retromouse_paddle1_x
        description: "Mouse axis for player 2, horizontal screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: MOUSE AXIS FOR PADDLE 2 VERTICAL
        value: ttl_retromouse_paddle1_y
        description: "Mouse axis for player 2, vertical screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: MOUSE AXIS FOR PADDLE 3 HORIZONTAL
        value: ttl_retromouse_paddle2_x
        description: "Mouse axis for player 3, horizontal screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: MOUSE AXIS FOR PADDLE 3 VERTICAL
        value: ttl_retromouse_paddle2_y
        description: "Mouse axis for player 3, vertical screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: MOUSE AXIS FOR PADDLE 4 HORIZONTAL
        value: ttl_retromouse_paddle3_x
        description: "Mouse axis for player 4, horizontal screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: MOUSE AXIS FOR PADDLE 4 VERTICAL
        value: ttl_retromouse_paddle3_y
        description: "Mouse axis for player 4, vertical screen motion."
        choices:
          - name: X
            value: x
          - name: Y
            value: y
      - name: "PADDLE D-PAD SENSITIVITY"
        value: ttl_paddle_keyboard_sensitivity
        description: "Sensitivity when using D-pad for a paddle."
        choices:
          - name: 125
            value: 125
          - name: 250
            value: 250
          - name: 375
            value: 375
          - name: 500
            value: 500
      - name: PADDLE ANALOG STICK SENSITIVITY
        value: ttl_paddle_joystick_sensitivity
        description: Sensitivity when using analog stick for a paddle.
        choices:
          - name: 125
            value: 125
          - name: 250
            value: 250
          - name: 375
            value: 375
          - name: 500
            value: 500
      - name: PADDLE MOUSE SENSITIVITY
        value: ttl_retromouse_paddle_sensitivity
        description: Sensitivity when using mouse for a paddle.
        choices:
          - name: 25
            value: 25
          - name: 50
            value: 50
          - name: 75
            value: 75
          - name: 100
            value: 100
          - name: 125
            value: 125
          - name: 250
            value: 250
          - name: 375
            value: 375
          - name: 500
            value: 500
      - name: WHEEL SENSITIVITY
        value: ttl_wheel_keyjoy_sensitivity
        description: "Sensitivity when using D-pad or analog stick for a wheel."
        choices:
          - name: 125
            value: 125
          - name: 250
            value: 250
          - name: 375
            value: 375
          - name: 500
            value: 500
      - name: THROTTLE SENSITIVITY
        value: ttl_throttle_keyjoy_sensitivity
        description: "Sensitivity when using D-pad or analog stick for a throttle."
        choices:
          - name: 125
            value: 125
          - name: 250
            value: 250
          - name: 375
            value: 375
          - name: 500
