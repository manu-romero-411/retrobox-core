emulator_name: libretro
core_name: vice_xscpu64
features:
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: MODEL TYPE
        value: c64_model
        description: Automatic switches region per file path tags
        choices:
          - name: C64 PAL Automatic
            value: C64 PAL auto
          - name: C64 NTSC Automatic
            value: C64 NTSC auto
          - name: C64 PAL
            value: C64 PAL
          - name: C64 NTSC
            value: C64 NTSC
          - name: C64 Games System PAL
            value: C64 GS PAL
          - name: C64 Japanese NTSC
            value: C64 JAP NTSC
      - name: COLOR FILTER
        value: vice_external_palette
        description: Can be used to simulate colors of particular displays.
        choices:
          - name: default
            value: default
          - name: colodore
            value: colodore
          - name: "pepto-pal"
            value: "pepto-pal"
          - name: "pepto-ntsc"
            value: "pepto-ntsc"
          - name: "pepto-ntsc-sony"
            value: "pepto-ntsc-sony"
          - name: cjam
            value: cjam
          - name: c64hq
            value: c64hq
          - name: c64s
            value: c64s
          - name: ccs64
            value: ccs64
          - name: "community-colors"
            value: "community-colors"
          - name: deekay
            value: deekay
          - name: frodo
            value: frodo
          - name: godot
            value: godot
          - name: pc64
            value: pc64
          - name: ptoing
            value: ptoing
          - name: rgb
            value: rgb
          - name: vice
            value: vice
      - name: ASPECT RATIO
        value: vice_aspect_ratio
        description: Change the output resolution ratio.
        choices:
          - name: PAL 576x312px
            value: pal
          - name: NTSC 492x262px
            value: ntsc
      - name: CONTROLLER PORT
        value: vice_joyport
        description: "Most games use port 2, some use port 1."
        choices:
          - name: Port 1
            value: 1
          - name: Port 2
            value: 2
      - name: CONTROLLER TYPE
        value: vice_joyport_type
        description: ""
        choices:
          - name: Joystick
            value: 1
          - name: Paddles
            value: 2
          - name: Mouse (1351)
            value: 3
          - name: "Trackball (Atari CX-22)"
            value: 6
          - name: Koalapad
            value: 10
  ADVANCED OPTIONS:
    items:
      - name: ZOOM/CROP (HIDE BORDERS)
        value: vice_zoom_mode
        description: Hides borders on many games. Some games used the borders.
        choices:
          - name: "Auto-disable zoom"
            value: auto_disable
          - name: Auto zoom
            value: automatic
          - name: Off
            value: disabled
          - name: small
            value: small
          - name: medium
            value: medium
          - name: maximum
            value: maximum
      - name: JUMP ON A
        value: vice_retropad_options
        description: Makes second fire button press up instead.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: jump
      - name: KEYBOARD PASSTHROUGH
        value: vice_keyboard_pass_through
        description: Keyboard shortcuts unavailable if passing through the keyboard.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
