emulator_name: libretro
core_name: opera
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: high_resolution
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (320x240)
            value: disabled
          - name: 2x (640x480)
            value: enabled
      - name: OVERCLOCK (UNSTABLE)
        value: cpu_overclock
        description: Enhancement. Reduces system slowdown. Causes issues in some games.
        choices:
          - name: 1.0x (12.50Mhz)
            value: 1.0x (12.50Mhz)
          - name: 1.1x (13.75Mhz)
            value: 1.1x (13.75Mhz)
          - name: 1.2x (15.00Mhz)
            value: 1.2x (15.00Mhz)
          - name: 1.5x (18.75Mhz)
            value: 1.5x (18.75Mhz)
          - name: 1.6x (20.00Mhz)
            value: 1.6x (20.00Mhz)
          - name: 1.8x (22.50Mhz)
            value: 1.8x (22.50Mhz)
          - name: 2.0x (25.00Mhz)
            value: 2.0x (25.00Mhz)
  ADVANCED OPTIONS:
    items:
      - name: ACTIVE INPUT DEVICES FIX
        value: active_devices
        description: Fixes a possible bug with multiple controllers detection.
        choices:
          - name: 1
            value: 1
          - name: 2
            value: 2
          - name: 3
            value: 3
          - name: 4
            value: 4
          - name: 5
            value: 5
          - name: 6
            value: 6
          - name: 7
            value: 7
          - name: 8
            value: 8
      - name: SPECIFIC GAME FIXES
        value: game_fixes_opera
        description: ""
        choices:
          - name: Off
            value: disabled
          - name: Alone in the Dark
            value: timing_hack6
          - name: "Crash-n Burn"
            value: timing_hack1
          - name: Dinopark Tycoon
            value: timing_hack3
          - name: Microcosm
            value: timing_hack5
      - name: NVRAM STORAGE
        value: opera_nvram_storage
        description: "Enable shared saves for multi-disc games"
        choices:
          - name: Shared
            value: shared
          - name: Per Game
            value: per game
