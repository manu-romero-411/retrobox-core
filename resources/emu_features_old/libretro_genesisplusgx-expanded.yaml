emulator_name: libretro
core_name: "genesis_plus_gx-expanded"
features:
  - netplay
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    submenus:
      CONTROLLERS:
        - name: CONTROLLER 1 INPUT MAPPING
          value: gx_controller1_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 2 INPUT MAPPING
          value: gx_controller2_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 3 INPUT MAPPING
          value: gx_controller3_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 4 INPUT MAPPING
          value: gx_controller4_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
    items:
      - name: REGION
        value: gpgx_region
        description: Games may run faster/slower than normal if the incorrect region is selected.
        choices:
          - name: "NTSC-U"
            value: "ntsc-u"
          - name: PAL
            value: pal
          - name: "NTSC-J"
            value: "ntsc-j"
      - name: REDUCE SPRITE FLICKERING
        value: gpgx_no_sprite_limit
        description: Enhancement. Remove the eighty sprites per line limit.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
systems:
  - name: megadrive
    groups:
      ADVANCED OPTIONS:
        items:
          - name: BLARGG NTSC FILTER
            value: gpgx_blargg_filter_md
            description: "Core-powered video filter."
            choices:
              - name: Off
                value: False
              - name: Composite (color bleeding + artifacts)
                value: composite
              - name: SVideo (color bleeding only)
                value: svideo
              - name: RGB (crisp image)
                value: rgb
          - name: FM SYNTHESIZER
            value: gpgx_fm
            description: Sound generator. MAME is faster and Nuked is cycle accurate. Original model used YM2612 while later revisions used YM3438.
            choices:
              - name: MAME (YM2612)
                value: mame (ym2612)
              - name: MAME (ASIC YM3438)
                value: mame (asic ym3438)
              - name: MAME (Enhanced YM3438)
                value: mame (enhanced ym3438)
              - name: Nuked (YM2612)
                value: nuked (ym2612)
              - name: Nuked (YM3438)
                value: nuked (ym3438)
      LIGHT GUN:
        items:
          - name: SHOW LIGHT GUN CROSSHAIRS
            value: gun_cursor_md
            description: ""
            choices:
              - name: Off
                value: disabled
              - name: On
                value: enabled
      GENERAL:
        submenus:
          CONTROLLERS:
            - name: CONTROLLER 1 TYPE
              value: controller1_md
              description: ""
              choices:
                - name: Joypad Auto
