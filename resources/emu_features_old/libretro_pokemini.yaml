emulator_name: libretro
core_name: pokemini
features:
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  ADVANCED OPTIONS:
    items:
      - name: LCD FILTER
        value: pokemini_lcdfilter
        description: Produces a clean LCD effect.
        choices:
          - name: Off
            value: none
          - name: On
            value: dotmatrix
      - name: LCD GHOSTING EFFECTS
        value: pokemini_lcdmode
        description: Required for certain visual effects.
        choices:
          - name: Off
            value: 3shades
          - name: On
            value: analog
