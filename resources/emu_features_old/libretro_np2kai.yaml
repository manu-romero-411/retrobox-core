emulator_name: libretro
core_name: np2kai
features:
  - netplay
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: PC MODEL
        value: np2kai_model
        description: ""
        choices:
          - name: "PC-286"
            value: "PC-286"
          - name: "PC-9801VM"
            value: "PC-9801VM"
          - name: "PC-9801VX"
            value: "PC-9801VX"
      - name: CPU FEATURE
        value: np2kai_cpu_feature
        description: Select the processor model.
        choices:
          - name: Intel 80386
            value: Intel 80386
          - name: Intel i486DX
            value: Intel i486DX
          - name: Intel Pentium (MMX)
            value: Intel MMX Pentium
          - name: Intel Pentium 2
            value: Intel Pentium II
          - name: Intel Pentium 3
            value: Intel Pentium III
          - name: Intel Pentium 4
            value: Intel Pentium 4
          - name: Neko Processor II
            value: Neko Processor II
      - name: OVERCLOCK MULTIPLIER
        value: np2kai_clk_mult
        description: ""
        choices:
          - name: 2x
            value: 2
          - name: 4x
            value: 4
          - name: 5x
            value: 5
          - name: 6x (Recommended)
            value: 6
          - name: 8x
            value: 8
          - name: 10x
            value: 10
          - name: 12x
            value: 12
          - name: 16x
            value: 16
          - name: 20x
            value: 20
          - name: 24x
            value: 24
          - name: 30x
            value: 30
          - name: 36x
            value: 36
          - name: 40x
            value: 40
          - name: 42x
            value: 42
          - name: 52x
            value: 52
          - name: 64x
            value: 64
          - name: 76x
            value: 76
          - name: 88x
            value: 88
          - name: 100x
            value: 100
      - name: EMULATED RAM SIZE
        value: np2kai_ExMemory
        description: ""
        choices:
          - name: 1MB
            value: 1
          - name: 3MB
            value: 2
          - name: 7MB
            value: 7
          - name: 11MB
            value: 11
          - name: 13MB (Recommended)
            value: 13
          - name: 16MB
            value: 16
          - name: 32MB
            value: 32
          - name: 64MB
            value: 64
          - name: 120MB
            value: 120
          - name: 230MB
            value: 230
          - name: 512MB
            value: 512
          - name: 1024MB
            value: 1024
      - name: JOY2KEY PROFILE
        value: np2kai_joymode
        description: Emulate a keyboard/mouse/joypad.
        choices:
          - name: Off
            value: False
          - name: Mouse
            value: Mouse
          - name: Arrows
            value: Arrows
          - name: Arrows 3button
            value: Arrows 3button
          - name: Keypad
            value: Keypad
          - name: Keypad 3button
            value: Keypad 3button
          - name: Manual keyboard
            value: Manual Keyboard
          - name: Atari Joypad
            value: Atari Joypad
  ADVANCED OPTIONS:
    items:
      - name: GDC
        value: np2kai_gdc
        description: Graphic Display Controller model.
        choices:
          - name: uPD7220
            value: uPD7220
          - name: uPD72020
            value: uPD72020
      - name: REMOVE SCANLINES
        value: np2kai_skipline
        description: "Older games skipped drawing every second line, this masks that."
        choices:
          - name: Full 255 lines
            value: Full 255 lines
          - name: Off
            value: False
          - name: On
            value: True
      - name: REAL PALETTES
        value: np2kai_realpal
        description: Some games rely on this (Apros).
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: SOUND BOARD
        value: np2kai_SNDboard
        description: 26K for old games and 86K for newer games.
        choices:
          - name: None
            value: None
          - name: "PC9801-14"
            value: "PC9801-14"
          - name: "PC9801-26K"
            value: "PC9801-26K"
          - name: "PC9801-26K + 86"
            value: "PC9801-26K + 86"
          - name: "PC9801-86"
            value: "PC9801-86"
          - name: "PC9801-86 + 118(B460)"
            value: "PC9801-86 + 118(B460)"
          - name: "PC9801-86 + 118(B460) + Sound Blaster 16"
            value: "PC9801-86 + 118(B460) + Sound Blaster 16"
          - name: "PC9801-86 + Mate-X PCM(B460)"
            value: "PC9801-86 + Mate-X PCM(B460)"
          - name: "PC9801-86 + Mate-X PCM(B460) + Sound Blaster 16"
            value: "PC9801-86 + Mate-X PCM(B460) + Sound Blaster 16"
          - name: "PC9801-86 + Chibi-oto"
            value: "PC9801-86 + Chibi-oto"
          - name: "PC9801-86 + Speek Board"
            value: "PC9801-86 + Speak Board"
          - name: "PC9801-86 + Sound Blaster 16"
            value: "PC9801-86 + Sound Blaster 16"
          - name: "PC9801-118"
            value: "PC9801-118"
          - name: "PC9801-118 + Sound Blaster 16"
            value: "PC9801-118 + Sound Blaster 16"
          - name: "AMD-98"
            value: "AMD-98"
          - name: "Chibi-oto"
            value: "Chibi-oto"
          - name: Sound Blaster 16
            value: Sound Blaster 16
          - name: Speak Board
            value: Speak Board
          - name: Spark Board
            value: Spark Board
          - name: Sound Orchestra
            value: Sound Orchestra
          - name: "Sound Orchestra-V"
            value: "Sound Orchestra-V"
          - name: Little Orchestra L
            value: Little Orchestra L
          - name: Multimedia Orchestra
            value: Multimedia Orchestra
          - name: "Mate-X PCM(B460)"
            value: "Mate-X PCM"
          - name: "Mate-X PCM + Sound Blaster 16"
            value: "Mate-X PCM + Sound Blaster 16"
          - name: "Otomi-chanx2"
            value: "Otomi-chanx2"
          - name: "Otomi-chanx2 + 86"
            value: "Otomi-chanx2 + 86"
          - name: WaveStar
            value: WaveStar
      - name: JAST SOUND
        value: np2kai_jast_snd
        description: "To have music and not only sound in games (Owl-Zoo)."
        choices:
          - name: Off
            value: False
          - name: On
            value: True
