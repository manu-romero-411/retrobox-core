emulator_name: libretro
core_name: mgba
features:
  - cheevos
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: SHOW BIOS BOOTLOGO
        value: skip_bios_mgba
        description: Requires BIOS file to be present.
        choices:
          - name: Show
            value: False
          - name: Skip
            value: True
systems:
  - name: gb
    groups:
      ADVANCED OPTIONS:
        items:
          - name: SUPER GB BORDERS
            value: sgb_borders
            description: Only for Super Game Boy enhanced games.
            choices:
              - name: Off
                value: False
              - name: On
                value: True
          - name: COLOR CORRECTION
            value: color_correction
            description: Simulate LCD color inaccuracy.
            choices:
              - name: Off
                value: False
              - name: On
                value: GBA
  - name: gbc
    groups:
