emulator_name: libretro
core_name: dosbox_pure
features:
  - padtokeyboard
groups:
  ADVANCED OPTIONS:
    items:
      - name: CPU TYPE
        value: pure_cpu_type
        description: Select which Intel CPU to emulate.
        choices:
          - name: Autodetect (Compatible)
            value: automatic
          - name: 386
            value: 386
          - name: 386 (slow)
            value: 386_slow
          - name: 386 (prefetch)
            value: 386_prefetch
          - name: 486 (slow)
            value: 486_slow
          - name: Pentium (slow)
            value: pentium_slow
      - name: CPU CORE METHOD
        value: pure_cpu_core
        description: Affects efficiency/stability.
        choices:
          - name: Optimized (auto)
            value: automatic
          - name: Dynamic (fast)
            value: dynamic
          - name: Normal (interpreter)
            value: normal
          - name: "Simple (interpreter for old real-mode games)"
            value: simple
      - name: ANALOG JOYSTICK DEADZONE
        value: pure_joystick_analog_deadzone
        description: Set the deadzone of the joystick analog sticks.
        choices:
          - name: "0%"
            value: 0
          - name: "5%"
            value: 5
          - name: "10%"
            value: 10
          - name: "15%"
            value: 15
          - name: "20%"
            value: 20
          - name: "25%"
            value: 25
          - name: "30%"
            value: 30
          - name: "35%"
            value: 35
          - name: "40%"
            value: 40
      - name: TIMED AXIS INTERVALS
        value: pure_joystick_timed
        description: Can fix drifting joysticks in games.
        choices:
          - name: On
            value: true
          - name: Off
            value: false
  GENERAL:
    items:
      - name: EMULATED CPU PERFORMANCE
        value: pure_cycles
        description: Manually set cycles per second. Use with caution.
        choices:
          - name: Autodetect (Compatible)
            value: automatic
          - name: MAX (as many as possible)
            value: max
          - name: "8086/8088, 4.77MHz (315 cps)"
            value: 315
          - name: "286, 6MHz (1320 cps)"
            value: 1320
          - name: "286, 12.5MHz (2750 cps)"
            value: 2750
          - name: "386, 20MHz (4720 cps)"
            value: 4720
          - name: "386DX, 33MHz (7800 cps)"
            value: 7800
          - name: "486DX, 33MHz (13400 cps)"
            value: 13400
          - name: "486DX2, 66MHz (26800 cps)"
            value: 26800
          - name: "Pentium, 100MHz (77000 cps)"
            value: 77000
          - name: "Pentium II, 300MHz (200000 cps)"
            value: 200000
          - name: "Pentium III, 600MHz (500000 cps)"
            value: 500000
          - name: "AMD Athlon, 1.2GHz (1000000 cps)"
            value: 1000000
      - name: EMULATED RAM SIZE
        value: pure_memory_size
        description: ""
        choices:
          - name: No EMS/XMS
            value: none
          - name: 4MB
            value: 4
          - name: 8MB
            value: 8
          - name: 16MB
            value: 16
          - name: 24MB
            value: 24
          - name: 32MB
            value: 32
          - name: 48MB
            value: 48
          - name: 64MB
            value: 64
          - name: 96MB
            value: 96
          - name: 128MB
            value: 128
          - name: 224MB
            value: 224
      - name: GRAPHICS CHIP TYPE
        value: pure_machine
        description: The emulated graphics card.
        choices:
          - name: SVGA
            value: svga
          - name: VGA
            value: vga
          - name: EGA
            value: ega
          - name: CGA
            value: cga
          - name: Tandy
            value: tandy
          - name: Hercules
            value: hercules
          - name: PCjr
            value: pcjr
      - name: PHYSICAL KEYBOARD LAYOUT
        value: pure_keyboard_layout
        description: "Does not affect the on-screen keyboard."
        choices:
          - name: US
            value: us
          - name: UK
            value: uk
          - name: Brazil
            value: br
          - name: Croatia
            value: hr
          - name: Czech Republic
            value: cz243
          - name: Denmark
            value: dk
          - name: Finland
            value: su
          - name: France
            value: fr
          - name: Germany
            value: gm
          - name: Greece
            value: gr
          - name: Hungary
            value: hu
          - name: Iceland
            value: is161
          - name: Italy
            value: it
          - name: Netherlands
            value: nl
          - name: Norway
            value: no
          - name: Poland
            value: pl
          - name: Portugal
            value: po
          - name: Russia
            value: ru
          - name: Slovakia
            value: sk
          - name: Slovenia
            value: si
          - name: Spain
            value: sp
          - name: Sweden
            value: sv
          - name: Switzerland (German)
            value: sg
          - name: Switzerland (French)
            value: sf
          - name: Turkey
            value: tr
      - name: OS DISK MODIFICATIONS
        value: pure_bootos_ramdisk
        description: OS Disk Modifications
        choices:
          - name: Keep (default)
            value: false
          - name: Discard
            value: true
          - name: Save Difference Per Content
            value: diff
      - name: SAVESTATE/REWIND
        value: pure_savestate
        description: Rewind can be CPU heavy.
        choices:
          - name: On
            value: True
          - name: On with rewind support
            value: rewind
          - name: Off
            value: disabled
      - name: GAMEPAD AUTOMATIC MAPPING
        value: pure_auto_mapping
        description: Apply a joy2key profile for the current game.
        choices:
          - name: On
            value: true
          - name: On with game detection message
            value: notify
          - name: Off
            value: false
      - name: CONTROLLER 1 TYPE
        value: controller1_dosbox_pure
        description: ""
        choices:
          - name: "Gravis GamePad (D-pad + 4 Btns)"
            value: 1
          - name: Generic Keyboard Binds
            value: 257
          - name: Keyboard + Mouse (Left An.)
            value: 513
          - name: Keyboard + Mouse (Right An.)
            value: 769
          - name: "1st Joystick (2 Axes, 2 Btns)"
            value: 1281
          - name: "Flight Stick (3 Axes, 4 Btns, 1 Hat)"
            value: 1793
          - name: "Both Joysticks (4 Axes, 4 Btns)"
            value: 2049
          - name: Custom Keyboard Binds (best for Pad2Key)
            value: 3
      - name: CONTROLLER 2 TYPE
        value: controller2_dosbox_pure
        description: ""
        choices:
          - name: "Gravis GamePad (D-pad + 4 Btns)"
            value: 1
          - name: Generic Keyboard Binds
            value: 257
          - name: Keyboard + Mouse (Left An.)
            value: 513
          - name: Keyboard + Mouse (Right An.)
            value: 769
          - name: "2nd Joystick (2 Axes, 2 Btns)"
            value: 1537
          - name: "Flight Stick (3 Axes, 4 Btns, 1 Hat)"
            value: 1793
          - name: "Both Joysticks (4 Axes, 4 Btns)"
            value: 2049
          - name: Custom Keyboard Binds (best for Pad2Key)
            value: 3
      - name: SOUNDBLASTER TYPE
        value: pure_sblaster_type
        description: Type of emulated SoundBlaster card.
        choices:
          - name: SounBlaster 16 (Default)
            value: sb16
          - name: SounBlaster Pro 2
            value: sbpro2
          - name: SounBlaster Pro
            value: sbpro1
          - name: SounBlaster 2.0
            value: sb2
          - name: SounBlaster 1.0
            value: sb1
          - name: GameBlaster
            value: gb
      - name: ENABLE GRAVIS ULTRASOUND
        value: pure_gravis
        description: "Enable Gravis Utrasound emulation. Ensure the ULTRASND folder is in the root of your <game>.pc rom folder."
        choices:
          - name: Off (Default)
            value: false
          - name: On
            value: true
      - name: MIDI OUTPUT
        value: pure_midi
        description: "Select the .SF2 SoundFont file, .ROM file, or interface used for MIDI output."
        choices:
          - name: General MIDI SoundFont (Default)
            value: zcsf.sf2
          - name: "Roland MT-32/CM-32L"
            value: scummvm/extra/MT32_CONTROL.ROM
          - name: Frontend MIDI driver
            value: frontend
          - name: Off
            value: disabled
