vectrex:
  fullname: Vectrex
  manufacturer: MB
  release: 1982
  hardware: console
  path: /var/penguintb/juegos/roms/vectrex
  extension:
  - .bin
  - .gam
  - .vec
  - .zip
  - .7z
  platform:
  - vectrex
  theme: vectrex
  emulators:
    libretro:
      cores:
        vecx:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
