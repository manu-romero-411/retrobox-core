scv:
  fullname: Super Cassette Vision
  manufacturer: Epoch
  release: 1984
  hardware: console
  path: /var/penguintb/juegos/roms/scv
  extension:
  - .bin
  - .zip
  - '.0'
  platform:
  - scv
  theme: scv
  emulators:
    libretro:
      cores:
        emuscv:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
