cassettevision:
  fullname: Cassette Vision
  manufacturer: Epoch
  release: 1981
  hardware: console
  path: /var/penguintb/juegos/roms/cassettevision
  extension:
  - .zip
  - .bin777
  platform:
  - cassettevision
  theme: cassettevision
  emulators:
    libretro:
      cores:
        pd777:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
