gamecom:
  fullname: Game.com
  manufacturer: Tiger Electronics
  release: 1997
  hardware: portable
  path: /var/penguintb/juegos/roms/gamecom
  extension:
  - .bin
  - .tgc
  - .zip
  - .7z
  platform:
  - gamecom
  theme: gamecom
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
