flash:
  fullname: Flash Player
  manufacturer: Adobe
  release: 1996
  hardware: port
  path: /var/penguintb/juegos/roms/flash
  extension:
  - .swf
  platform:
  - flash
  theme: flash
  emulators:
    lightspark:
      cores:
        lightspark: {}
    ruffle:
      cores:
        ruffle:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
