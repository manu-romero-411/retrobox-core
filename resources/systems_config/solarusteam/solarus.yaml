solarus:
  fullname: Solarus
  manufacturer: Solarus Team
  release: 2011
  hardware: port
  path: /var/penguintb/juegos/roms/solarus
  extension:
  - .zip
  - .solarus
  platform:
  - solarus
  theme: solarus
  emulators:
    solarus:
      cores:
        solarus:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
