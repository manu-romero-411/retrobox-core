supracan:
  fullname: Super ACan
  manufacturer: Funtech Entertainment
  release: 1995
  hardware: console
  path: /var/penguintb/juegos/roms/supracan
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - supracan
  theme: supracan
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
