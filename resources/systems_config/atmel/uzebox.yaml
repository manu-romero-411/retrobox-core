uzebox:
  fullname: Uzebox
  manufacturer: Atmel
  release: 2008
  hardware: console
  extension:
  - .uze
  - .bin
  - .zip
  platform:
  - uzebox
  theme: uzebox
  emulators:
    libretro:
      cores:
        mame: {}
        uzem:
          default: true
          incompatible_extensions:
          - .bin
          - .zip
    mame:
      cores:
        mame: {}
