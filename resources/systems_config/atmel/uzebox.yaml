uzebox:
  fullname: Uzebox
  manufacturer: Atmel
  release: 2008
  hardware: console
  path: /var/penguintb/juegos/roms/uzebox
  extension:
  - .uze
  - .bin
  - .zip
  platform:
  - uzebox
  theme: uzebox
  emulators:
    libretro:
      cores:
        mame: {}
        uzem:
          default: true
          incompatible_extensions:
          - .bin
          - .zip
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
