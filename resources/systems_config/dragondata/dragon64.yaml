dragon64:
  fullname: Dragon 64
  manufacturer: Dragon Data
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/dragon64
  extension:
  - .wav
  - .cas
  - .dsk
  - .dmk
  - .ccc
  - .rom
  - .bin
  - .zip
  - .7z
  platform:
  - dragon64
  theme: dragon64
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
    xroar:
      cores:
        xroar: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
