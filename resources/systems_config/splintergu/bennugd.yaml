bennugd:
  fullname: Bennu Game Development
  manufacturer: SplinterGU
  release: 2008
  hardware: computer
  path: /var/penguintb/juegos/roms/bennugd
  extension:
  - .dcb
  - .dat
  platform:
  - pc
  theme: bennugd
  emulators:
    libretro:
      cores:
        bennugd:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
