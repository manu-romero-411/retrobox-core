tutor:
  fullname: Tutor
  manufacturer: Tomy
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/tutor
  extension:
  - .bin
  - .wav
  - .zip
  - .7z
  platform:
  - tutor
  theme: tutor
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
