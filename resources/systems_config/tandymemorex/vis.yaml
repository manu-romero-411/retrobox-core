vis:
  fullname: Tandy Video Information System
  manufacturer: Tandy / Memorex
  release: 1992
  hardware: computer
  path: /var/penguintb/juegos/roms/vis
  extension:
  - .chd
  - .cue
  - .toc
  - .nrg
  - .gdi
  - .iso
  - .cdr
  platform:
  - vis
  theme: vis
  emulators:
    libretro:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
