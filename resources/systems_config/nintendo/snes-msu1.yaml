snes-msu1:
  fullname: Super Disc System (MSU1)
  manufacturer: Nintendo
  release: 1991
  hardware: console
  path: /var/penguintb/juegos/roms/snes-msu1
  extension:
  - .smc
  - .sfc
  - .squashfs
  platform:
  - snes-msu1
  theme: snes-msu1
  group: snes
  emulators:
    libretro:
      cores:
        bsnes: {}
        bsnes_hd: {}
        snes9x:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
