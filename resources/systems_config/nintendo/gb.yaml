gb:
  fullname: Game Boy
  manufacturer: Nintendo
  release: 1989
  hardware: portable
  path: /var/penguintb/juegos/roms/gb
  extension:
  - .gb
  - .zip
  - .7z
  platform:
  - gb
  theme: gb
  emulators:
    libretro:
      cores:
        gambatte:
          default: true
        mesen-s: {}
        mgba: {}
        vba-m: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
