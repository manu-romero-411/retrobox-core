gameandwatch:
  fullname: Game and Watch
  manufacturer: Nintendo
  release: 1980
  hardware: portable
  path: /var/penguintb/juegos/roms/gameandwatch
  extension:
  - .mgw
  - .zip
  - .7z
  platform:
  - gameandwatch
  theme: gameandwatch
  group: lcdgames
  emulators:
    libretro:
      cores:
        gw:
          default: true
        mame: {}
    mame:
      cores:
        mame:
          incompatible_extensions:
          - .mgw
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
