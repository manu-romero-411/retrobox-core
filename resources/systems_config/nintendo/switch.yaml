switch:
  fullname: Nintendo Switch
  manufacturer: Nintendo
  release: 2017
  hardware: console
  extension:
  - .nro
  - .NRO
  - .xci
  - .XCI
  - .xcz
  - .XCZ
  - .nsp
  - .NSP
  - .nsz
  - .NSZ
  platform:
  - switch
  theme: switch
  emulators:
    eden-emu:
      cores:
        eden-emu:
          default: true
          options:
            force_no_bezel: true

    ryujinx-emu:
      cores:
        ryujinx-emu:
          options:
            force_no_bezel: true
