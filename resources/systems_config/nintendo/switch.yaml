switch:
  fullname: Nintendo Switch
  manufacturer: Nintendo
  release: 2017
  hardware: console
  path: /var/penguintb/juegos/roms/switch
  extension:
  - .nro
  - .NRO
  - .xci
  - .XCI
  - .xcz
  - .XCZ
  - .nsp
  - .NSP
  - .nsz
  - .NSZ
  platform:
  - switch
  theme: switch
  emulators:
    eden-emu:
      cores:
        eden-emu:
          default: true
    ryujinx-emu:
      cores:
        ryujinx-emu: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
