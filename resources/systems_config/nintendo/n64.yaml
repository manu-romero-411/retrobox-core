n64:
  fullname: Nintendo 64
  manufacturer: Nintendo
  release: 1996
  hardware: console
  path: /var/penguintb/juegos/roms/n64
  extension:
  - .z64
  - .n64
  - .v64
  - .zip
  - .7z
  platform:
  - n64
  theme: n64
  emulators:
    libretro:
      cores:
        mupen64plus-next: {}
        parallel_n64: {}
    mupen64plus:
      cores:
        glide64mk2:
          default: true
          incompatible_extensions:
          - .zip
          - .7z
        gliden64:
          incompatible_extensions:
          - .zip
          - .7z
        rice:
          incompatible_extensions:
          - .zip
          - .7z
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
