fds:
  fullname: Family Computer Disk System
  manufacturer: Nintendo
  release: 1986
  hardware: console
  path: /var/penguintb/juegos/roms/fds
  extension:
  - .fds
  - .zip
  - .7z
  platform:
  - fds
  theme: fds
  group: nes
  emulators:
    libretro:
      cores:
        fceumm:
          default: true
        mesen: {}
        nestopia: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
