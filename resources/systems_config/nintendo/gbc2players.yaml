gbc2players:
  fullname: Game Boy Color (2 players)
  manufacturer: Nintendo
  release: 1998
  hardware: portable
  path: /var/penguintb/juegos/roms/gbc2players
  extension:
  - .gbc
  - .gb2
  - .gbc2
  - .zip
  - .7z
  platform:
  - gbc
  theme: gbc2players
  emulators:
    libretro:
      cores:
        tgbdual:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
