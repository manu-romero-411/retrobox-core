nes:
  fullname: Nintendo Entertainment System
  manufacturer: Nintendo
  release: 1983
  hardware: console
  path: /var/penguintb/juegos/roms/nes
  extension:
  - .nes
  - .unif
  - .unf
  - .zip
  - .7z
  platform:
  - nes
  theme: nes
  group: nes
  emulators:
    libretro:
      cores:
        fceumm:
          default: true
        mesen: {}
        nestopia: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
