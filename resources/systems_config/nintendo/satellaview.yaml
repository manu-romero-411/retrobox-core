satellaview:
  fullname: Satellaview
  manufacturer: Nintendo
  release: 1995
  hardware: console
  path: /var/penguintb/juegos/roms/satellaview
  extension:
  - .bs
  - .smc
  - .sfc
  - .zip
  - .7z
  - .squashfs
  platform:
  - satellaview
  theme: satellaview
  group: snes
  emulators:
    libretro:
      cores:
        mesen-s: {}
        snes9x:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
