gamecube:
  fullname: GameCube
  manufacturer: Nintendo
  release: 2001
  hardware: console
  path: /var/penguintb/juegos/roms/gamecube
  extension:
  - .gcm
  - .iso
  - .gcz
  - .ciso
  - .wbfs
  - .rvz
  - .elf
  - .dol
  - .m3u
  - .json
  platform:
  - gc
  theme: gc
  emulators:
    dolphin:
      cores:
        dolphin:
          default: true
    libretro:
      cores:
        dolphin: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
