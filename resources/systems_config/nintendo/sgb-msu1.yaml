sgb-msu1:
  fullname: Super Game Boy MSU1
  manufacturer: Nintendo
  release: 1994
  hardware: console
  path: /var/penguintb/juegos/roms/sgb-msu1
  extension:
  - .gb
  - .gbc
  - .zip
  - .7z
  - .squashfs
  platform:
  - sgb-msu1
  theme: sgb-msu1
  group: snes
  emulators:
    libretro:
      cores:
        bsnes:
          default: true
        bsnes_hd: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
