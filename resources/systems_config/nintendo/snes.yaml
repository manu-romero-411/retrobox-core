snes:
  fullname: Super Nintendo Entertainment System
  manufacturer: Nintendo
  release: 1990
  hardware: console
  path: /var/penguintb/juegos/roms/snes
  extension:
  - .smc
  - .fig
  - .sfc
  - .gd3
  - .gd7
  - .dx2
  - .bsx
  - .swc
  - .zip
  - .7z
  platform:
  - snes
  theme: snes
  group: snes
  emulators:
    libretro:
      cores:
        bsnes: {}
        bsnes_hd: {}
        mesen-s: {}
        snes9x:
          default: true
        snes9x_next: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
