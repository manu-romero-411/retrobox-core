electron:
  fullname: Electron
  manufacturer: Acorn Computers
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/electron
  extension:
  - .wav
  - .csw
  - .uef
  - .mfi
  - .dfi
  - .hfe
  - .mfm
  - .td0
  - .imd
  - .d77
  - .d88
  - .1dd
  - .cqm
  - .cqi
  - .dsk
  - .ssd
  - .bbc
  - .img
  - .dsd
  - .adf
  - .ads
  - .adm
  - .adl
  - .rom
  - .bin
  - .zip
  - .7z
  platform:
  - electron
  theme: electron
  emulators:
    clk:
      cores:
        clk:
          incompatible_extensions:
          - .7z
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
