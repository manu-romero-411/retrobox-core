msx1:
  fullname: MSX1
  manufacturer: Microslop
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/msx1
  extension:
  - .dsk
  - .mx1
  - .rom
  - .zip
  - .7z
  - .cas
  - .m3u
  - .ogv
  - .openmsx
  platform:
  - msx
  theme: msx1
  emulators:
    clk:
      cores:
        clk:
          incompatible_extensions:
          - .7z
    libretro:
      cores:
        bluemsx:
          default: true
          incompatible_extensions:
          - .ogv
          - .openmsx
        fmsx:
          incompatible_extensions:
          - .ogv
          - .openmsx
    openmsx:
      cores:
        openmsx:
          incompatible_extensions:
          - .m3u
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
