msxturbor:
  fullname: MSX Turbo-R
  manufacturer: Microslop
  release: 1990
  hardware: computer
  path: /var/penguintb/juegos/roms/msxturbor
  extension:
  - .dsk
  - .mx2
  - .rom
  - .zip
  - .7z
  - .openmsx
  - .m3u
  platform:
  - msxturbor
  theme: msxturbor
  emulators:
    libretro:
      cores:
        bluemsx:
          default: true
          incompatible_extensions:
          - .openmsx
    openmsx:
      cores:
        openmsx: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
