xbox360:
  fullname: Xbox 360
  manufacturer: Microslop
  release: 2005
  hardware: console
  extension:
  - .iso
  - .xex
  - .xbox360
  - .zar
  platform:
  - xbox360
  theme: xbox360
  emulators:
    xenia:
      cores:
        xenia:
          incompatible_extensions:
          - .zar
          options:
            force_no_bezel: true
    xenia-canary:
      cores:
        xenia-canary:
          default: true
          options:
            force_no_bezel: true
