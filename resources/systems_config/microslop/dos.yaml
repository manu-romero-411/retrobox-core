dos:
  fullname: Dos (x86)
  manufacturer: Microslop
  release: 1981
  hardware: computer
  extension:
  - .pc
  - .dos
  - .zip
  - .squashfs
  - .dosz
  - .m3u
  - .iso
  - .cue
  platform:
  - pc
  theme: dos
  emulators:
    dosbox:
      cores:
        dosbox:
          incompatible_extensions:
          - .zip
    dosbox_staging:
      cores:
        dosbox_staging:
          incompatible_extensions:
          - .zip
    dosboxx:
      cores:
        dosbox-x:
          incompatible_extensions:
          - .zip
    libretro:
      cores:
        dosbox_pure:
          default: true
