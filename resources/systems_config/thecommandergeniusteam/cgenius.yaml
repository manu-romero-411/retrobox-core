cgenius:
  fullname: Commander Genius
  manufacturer: The Commander Genius Team
  release: 1990
  hardware: port
  path: /var/penguintb/juegos/roms/cgenius
  extension:
  - .cgenius
  platform:
  - pc
  theme: cgenius
  group: ports
  emulators:
    cgenius:
      cores:
        cgenius:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
