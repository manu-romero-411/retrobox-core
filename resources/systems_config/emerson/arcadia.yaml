arcadia:
  fullname: Arcadia 2001
  manufacturer: Emerson
  release: 1982
  hardware: console
  path: /var/penguintb/juegos/roms/arcadia
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - arcadia
  theme: arcadia
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
