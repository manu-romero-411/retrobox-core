samcoupe:
  fullname: SAM Coupé
  manufacturer: Miles Gordon Technology
  release: 1989
  hardware: computer
  path: /var/penguintb/juegos/roms/samcoupe
  extension:
  - .cpm
  - .dsk
  - .sad
  - .mgt
  - .sdf
  - .td0
  - .sbt
  - .zip
  platform:
  - samcoupe
  theme: samcoupe
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame: {}
    samcoupe:
      cores:
        samcoupe:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
