supervision:
  fullname: Supervision
  manufacturer: Watara
  release: 1992
  hardware: portable
  path: /var/penguintb/juegos/roms/supervision
  extension:
  - .sv
  - .zip
  - .7z
  platform:
  - supervision
  theme: supervision
  emulators:
    libretro:
      cores:
        potator:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
