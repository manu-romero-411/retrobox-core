channelf:
  fullname: Channel-F
  manufacturer: Fairchild
  release: 1976
  hardware: console
  path: /var/penguintb/juegos/roms/channelf
  extension:
  - .zip
  - .rom
  - .bin
  - .chf
  platform:
  - channelf
  theme: channelf
  emulators:
    libretro:
      cores:
        freechaf:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
