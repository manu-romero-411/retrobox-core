amstradcpc:
  fullname: Amstrad CPC
  manufacturer: Amstrad
  release: 1984
  hardware: computer
  path: /var/penguintb/juegos/roms/amstradcpc
  extension:
  - .dsk
  - .sna
  - .tap
  - .cdt
  - .voc
  - .m3u
  - .zip
  - .7z
  platform:
  - amstradcpc
  theme: amstradcpc
  emulators:
    clk:
      cores:
        clk:
          incompatible_extensions:
          - .m3u
          - .7z
    libretro:
      cores:
        cap32:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
