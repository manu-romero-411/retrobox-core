gamate:
  fullname: Gamate
  manufacturer: Bitcorp
  release: 1990
  hardware: portable
  path: /var/penguintb/juegos/roms/gamate
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - gamate
  theme: gamate
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
