singe:
  fullname: Singe
  manufacturer: Arcade
  release: 1990
  hardware: arcade
  path: /var/penguintb/juegos/roms/singe
  extension:
  - .daphne
  - .squashfs
  platform:
  - alg
  - daphne
  - arcade
  theme: singe
  emulators:
    hypseus-singe:
      cores:
        hypseus-singe:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
