fbneo:
  fullname: Final Burn Neo
  manufacturer: Arcade
  release: 2019
  hardware: arcade
  path: /var/penguintb/juegos/roms/fbneo
  extension:
  - .zip
  - .7z
  platform:
  - arcade
  theme: fbneo
  emulators:
    libretro:
      cores:
        fbneo:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
