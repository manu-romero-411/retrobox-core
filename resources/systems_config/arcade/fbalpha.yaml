fbneo:
  fullname: Final Burn Alpha
  manufacturer: Arcade
  release: 2007
  hardware: arcade
  path: /var/penguintb/juegos/roms/fba
  extension:
  - .zip
  - .7z
  platform:
  - arcade
  theme: fbneo
  emulators:
    libretro:
      cores:
        fbalpha: {}
        fbalpha2012:
            default: true
        fbalpha2012_cps1: {}
        fbalpha2012_cps2: {}
        fbalpha2012_cps3: {}
        fbalpha2012_neogeo: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
