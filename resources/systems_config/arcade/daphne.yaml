daphne:
  fullname: Daphne
  manufacturer: Arcade
  release: 1983
  hardware: arcade
  path: /var/penguintb/juegos/roms/daphne
  extension:
  - .daphne
  - .squashfs
  platform:
  - alg
  - daphne
  - arcade
  theme: daphne
  emulators:
    hypseus-singe:
      cores:
        hypseus-singe:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
