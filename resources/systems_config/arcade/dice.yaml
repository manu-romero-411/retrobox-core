dice:
  fullname: DICE
  manufacturer: Arcade
  release: 1972
  hardware: arcade
  path: /var/penguintb/juegos/roms/dice
  extension:
  - .zip
  - .dmy
  platform:
  - dice
  - arcade
  theme: dice
  emulators:
    libretro:
      cores:
        dice:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
