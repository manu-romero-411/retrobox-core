apfm1000:
  fullname: M-1000
  manufacturer: APF Electronics
  release: 1978
  hardware: console
  path: /var/penguintb/juegos/roms/apfm1000
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - apfm1000
  theme: apfm1000
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
