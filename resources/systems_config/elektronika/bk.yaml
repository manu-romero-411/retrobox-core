bk:
  fullname: Elektronika BK
  manufacturer: Elektronika
  release: 1985
  hardware: computer
  path: /var/penguintb/juegos/roms/bk
  extension:
  - .bin
  - .img
  - .dsk
  - .bkd
  - .zip
  - .7z
  platform:
  - bk
  theme: bk
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
