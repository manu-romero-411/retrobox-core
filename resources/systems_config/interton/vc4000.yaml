vc4000:
  fullname: VC 4000
  manufacturer: Interton
  release: 1978
  hardware: console
  path: /var/penguintb/juegos/roms/vc4000
  extension:
  - .bin
  - .rom
  - .pgm
  - .tvc
  - .zip
  - .7z
  platform:
  - vc4000
  theme: vc4000
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
