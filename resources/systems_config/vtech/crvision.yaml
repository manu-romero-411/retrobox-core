crvision:
  fullname: CreatiVision
  manufacturer: VTech
  release: 1982
  hardware: console
  path: /var/penguintb/juegos/roms/crvision
  extension:
  - .bin
  - .rom
  - .zip
  - .7z
  platform:
  - crvision
  theme: creativision
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
