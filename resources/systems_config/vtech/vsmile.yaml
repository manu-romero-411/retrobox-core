vsmile:
  fullname: V.Smile
  manufacturer: VTech
  release: 2005
  hardware: console
  path: /var/penguintb/juegos/roms/vsmile
  extension:
  - .u1
  - .u3
  - .bin
  - .zip
  - .7z
  platform:
  - vsmile
  theme: vsmile
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
