socrates:
  fullname: Socrates
  manufacturer: VTech
  release: 1988
  hardware: console
  path: /var/penguintb/juegos/roms/socrates
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - socrates
  theme: socrates
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
