cgenie:
  fullname: Colour Genie
  manufacturer: EACA
  release: 1982
  hardware: computer
  path: /var/penguintb/juegos/roms/cgenie
  extension:
  - .cas
  - .wav
  - .zip
  - .7z
  platform:
  - cgenie
  theme: cgenie
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
