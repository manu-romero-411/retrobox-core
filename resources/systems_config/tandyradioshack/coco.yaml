coco:
  fullname: Color Computer
  manufacturer: Tandy Radio Shack
  release: 1980
  hardware: computer
  path: /var/penguintb/juegos/roms/coco
  extension:
  - .wav
  - .cas
  - .dsk
  - .ccc
  - .rom
  - .zip
  - .7z
  platform:
  - coco
  theme: coco
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
    xroar:
      cores:
        xroar: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
