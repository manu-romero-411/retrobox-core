atari800:
  fullname: Atari 800
  manufacturer: Atari
  release: 1979
  hardware: computer
  path: /var/penguintb/juegos/roms/atari800
  extension:
  - .rom
  - .xfd
  - .atr
  - .atx
  - .cdm
  - .cas
  - .car
  - .bin
  - .a52
  - .xex
  - .zip
  - .7z
  - .m3u
  platform:
  - atari800
  theme: atari800
  group: atari8bit
  emulators:
    libretro:
      cores:
        atari800:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
