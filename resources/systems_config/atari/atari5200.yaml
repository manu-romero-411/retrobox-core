atari5200:
  fullname: Atari 5200
  manufacturer: Atari
  release: 1982
  hardware: console
  path: /var/penguintb/juegos/roms/atari5200
  extension:
  - .rom
  - .xfd
  - .atr
  - .atx
  - .cdm
  - .cas
  - .car
  - .bin
  - .a52
  - .xex
  - .zip
  - .7z
  platform:
  - atari5200
  theme: atari5200
  emulators:
    libretro:
      cores:
        a5200:
          default: true
        atari800: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
