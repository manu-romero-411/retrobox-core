lynx:
  fullname: Atari Lynx
  manufacturer: Atari
  release: 1989
  hardware: portable
  path: /var/penguintb/juegos/roms/lynx
  extension:
  - .bll
  - .lnx
  - .lyx
  - .o
  - .zip
  - .7z
  platform:
  - atarilynx
  theme: atarilynx
  emulators:
    libretro:
      cores:
        handy: {}
        holani: {}
        mednafen_lynx:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
