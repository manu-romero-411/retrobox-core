jaguar:
  fullname: Jaguar
  manufacturer: Atari
  release: 1993
  hardware: console
  path: /var/penguintb/juegos/roms/jaguar
  extension:
  - .j64
  - .jag
  - .cof
  - .abs
  - .rom
  - .zip
  - .7z
  platform:
  - jaguar
  theme: atarijaguar
  group: jaguar
  emulators:
    bigpemu:
      cores:
        bigpemu:
          default: true
    libretro:
      cores:
        virtualjaguar:
          incompatible_extensions:
          - .7z
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
