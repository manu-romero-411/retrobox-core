atarist:
  fullname: Atari ST
  manufacturer: Atari
  release: 1985
  hardware: computer
  path: /var/penguintb/juegos/roms/atarist
  extension:
  - .st
  - .msa
  - .stx
  - .dim
  - .ipf
  - .m3u
  - .zip
  - .7z
  - .hd
  - .gemdos
  platform:
  - atarist
  theme: atarist
  emulators:
    clk:
      cores:
        clk:
          incompatible_extensions:
          - .m3u
          - .7z
    hatari:
      cores:
        hatari: {}
    libretro:
      cores:
        hatari:
          default: true
          incompatible_extensions:
          - .hd
          - .gemdos
        hatarib: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
