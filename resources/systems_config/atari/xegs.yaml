xegs:
  fullname: Atari XE Game System
  manufacturer: Atari
  release: 1987
  hardware: computer
  path: /var/penguintb/juegos/roms/xegs
  extension:
  - .atr
  - .dsk
  - .xfd
  - .bin
  - .rom
  - .car
  - .zip
  - .7z
  platform:
  - xegs
  theme: xegs
  group: atari8bit
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
