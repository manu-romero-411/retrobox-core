neogeo:
  fullname: Neo-Geo
  manufacturer: SNK
  release: 1990
  hardware: console
  path: /var/penguintb/juegos/roms/neogeo
  extension:
  - .7z
  - .zip
  platform:
  - neogeo
  - arcade
  theme: neogeo
  emulators:
    libretro:
      cores:
        fbneo:
          default: true
        mame: {}
        mame078plus: {}
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
