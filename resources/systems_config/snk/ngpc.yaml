ngpc:
  fullname: Neo-Geo Pocket Color
  manufacturer: SNK
  release: 1999
  hardware: portable
  path: /var/penguintb/juegos/roms/ngpc
  extension:
  - .ngc
  - .zip
  - .7z
  platform:
  - ngpc
  theme: ngpc
  emulators:
    libretro:
      cores:
        mednafen_ngp:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
