neogeocd:
  fullname: Neo-Geo CD
  manufacturer: SNK
  release: 1994
  hardware: console
  path: /var/penguintb/juegos/roms/neogeocd
  extension:
  - .cue
  - .iso
  - .chd
  platform:
  - neogeocd
  theme: neogeocd
  emulators:
    libretro:
      cores:
        neocd:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
