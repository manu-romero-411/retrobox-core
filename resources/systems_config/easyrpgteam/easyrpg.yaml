easyrpg:
  fullname: EasyRPG
  manufacturer: EasyRPG Team
  release: 2000
  hardware: port
  path: /var/penguintb/juegos/roms/easyrpg
  extension:
  - .easyrpg
  - .squashfs
  - .zip
  platform:
  - easyrpg
  theme: easyrpg
  emulators:
    easyrpg:
      cores:
        easyrpg:
          default: true
    libretro:
      cores:
        easyrpg: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
