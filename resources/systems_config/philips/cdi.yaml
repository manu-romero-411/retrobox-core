cdi:
  fullname: CD-i
  manufacturer: Philips
  release: 1990
  hardware: console
  path: /var/penguintb/juegos/roms/cdi
  extension:
  - .chd
  - .cue
  - .toc
  - .nrg
  - .gdi
  - .iso
  - .cdr
  platform:
  - cdi
  theme: cdi
  emulators:
    libretro:
      cores:
        same_cdi:
          incompatible_extensions:
          - .cue
          - .toc
          - .nrg
          - .gdi
          - .cdr
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
