cdi:
  fullname: CD-i
  manufacturer: Philips
  release: 1990
  hardware: console
  extension:
  - .chd
  - .cue
  - .toc
  - .nrg
  - .gdi
  - .iso
  - .cdr
  platform:
  - cdi
  theme: cdi
  emulators:
    libretro:
      cores:
        same_cdi:
          incompatible_extensions:
          - .cue
          - .toc
          - .nrg
          - .gdi
          - .cdr
    mame:
      cores:
        mame:
          default: true
