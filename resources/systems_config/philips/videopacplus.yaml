videopacplus:
  fullname: Videopac+ G7400
  manufacturer: Philips
  release: 1983
  hardware: console
  path: /var/penguintb/juegos/roms/videopacplus
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - videopac
  theme: videopacplus
  emulators:
    libretro:
      cores:
        o2em:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
