loopy:
  fullname: Casio Loopy
  manufacturer: Casio
  release: 1995
  hardware: console
  path: /var/penguintb/juegos/roms/loopy
  extension:
  - .bin
  - .ic1
  - .zip
  - .7z
  platform:
  - loopy
  theme: loopy
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
