namco22:
  fullname: Namco System 22
  manufacturer: Namco
  release: 1992
  hardware: arcade
  path: /var/penguintb/juegos/roms/namco22
  extension:
  - .zip
  - .7z
  platform:
  - namco
  - arcade
  theme: namco22
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
