pcenginecd:
  fullname: PC Engine CD
  manufacturer: NEC
  release: 1988
  hardware: console
  path: /var/penguintb/juegos/roms/pcenginecd
  extension:
  - .pce
  - .cue
  - .ccd
  - .iso
  - .img
  - .chd
  platform:
  - pcenginecd
  theme: pce-cd
  emulators:
    libretro:
      cores:
        pce:
          default: true
        pce_fast: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
