pc88:
  fullname: PC-8800
  manufacturer: NEC
  release: 1981
  hardware: computer
  path: /var/penguintb/juegos/roms/pc88
  extension:
  - .cmt
  - .d88
  - .u88
  - .m3u
  platform:
  - pc88
  theme: pc88
  emulators:
    libretro:
      cores:
        quasi88:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
