pcfx:
  fullname: PC-FX
  manufacturer: NEC
  release: 1994
  hardware: console
  path: /var/penguintb/juegos/roms/pcfx
  extension:
  - .cue
  - .ccd
  - .toc
  - .chd
  - .zip
  - .7z
  - .m3u
  platform:
  - pcfx
  theme: pcfx
  emulators:
    libretro:
      cores:
        pcfx:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
