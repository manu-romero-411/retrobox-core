pcengine:
  fullname: PC Engine
  manufacturer: NEC
  release: 1987
  hardware: console
  path: /var/penguintb/juegos/roms/pcengine
  extension:
  - .pce
  - .bin
  - .zip
  - .7z
  platform:
  - pcengine
  theme: pcengine
  emulators:
    libretro:
      cores:
        mednafen_pce:
          default: true
        mednafen_pce_fast: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
