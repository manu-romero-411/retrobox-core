pc60:
  fullname: PC-6000
  manufacturer: NEC
  release: 1981
  hardware: computer
  path: /var/penguintb/juegos/roms/pc60
  extension:
  - .bin
  - .cas
  - .p6
  - .d77
  - .d88
  - .dsk
  - .1dd
  - .mfi
  - .dfi
  - .mfm
  - .td0
  - .imd
  - .cqm
  - .cqi
  - .xdf
  - .hdm
  - .2hd
  - .fdi
  - .zip
  - .7z
  platform:
  - pc60
  theme: pc60
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
