supergrafx:
  fullname: Supergrafx
  manufacturer: NEC
  release: 1989
  hardware: console
  path: /var/penguintb/juegos/roms/supergrafx
  extension:
  - .pce
  - .sgx
  - .cue
  - .ccd
  - .chd
  - .zip
  - .7z
  platform:
  - supergrafx
  theme: supergrafx
  emulators:
    libretro:
      cores:
        mednafen_supergrafx:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
