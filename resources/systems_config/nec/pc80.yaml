pc80:
  fullname: PC-8001
  manufacturer: NEC
  release: 1979
  hardware: computer
  path: /var/penguintb/juegos/roms/pc80
  extension:
  - .d77
  - .d88
  - .1dd
  - .dsk
  - .n80
  - .bin
  - .zip
  - .7z
  platform:
  - pc80
  theme: pc80
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
