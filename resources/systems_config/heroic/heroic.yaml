heroic:
  fullname: Heroic Games Launcher
  group: pcgames
  manufacturer: Heroic
  release: 2020
  hardware: None
  path: ../roms/heroic
  extension:
  - .heroic
  platform:
  - windows
  theme: heroic
  emulators:
    heroic:
      cores:
        heroic:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
