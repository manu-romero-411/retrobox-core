apple2:
  fullname: Apple II
  manufacturer: Apple
  release: 1977
  hardware: computer
  path: /var/penguintb/juegos/roms/apple2
  extension:
  - .nib
  - .do
  - .po
  - .dsk
  - .mfi
  - .dfi
  - .rti
  - .edd
  - .woz
  - .wav
  - .zip
  - .7z
  - .chd
  - .hdv
  - .2mg
  platform:
  - apple2
  theme: apple2
  emulators:
    gsplus:
      cores:
        gsplus:
          default: true
          incompatible_extensions:
          - .mfi
          - .dfi
          - .rti
          - .edd
          - .woz
          - .wav
          - .zip
          - .7z
          - .chd
          - .hdv
          - .2mg
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
