astrocade:
  fullname: Astrocade
  manufacturer: Bally
  release: 1978
  hardware: console
  path: /var/penguintb/juegos/roms/astrocade
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - astrocade
  theme: astrocade
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
