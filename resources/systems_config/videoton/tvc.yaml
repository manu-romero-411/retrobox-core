tvc:
  fullname: Videoton TVC
  manufacturer: Videoton
  release: 1986
  hardware: computer
  path: /var/penguintb/juegos/roms/tvc
  extension:
  - .cas
  - .tap
  - .dsk
  - .img
  - .zip
  platform:
  - tvc
  theme: tvc
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
