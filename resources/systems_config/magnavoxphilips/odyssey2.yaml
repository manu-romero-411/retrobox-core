odyssey2:
  fullname: Odyssey2
  manufacturer: Magnavox - Philips
  release: 1978
  hardware: console
  path: /var/penguintb/juegos/roms/odyssey2
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - odyssey2
  theme: odyssey2
  emulators:
    libretro:
      cores:
        o2em:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
