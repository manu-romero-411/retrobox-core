adam:
  fullname: ADAM
  manufacturer: Coleco
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/adam
  extension:
  - .wav
  - .ddp
  - .mfi
  - .dfi
  - .hfe
  - .mfm
  - .td0
  - .imd
  - .d77
  - .d88
  - .1dd
  - .cqm
  - .cqi
  - .dsk
  - .rom
  - .col
  - .bin
  - .zip
  - .7z
  platform:
  - adam
  theme: adam
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
