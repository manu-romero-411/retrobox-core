colecovision:
  fullname: ColecoVision
  manufacturer: Coleco
  release: 1982
  hardware: console
  path: /var/penguintb/juegos/roms/colecovision
  extension:
  - .bin
  - .col
  - .rom
  - .zip
  - .7z
  platform:
  - colecovision
  theme: colecovision
  emulators:
    clk:
      cores:
        clk:
          incompatible_extensions:
          - .7z
    libretro:
      cores:
        bluemsx:
          default: true
    openmsx:
      cores:
        openmsx: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
