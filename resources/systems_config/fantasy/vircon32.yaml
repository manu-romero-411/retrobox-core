vircon32:
  fullname: vircon32
  manufacturer: Fantasy
  release: 2022
  hardware: console
  path: /var/penguintb/juegos/roms/vircon32
  extension:
  - .v32
  - .zip
  platform:
  - vircon32
  theme: vircon32
  emulators:
    libretro:
      cores:
        vircon32:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
