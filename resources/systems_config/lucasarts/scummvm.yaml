scummvm:
  fullname: ScummVM
  manufacturer: LucasArts
  release: 1987
  hardware: computer
  path: /var/penguintb/juegos/roms/scummvm
  extension:
  - .scummvm
  - .squashfs
  platform:
  - scummvm
  theme: scummvm
  emulators:
    libretro:
      cores:
        scummvm: {}
    scummvm:
      cores:
        scummvm:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
