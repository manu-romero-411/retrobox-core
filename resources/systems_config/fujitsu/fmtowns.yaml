fmtowns:
  fullname: FM-TOWNS
  manufacturer: Fujitsu
  release: 1987
  hardware: computer
  path: /var/penguintb/juegos/roms/fmtowns
  extension:
  - .bin
  - .m3u
  - .cue
  - .d88
  - .d77
  - .xdf
  - .iso
  - .chd
  - .toc
  - .nrg
  - .gdi
  - .cdr
  - .mfi
  - .dfi
  - .hfe
  - .mfm
  - .td0
  - .imd
  - .1dd
  - .cqm
  - .cqi
  - .dsk
  - .zip
  - .7z
  platform:
  - fmtowns
  theme: fmtowns
  emulators:
    libretro:
      cores:
        mame:
          incompatible_extensions:
          - .xdf
          - .m3u
    mame:
      cores:
        mame:
          incompatible_extensions:
          - .xdf
          - .m3u
    tsugaru:
      cores:
        tsugaru:
          default: true
          incompatible_extensions:
          - .chd
          - .toc
          - .nrg
          - .gdi
          - .cdr
          - .mfi
          - .dfi
          - .hfe
          - .mfm
          - .td0
          - .imd
          - .1dd
          - .cqm
          - .cqi
          - .dsk
          - .zip
          - .7z
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
