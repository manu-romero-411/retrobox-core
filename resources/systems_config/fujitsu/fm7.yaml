fm7:
  fullname: FM-7
  manufacturer: Fujitsu
  release: 1982
  hardware: computer
  path: /var/penguintb/juegos/roms/fm7
  extension:
  - .wav
  - .t77
  - .mfi
  - .dfi
  - .hfe
  - .mfm
  - .td0
  - .imd
  - .d77
  - .d88
  - .1dd
  - .cqm
  - .cqi
  - .dsk
  - .zip
  - .7z
  platform:
  - fm7
  theme: fm7
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
