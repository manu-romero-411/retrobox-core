pygame:
  fullname: Pygame
  manufacturer: Pygame Team
  release: 2000
  hardware: library
  path: /var/penguintb/juegos/roms/pygame
  extension:
  - .pygame
  platform:
  - pygame
  theme: pygame
  emulators:
    pygame:
      cores:
        pygame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
