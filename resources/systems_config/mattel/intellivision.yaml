intellivision:
  fullname: Mattel Intellivision
  manufacturer: Mattel
  release: 1979
  hardware: console
  path: /var/penguintb/juegos/roms/intellivision
  extension:
  - .int
  - .bin
  - .rom
  - .zip
  - .7z
  platform:
  - intellivision
  theme: intellivision
  emulators:
    libretro:
      cores:
        freeintv:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
