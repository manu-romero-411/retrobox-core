ps2:
  fullname: PlayStation 2
  manufacturer: Sony
  release: 2000
  hardware: console
  path: /var/penguintb/juegos/roms/ps2
  extension:
  - .iso
  - .mdf
  - .nrg
  - .bin
  - .img
  - .dump
  - .gz
  - .cso
  - .chd
  - .m3u
  - .elf
  platform:
  - ps2
  theme: ps2
  emulators:
    libretro:
      cores:
        pcsx2: {}
        play:
          incompatible_extensions:
          - .m3u
    pcsx2:
      cores:
        pcsx2:
          default: true
          incompatible_extensions:
          - .m3u
          options:
            hud_support: false
    play:
      cores:
        play:
          incompatible_extensions:
          - .m3u
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
