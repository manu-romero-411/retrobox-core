ps2:
  fullname: PlayStation 2
  manufacturer: Sony
  release: 2000
  hardware: console
  extension:
  - .iso
  - .mdf
  - .nrg
  - .bin
  - .img
  - .dump
  - .gz
  - .cso
  - .chd
  - .m3u
  - .elf
  platform:
  - ps2
  theme: ps2
  emulators:
    libretro:
      cores:
        pcsx2: {}
        play:
          incompatible_extensions:
          - .m3u
    pcsx2:
      cores:
        pcsx2:
          default: true
          incompatible_extensions:
          - .m3u
          options:
            hud_support: true
    play:
      cores:
        play:
          incompatible_extensions:
          - .m3u
