psvita:
  fullname: PlayStation Vita
  manufacturer: Sony
  release: 2012
  hardware: portable
  path: /var/penguintb/juegos/roms/psvita
  extension:
  - .zip
  - .psvita
  platform:
  - psvita
  theme: psvita
  emulators:
    vita3k:
      cores:
        vita3k:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
