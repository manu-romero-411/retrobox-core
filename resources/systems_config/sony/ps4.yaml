ps4:
  fullname: PlayStation 4
  manufacturer: Sony
  release: 2013
  hardware: console
  path: /var/penguintb/juegos/roms/ps4
  extension:
  - .ps4
  platform:
  - ps4
  theme: ps4
  emulators:
    shadps4:
      cores:
        shadps4:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
