ps3:
  fullname: PlayStation 3
  manufacturer: Sony
  release: 2006
  hardware: console
  path: /var/penguintb/juegos/roms/ps3
  extension:
  - .ps3
  - .psn
  - .iso
  - .squashfs
  platform:
  - ps3
  theme: ps3
  emulators:
    rpcs3:
      cores:
        rpcs3:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
