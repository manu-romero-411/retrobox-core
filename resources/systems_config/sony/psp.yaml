psp:
  fullname: PlayStation Portable
  manufacturer: Sony
  release: 2004
  hardware: portable
  path: /var/penguintb/juegos/roms/psp
  extension:
  - .iso
  - .cso
  - .pbp
  - .chd
  platform:
  - psp
  theme: psp
  emulators:
    libretro:
      cores:
        ppsspp: {}
    ppsspp:
      cores:
        ppsspp:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
