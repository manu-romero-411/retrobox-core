mz700:
  fullname: Sharp MZ-700
  manufacturer: Sharp
  release: 1982
  hardware: computer
  path: /var/penguintb/juegos/roms/mz700
  extension:
  - .mzf
  - .mzt
  - .m12
  - .wav
  - .zip
  - .7z
  platform:
  - mz700
  theme: mz700
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
