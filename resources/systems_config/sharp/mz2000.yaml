mz2000:
  fullname: Sharp MZ-2000
  manufacturer: Sharp
  release: 1982
  hardware: computer
  path: /var/penguintb/juegos/roms/mz2000
  extension:
  - .mzf
  - .mzt
  - .m12
  - .wav
  - .d88
  - .dsk
  - .zip
  - .7z
  platform:
  - mz2000
  theme: mz2000
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
