sv8000:
  fullname: Super Vision 8000
  manufacturer: Bandai
  release: 1979
  hardware: console
  path: /var/penguintb/juegos/roms/sv8000
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - sv8000
  theme: sv8000
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
