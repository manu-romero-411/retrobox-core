sufami:
  fullname: SuFami Turbo
  manufacturer: Bandai
  release: 1996
  hardware: console
  path: /var/penguintb/juegos/roms/sufami
  extension:
  - .st
  - .fig
  - .bs
  - .smc
  - .sfc
  - .zip
  - .7z
  platform:
  - sufami
  theme: sufami
  group: snes
  emulators:
    libretro:
      cores:
        snes9x:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
