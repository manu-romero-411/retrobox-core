wswanc:
  fullname: WonderSwan Color
  manufacturer: Bandai
  release: 2000
  hardware: portable
  path: /var/penguintb/juegos/roms/wswanc
  extension:
  - .wsc
  - .zip
  - .7z
  platform:
  - wonderswancolor
  theme: wonderswancolor
  emulators:
    libretro:
      cores:
        mednafen_wswan:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
