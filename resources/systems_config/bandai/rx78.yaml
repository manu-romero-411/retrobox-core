rx78:
  fullname: RX-78
  manufacturer: Bandai
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/rx78
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - rx78
  theme: rx78
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
