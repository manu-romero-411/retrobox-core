thextech:
  fullname: TheXTech
  manufacturer: Wohlstand
  release: 2020
  hardware: port
  path: /var/penguintb/juegos/roms/thextech
  extension:
  - .smbx
  - .squashfs
  platform:
  - thextech
  theme: thextech
  emulators:
    thextech:
      cores:
        thextech:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
