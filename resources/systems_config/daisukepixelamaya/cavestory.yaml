cavestory:
  fullname: Cave Story
  manufacturer: Daisuke "Pixel" Amaya
  release: 2004
  hardware: port
  path: /var/penguintb/juegos/roms/cavestory
  extension:
  - .exe
  platform:
  - pc
  theme: cavestory
  group: ports
  emulators:
    libretro:
      cores:
        nxengine:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
