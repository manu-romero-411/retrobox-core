gp32:
  fullname: GP32
  manufacturer: GamePark
  release: 2001
  hardware: portable
  path: /var/penguintb/juegos/roms/gp32
  extension:
  - .smc
  - .zip
  - .7z
  platform:
  - gp32
  theme: gp32
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
