lcdgames:
  fullname: LCD Games
  manufacturer: Various
  release: 1979
  hardware: portable
  path: /var/penguintb/juegos/roms/lcdgames
  extension:
  - .mgw
  - .zip
  - .7z
  platform:
  - lcdgames
  theme: lcdgames
  group: lcdgames
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
          incompatible_extensions:
          - .mgw
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
