tvgames:
  fullname: Plug and Play TV Games
  manufacturer: Various
  release: 2002
  hardware: console
  path: /var/penguintb/juegos/roms/tvgames
  extension:
  - .zip
  - .7z
  platform:
  - tvgames
  theme: tvgames
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
