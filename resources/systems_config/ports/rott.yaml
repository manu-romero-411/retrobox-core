rott:
  fullname: Rise of the Triad
  manufacturer: Ports
  release: 1994
  hardware: port
  path: /var/penguintb/juegos/roms/rott
  extension:
  - .rott
  platform:
  - pc
  theme: rott
  group: ports
  emulators:
    taradino:
      cores:
        taradino: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
