ports:
  fullname: Ports
  manufacturer: Ports
  release: None
  hardware: port
  path: /var/penguintb/juegos/roms/ports
  extension:
  - .sh
  - .squashfs
  platform:
  - pc
  theme: ports
  group: ports
  emulators:
    sh:
      cores:
        sh:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
