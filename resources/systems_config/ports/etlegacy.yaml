etlegacy:
  fullname: Wolfenstein - Enemy Territory
  manufacturer: Ports
  release: 2010
  hardware: port
  path: /var/penguintb/juegos/roms/etlegacy
  extension:
  - .etl
  platform:
  - pc
  theme: etlegacy
  group: ports
  emulators:
    etlegacy:
      cores:
        etlegacy:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
