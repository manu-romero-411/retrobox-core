corsixth:
  fullname: CorsixTH
  manufacturer: Ports
  release: None
  hardware: port
  path: /var/penguintb/juegos/roms/corsixth
  extension:
  - .game
  platform:
  - pc
  theme: corsixth
  group: ports
  emulators:
    corsixth:
      cores:
        corsixth:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
