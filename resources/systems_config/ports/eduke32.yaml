eduke32:
  fullname: EDuke32
  manufacturer: Ports
  release: None
  hardware: port
  path: /var/penguintb/juegos/roms/eduke32
  extension:
  - .eduke32
  platform:
  - pc
  theme: eduke32
  group: ports
  emulators:
    eduke32:
      cores:
        eduke32:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
