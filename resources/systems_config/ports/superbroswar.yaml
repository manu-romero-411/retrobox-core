superbroswar:
  fullname: Super Mario War
  manufacturer: Ports
  release: 2006
  hardware: port
  path: /var/penguintb/juegos/roms/superbroswar
  extension:
  - .game
  platform:
  - pc
  theme: superbroswar
  group: ports
  emulators:
    libretro:
      cores:
        superbroswar:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
