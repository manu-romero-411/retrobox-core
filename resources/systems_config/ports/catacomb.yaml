catacomb:
  fullname: CatacombGL
  manufacturer: Ports
  release: 1991
  hardware: port
  path: /var/penguintb/juegos/roms/catacomb
  extension:
  - .game
  platform:
  - pc
  theme: catacomb
  group: ports
  emulators:
    catacombgl:
      cores:
        catacombgl:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
