cdogs:
  fullname: C-Dogs SDL
  manufacturer: Ports
  release: 1997
  hardware: port
  path: /var/penguintb/juegos/roms/cdogs
  extension:
  - .game
  platform:
  - pc
  theme: cdogs
  group: ports
  emulators:
    cdogs:
      cores:
        cdogs:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
