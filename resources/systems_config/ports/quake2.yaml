quake2:
  fullname: Quake II
  manufacturer: Ports
  release: 1997
  hardware: port
  path: /var/penguintb/juegos/roms/quake2
  extension:
  - .quake2
  - .zip
  - .7zip
  platform:
  - pc
  theme: quake2
  group: ports
  emulators:
    libretro:
      cores:
        vitaquake2: {}
    vkquake2:
      cores:
        vkquake2:
          incompatible_extensions:
          - .zip
          - .7zip
    yquake2:
      cores:
        yquake2:
          default: true
          incompatible_extensions:
          - .zip
          - .7zip
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
