zc210:
  fullname: Zelda Classic
  manufacturer: Ports
  release: 1999
  hardware: console
  path: /var/penguintb/juegos/roms/zc210
  extension:
  - .qst
  platform:
  - pc
  theme: zeldac
  emulators:
    libretro:
      cores:
        zc210:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
