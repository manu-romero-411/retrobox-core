ecwolf:
  fullname: ECWolf
  manufacturer: Ports
  release: 2013
  hardware: port
  path: /var/penguintb/juegos/roms/ecwolf
  extension:
  - .ecwolf
  - .pk3
  - .squashfs
  platform:
  - pc
  theme: ecwolf
  group: ports
  emulators:
    ecwolf:
      cores:
        ecwolf:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
