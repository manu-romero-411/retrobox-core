traider1:
  fullname: Tomb Raider
  manufacturer: Ports
  release: 1996
  hardware: port
  path: /var/penguintb/juegos/roms/traider1
  extension:
  - .croft
  platform:
  - pc
  theme: traider1
  group: ports
  emulators:
    tr1x:
      cores:
        tr1x:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
