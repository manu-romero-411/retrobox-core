openjazz:
  fullname: Jazz Jackrabbit
  manufacturer: Ports
  release: 1994
  hardware: port
  path: /var/penguintb/juegos/roms/openjazz
  extension:
  - .game
  platform:
  - pc
  theme: openjazz
  group: ports
  emulators:
    openjazz:
      cores:
        openjazz:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
