abuse:
  fullname: Abuse
  manufacturer: Ports
  release: 1996
  hardware: port
  path: /var/penguintb/juegos/roms/abuse
  extension:
  - .game
  platform:
  - pc
  theme: abuse
  group: ports
  emulators:
    abuse:
      cores:
        abuse:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
