fury:
  fullname: Ion Fury
  manufacturer: Ports
  release: 2019
  hardware: port
  path: /var/penguintb/juegos/roms/fury
  extension:
  - .grp
  platform:
  - pc
  theme: fury
  group: ports
  emulators:
    eduke32:
      cores:
        fury:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
