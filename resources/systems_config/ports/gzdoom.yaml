gzdoom:
  fullname: GZDoom
  manufacturer: Ports
  release: None
  hardware: port
  path: /var/penguintb/juegos/roms/gzdoom
  extension:
  - .wad
  - .iwad
  - .pwad
  - .gzdoom
  platform:
  - pc
  theme: gzdoom
  group: ports
  emulators:
    gzdoom:
      cores:
        gzdoom:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
