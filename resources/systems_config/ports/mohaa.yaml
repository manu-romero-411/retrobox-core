mohaa:
  fullname: Medal Of Honor - Allied Assault
  manufacturer: Ports
  release: 2002
  hardware: port
  path: /var/penguintb/juegos/roms/mohaa
  extension:
  - .mohaa
  platform:
  - pc
  theme: mohaa
  group: ports
  emulators:
    openmohaa:
      cores:
        openmohaa:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
