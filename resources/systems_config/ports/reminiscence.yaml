reminiscence:
  fullname: REminiscence
  manufacturer: Ports
  release: 1992
  hardware: port
  path: /var/penguintb/juegos/roms/reminiscence
  extension:
  - .rem
  platform:
  - pc
  theme: reminiscence
  group: ports
  emulators:
    libretro:
      cores:
        reminiscence:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
