halflife:
  fullname: Half-Life 1
  manufacturer: Ports
  release: 1998
  hardware: port
  path: /var/penguintb/juegos/roms/halflife
  extension:
  - .game
  platform:
  - pc
  theme: halflife
  group: ports
  emulators:
    xash3d_fwgs:
      cores:
        xash3d_fwgs:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
