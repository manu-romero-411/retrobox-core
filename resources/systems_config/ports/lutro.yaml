lutro:
  fullname: Lutro
  manufacturer: Ports
  release: None
  hardware: port
  path: /var/penguintb/juegos/roms/lutro
  extension:
  - .lutro
  - .zip
  - .7z
  platform:
  - lutro
  theme: lutro
  group: ports
  emulators:
    libretro:
      cores:
        lutro:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
