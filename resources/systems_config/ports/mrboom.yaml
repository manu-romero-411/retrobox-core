mrboom:
  fullname: MrBoom
  manufacturer: Ports
  release: None
  hardware: port
  path: /var/penguintb/juegos/roms/mrboom
  extension:
  - .libretro
  platform:
  - pc
  theme: mrboom
  group: ports
  emulators:
    libretro:
      cores:
        mrboom:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
