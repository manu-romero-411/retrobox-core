traider2:
  fullname: Tomb Raider 2
  manufacturer: Ports
  release: 1997
  hardware: port
  path: /var/penguintb/juegos/roms/traider2
  extension:
  - .croft
  platform:
  - pc
  theme: traider2
  group: ports
  emulators:
    tr2x:
      cores:
        tr2x:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
