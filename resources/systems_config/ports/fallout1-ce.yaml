fallout1-ce:
  fullname: Fallout Community Edition
  manufacturer: Ports
  release: 1997
  hardware: port
  path: /var/penguintb/juegos/roms/fallout1-ce
  extension:
  - .f1ce
  platform:
  - pc
  theme: fallout1-ce
  group: ports
  emulators:
    fallout1-ce:
      cores:
        fallout1-ce:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
