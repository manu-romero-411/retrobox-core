hurrican:
  fullname: Hurrican
  manufacturer: Ports
  release: 2007
  hardware: port
  path: /var/penguintb/juegos/roms/hurrican
  extension:
  - .game
  platform:
  - pc
  theme: hurrican
  group: ports
  emulators:
    hurrican:
      cores:
        hurrican:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
