hcl:
  fullname: Hydra Castle Labyrinth
  manufacturer: Ports
  release: 2011
  hardware: port
  path: /var/penguintb/juegos/roms/hcl
  extension:
  - .game
  platform:
  - pc
  theme: hcl
  group: ports
  emulators:
    hcl:
      cores:
        hcl:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
