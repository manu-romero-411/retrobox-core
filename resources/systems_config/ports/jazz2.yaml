jazz2:
  fullname: Jazz Jackrabbit 2
  manufacturer: Ports
  release: 1998
  hardware: port
  path: /var/penguintb/juegos/roms/jazz2
  extension:
  - .game
  platform:
  - pc
  theme: jazz2
  group: ports
  emulators:
    jazz2-native:
      cores:
        jazz2-native:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
