bstone:
  fullname: Blake Stone
  manufacturer: Ports
  release: 1993
  hardware: port
  path: /var/penguintb/juegos/roms/bstone
  extension:
  - .bstone
  platform:
  - pc
  theme: bstone
  group: ports
  emulators:
    bstone:
      cores:
        bstone:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
