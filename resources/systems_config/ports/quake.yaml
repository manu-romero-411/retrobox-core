quake:
  fullname: Quake
  manufacturer: Ports
  release: 1996
  hardware: port
  path: /var/penguintb/juegos/roms/quake
  extension:
  - .quake
  platform:
  - pc
  theme: quake
  group: ports
  emulators:
    libretro:
      cores:
        tyrquake:
          default: true
    vkquake:
      cores:
        vkquake: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
