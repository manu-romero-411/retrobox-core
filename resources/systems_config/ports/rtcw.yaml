rtcw:
  fullname: Return To Castle Wolfenstein
  manufacturer: Ports
  release: 2001
  hardware: port
  path: /var/penguintb/juegos/roms/rtcw
  extension:
  - .rtcw
  platform:
  - pc
  theme: rtcw
  group: ports
  emulators:
    iortcw:
      cores:
        iortcw: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
