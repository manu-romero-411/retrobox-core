sdlpop:
  fullname: SdlPop
  manufacturer: Ports
  release: None
  hardware: port
  path: /var/penguintb/juegos/roms/sdlpop
  extension:
  - .sdlpop
  platform:
  - pc
  theme: sdlpop
  group: ports
  emulators:
    sdlpop:
      cores:
        sdlpop:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
