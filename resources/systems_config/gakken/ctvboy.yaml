ctvboy:
  fullname: Compact Vision TV Boy
  manufacturer: Gakken
  release: 1983
  hardware: console
  path: /var/penguintb/juegos/roms/ctvboy
  extension:
  - .bin
  - .zip
  - .7z
  platform:
  - ctvboy
  theme: ctvboy
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
