ikemen:
  fullname: IKEMEN
  manufacturer: Elecbyte
  release: 2021
  hardware: port
  path: /var/penguintb/juegos/roms/ikemen
  extension:
  - .ikemen
  - .pc
  platform:
  - ikemen
  theme: ikemen
  emulators:
    ikemen:
      cores:
        ikemen:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
