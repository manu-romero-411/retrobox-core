mugen:
  fullname: MUGEN
  manufacturer: Elecbyte
  release: 1999
  hardware: port
  path: /var/penguintb/juegos/roms/mugen
  extension:
  - .pc
  platform:
  - mugen
  theme: mugen
  emulators:
    mugen:
      cores:
        wine-tkg:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
