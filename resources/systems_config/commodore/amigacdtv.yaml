amigacdtv:
  fullname: Amiga CDTV
  manufacturer: Commodore
  release: 1991
  hardware: console
  path: /var/penguintb/juegos/roms/amigacdtv
  extension:
  - .bin
  - .cue
  - .iso
  - .chd
  - .m3u
  platform:
  - amigacdtv
  theme: amigacdtv
  emulators:
    amiberry:
      cores:
        CDTV: {}
    fsuae:
      cores:
        CDTV: {}
    libretro:
      cores:
        puae:
          default: true
        puae2021: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
