cplus4:
  fullname: Commodore Plus4
  manufacturer: Commodore
  release: 1984
  hardware: computer
  path: /var/penguintb/juegos/roms/cplus4
  extension:
  - .d64
  - .prg
  - .tap
  - .m3u
  - .zip
  - .7z
  platform:
  - cplus4
  theme: cplus4
  group: c64
  emulators:
    libretro:
      cores:
        vice_xplus4: {}
    vice:
      cores:
        xplus4:
          default: true
          incompatible_extensions:
          - .m3u
          - .7z
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
