amigacd32:
  fullname: Amiga CD32
  manufacturer: Commodore
  release: 1994
  hardware: console
  path: /var/penguintb/juegos/roms/amigacd32
  extension:
  - .bin
  - .cue
  - .iso
  - .chd
  platform:
  - amigacd32
  theme: amigacd32
  emulators:
    amiberry:
      cores:
        CD32: {}
    fsuae:
      cores:
        CD32: {}
    libretro:
      cores:
        puae:
          default: true
        puae2021: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
