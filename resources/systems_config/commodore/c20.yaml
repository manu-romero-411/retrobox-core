c20:
  fullname: Commodore VIC-20
  manufacturer: Commodore
  release: 1980
  hardware: computer
  path: /var/penguintb/juegos/roms/c20
  extension:
  - '.20'
  - '.40'
  - '.60'
  - .rom
  - .a0
  - .b0
  - .crt
  - .d64
  - .d81
  - .prg
  - .tap
  - .t64
  - .m3u
  - .zip
  - .7z
  platform:
  - c20
  theme: c20
  emulators:
    libretro:
      cores:
        vice_xvic: {}
    vice:
      cores:
        xvic:
          default: true
          incompatible_extensions:
          - .m3u
          - .7z
          - '.20'
          - '.40'
          - '.60'
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
