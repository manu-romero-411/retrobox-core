recordings:
  fullname: Recordings
  manufacturer: Misc. System
  release: None
  hardware: system
  path: /var/penguintb/juegos/recordings
  extension:
  - .mkv
  - .mp4
  - .avi
  - .webm
  - .mp3
  - .wav
  - .ogg
  - .flac
  platform:
  - imageviewer
  theme: recordings
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
