multivision:
  fullname: Othello Multivision
  manufacturer: Tsukuda Original
  release: 1983
  hardware: console
  path: /var/penguintb/juegos/roms/multivision
  extension:
  - .bin
  - .sg
  - .zip
  - .7z
  platform:
  - sg-1000
  theme: multivision
  emulators:
    libretro:
      cores:
        gearsystem:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
