apps:
  fullname: Apps
  manufacturer: _Retrobox
  release: None
  hardware: system
  path: ../resources/apps
  extension:
  - .webapp
  - .kodi
  platform:
  - apps
  theme: apps
  emulators:
    chrome:
      cores:
        chrome:
          default: true
          incompatible_extensions:
          - .kodi
    firefox:
      cores:
        firefox:
          incompatible_extensions:
          - .kodi
    kodi:
      cores:
        kodi:
          incompatible_extensions:
          - .webapp
