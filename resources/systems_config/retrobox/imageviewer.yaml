imageviewer:
  fullname: Screenshots
  manufacturer: _Retrobox
  release: None
  hardware: system
  path: ../screenshots
  extension:
  - .jpg
  - .jpeg
  - .png
  - .bmp
  - .psd
  - .tga
  - .gif
  - .hdr
  - .pic
  - .ppm
  - .pgm
  - .mkv
  - .pdf
  - .mp4
  - .avi
  - .webm
  platform:
  - imageviewer
  theme: imageviewer
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
