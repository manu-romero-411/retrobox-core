lindbergh:
  fullname: Sega Lindbergh
  manufacturer: Sega
  release: 2005
  hardware: arcade
  path: /var/penguintb/juegos/roms/lindbergh
  extension:
  - .game
  platform:
  - lindbergh
  - arcade
  theme: lindbergh
  emulators:
    lindbergh-loader:
      cores:
        lindbergh-loader:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
