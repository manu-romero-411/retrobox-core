naomi2:
  fullname: Naomi 2
  manufacturer: Sega
  release: 2000
  hardware: arcade
  path: /var/penguintb/juegos/roms/naomi2
  extension:
  - .zip
  - .7z
  platform:
  - naomi2
  - arcade
  theme: naomi2
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
