hikaru:
  fullname: Hikaru
  manufacturer: Sega
  release: 1999
  hardware: arcade
  path: /var/penguintb/juegos/roms/hikaru
  extension:
  - .zip
  - .7z
  platform:
  - hikaru
  - arcade
  theme: hikaru
  emulators:
    demul:
      cores:
        demul:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
