cave3rd:
  fullname: Cave CV1000
  manufacturer: Sega
  release: 2004
  hardware: arcade
  path: /var/penguintb/juegos/roms/cave3rd
  extension:
  - .zip
  - .7z
  platform:
  - cave3rd
  - arcade
  theme: cave3rd
  emulators:
    demul:
      cores:
        demul: {}
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
