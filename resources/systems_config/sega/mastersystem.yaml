mastersystem:
  fullname: Master System
  manufacturer: Sega
  release: 1985
  hardware: console
  path: /var/penguintb/juegos/roms/mastersystem
  extension:
  - .bin
  - .sms
  - .zip
  - .7z
  platform:
  - mastersystem
  theme: mastersystem
  emulators:
    clk:
      cores:
        clk:
          incompatible_extensions:
          - .7z
    libretro:
      cores:
        gearsystem: {}
        genesisplusgx:
          default: true
        picodrive: {}
        smsplus: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
