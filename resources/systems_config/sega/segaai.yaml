segaai:
  fullname: Sega AI Computer
  manufacturer: Sega
  release: 1986
  hardware: computer
  path: /var/penguintb/juegos/roms/segaai
  extension:
  - .bin
  - .wav
  - .flac
  - .cas
  - .zip
  - .7z
  platform:
  - segaai
  theme: segaai
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
