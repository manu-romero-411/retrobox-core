model2:
  fullname: Model 2
  manufacturer: Sega
  release: 1993
  hardware: arcade
  path: /var/penguintb/juegos/roms/model2
  extension:
  - .zip
  platform:
  - model2
  - arcade
  theme: model2
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame: {}
    model2emu:
      cores:
        model2emu:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
