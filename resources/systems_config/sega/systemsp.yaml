systemsp:
  fullname: Sega System SP
  manufacturer: Sega
  release: 2004
  hardware: arcade
  path: /var/penguintb/juegos/roms/systemsp
  extension:
  - .lst
  - .bin
  - .dat
  - .zip
  - .7z
  platform:
  - systemsp
  - arcade
  theme: systemsp
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
