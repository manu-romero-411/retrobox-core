sg1000:
  fullname: SG-1000
  manufacturer: Sega
  release: 1983
  hardware: console
  path: /var/penguintb/juegos/roms/sg1000
  extension:
  - .bin
  - .sg
  - .zip
  - .7z
  platform:
  - sg-1000
  theme: sg-1000
  emulators:
    libretro:
      cores:
        gearsystem: {}
        genesisplusgx:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
