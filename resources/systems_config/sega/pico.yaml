pico:
  fullname: Sega Pico
  manufacturer: Sega
  release: 1993
  hardware: console
  path: /var/penguintb/juegos/roms/pico
  extension:
  - .bin
  - .md
  - .zip
  - .7z
  platform:
  - pico
  theme: pico
  group: megadrive
  emulators:
    libretro:
      cores:
        genesisplusgx:
          default: true
        genesisplusgx-wide: {}
        picodrive: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
