sega32x:
  fullname: 32x
  manufacturer: Sega
  release: 1994
  hardware: console
  path: /var/penguintb/juegos/roms/sega32x
  extension:
  - .32x
  - .chd
  - .smd
  - .bin
  - .md
  - .zip
  - .7z
  platform:
  - sega32x
  theme: sega32x
  group: megadrive
  emulators:
    libretro:
      cores:
        picodrive:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
