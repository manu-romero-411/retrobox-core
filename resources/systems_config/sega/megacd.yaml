megacd:
  fullname: Mega CD
  manufacturer: Sega
  release: 1991
  hardware: console
  path: /var/penguintb/juegos/roms/megacd
  extension:
  - .cue
  - .iso
  - .chd
  - .m3u
  platform:
  - megacd
  theme: megacd
  emulators:
    libretro:
      cores:
        genesisplusgx:
          default: true
        picodrive: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
