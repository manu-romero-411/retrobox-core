dreamcast:
  fullname: Dreamcast
  manufacturer: Sega
  release: 1998
  hardware: console
  path: /var/penguintb/juegos/roms/dreamcast
  extension:
  - .cdi
  - .cue
  - .gdi
  - .chd
  - .m3u
  platform:
  - dreamcast
  theme: dreamcast
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
    redream:
      cores:
        redream: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
