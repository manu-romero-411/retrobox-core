dreamcast:
  fullname: Dreamcast
  manufacturer: Sega
  release: 1998
  hardware: console
  extension:
  - .cdi
  - .cue
  - .gdi
  - .chd
  - .m3u
  platform:
  - dreamcast
  theme: dreamcast
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
    redream:
      cores:
        redream: {}
