sc3000:
  fullname: SC-3000
  manufacturer: Sega
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/sc3000
  extension:
  - .bin
  - .sg
  - .wav
  - .cas
  - .bit
  - .zip
  - .7z
  platform:
  - sc-3000
  theme: sc-3000
  emulators:
    libretro:
      cores:
        mame:
          default: true
    mame:
      cores:
        mame: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
