naomi:
  fullname: Naomi
  manufacturer: Sega
  release: 1998
  hardware: arcade
  path: /var/penguintb/juegos/roms/naomi
  extension:
  - .lst
  - .bin
  - .dat
  - .zip
  - .7z
  platform:
  - naomi
  - arcade
  theme: naomi
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
