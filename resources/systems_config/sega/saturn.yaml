saturn:
  fullname: Saturn
  manufacturer: Sega
  release: 1994
  hardware: console
  path: /var/penguintb/juegos/roms/saturn
  extension:
  - .cue
  - .ccd
  - .m3u
  - .chd
  - .iso
  - .zip
  - .mds
  platform:
  - saturn
  theme: saturn
  emulators:
    libretro:
      cores:
        beetle-saturn:
          default: true
          incompatible_extensions:
          - .zip
        kronos: {}
        yabasanshiro:
          incompatible_extensions:
          - .m3u
    ymir:
      cores:
        ymir: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
