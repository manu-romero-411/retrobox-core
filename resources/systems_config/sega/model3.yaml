model3:
  fullname: Model 3
  manufacturer: Sega
  release: 1996
  hardware: arcade
  path: /var/penguintb/juegos/roms/model3
  extension:
  - .zip
  platform:
  - model3
  - arcade
  theme: model3
  emulators:
    libretro:
      cores:
        mame: {}
    mame:
      cores:
        mame: {}
    supermodel:
      cores:
        supermodel:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
