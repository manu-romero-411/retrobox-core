megadrive-msu:
  fullname: MSU-MD
  manufacturer: Sega
  release: 2020
  hardware: console
  path: /var/penguintb/juegos/roms/megadrive-msu
  extension:
  - .md
  - .zip
  - .7z
  - .squashfs
  platform:
  - genesis
  - megadrive
  theme: megadrive-msu
  group: megadrive
  emulators:
    libretro:
      cores:
        genesisplusgx:
          default: true
        genesisplusgx-wide: {}
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
