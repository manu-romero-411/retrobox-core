vpinball:
  fullname: Visual Pinball X
  manufacturer: Randy Davis
  release: 2000
  hardware: pinball
  path: /var/penguintb/juegos/roms/vpinball
  extension:
  - .vpx
  platform:
  - vpinball
  theme: vpinball
  emulators:
    vpinball:
      cores:
        vpinball:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
