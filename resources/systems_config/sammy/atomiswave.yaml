atomiswave:
  fullname: Atomiswave
  manufacturer: Sammy
  release: 2003
  hardware: arcade
  path: /var/penguintb/juegos/roms/atomiswave
  extension:
  - .lst
  - .bin
  - .dat
  - .zip
  - .7z
  platform:
  - atomiswave
  - arcade
  theme: atomiswave
  emulators:
    flycast:
      cores:
        flycast: {}
    libretro:
      cores:
        flycast:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
