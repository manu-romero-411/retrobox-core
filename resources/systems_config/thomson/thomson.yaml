thomson:
  fullname: Thomson - MO/TO (Theodore)
  manufacturer: Thomson
  release: 1984
  hardware: computer
  path: /var/penguintb/juegos/roms/thomson
  extension:
  - .fd
  - .sap
  - .k7
  - .m7
  - .m5
  - .rom
  - .zip
  platform:
  - thomson
  theme: thomson
  emulators:
    libretro:
      cores:
        theodore:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
