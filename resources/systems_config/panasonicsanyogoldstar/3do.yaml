3do:
  fullname: 3DO Interactive Multiplayer
  manufacturer: Panasonic - Sanyo - Goldstar
  release: 1993
  hardware: console
  path: /var/penguintb/juegos/roms/3do
  extension:
  - .iso
  - .chd
  - .cue
  platform:
  - 3do
  theme: 3do
  emulators:
    libretro:
      cores:
        opera:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
