spectravideo:
  fullname: Spectravideo SV-328
  manufacturer: Spectravideo
  release: 1983
  hardware: computer
  path: /var/penguintb/juegos/roms/spectravideo
  extension:
  - .zip
  - .7z
  - .cas
  platform:
  - spectravideo
  theme: spectravideo
  emulators:
    libretro:
      cores:
        bluemsx: {}
    openmsx:
      cores:
        openmsx:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
