zx81:
  fullname: ZX81
  manufacturer: Sinclair
  release: 1981
  hardware: computer
  path: /var/penguintb/juegos/roms/zx81
  extension:
  - .tzx
  - .p
  - .zip
  - .7z
  platform:
  - zx81
  theme: zx81
  emulators:
    libretro:
      cores:
        '81':
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
