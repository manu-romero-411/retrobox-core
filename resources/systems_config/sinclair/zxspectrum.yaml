zxspectrum:
  fullname: ZX Spectrum
  manufacturer: Sinclair
  release: 1982
  hardware: computer
  path: /var/penguintb/juegos/roms/zxspectrum
  extension:
  - .tzx
  - .tap
  - .z80
  - .rzx
  - .scl
  - .trd
  - .dsk
  - .zip
  - .7z
  platform:
  - zxspectrum
  theme: zxspectrum
  emulators:
    clk:
      cores:
        clk:
          incompatible_extensions:
          - .7z
    libretro:
      cores:
        fuse:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
