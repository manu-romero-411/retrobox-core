arduboy:
  fullname: Arduboy
  manufacturer: Kevin Bates
  release: 2015
  hardware: portable
  path: /var/penguintb/juegos/roms/arduboy
  extension:
  - .hex
  - .zip
  - .7z
  platform:
  - arduboy
  theme: arduboy
  emulators:
    libretro:
      cores:
        arduous:
          default: true
  command: /usr/bin/python3 /var/penguin/juegos/retrobox/runtime/launcher/emulatorlauncher.py %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%
