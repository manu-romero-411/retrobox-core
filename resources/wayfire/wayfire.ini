# wayfire.ini
# Traducción de rc.xml (labwc) a Wayfire.
# Copiar a ~/.config/wayfire.ini

# Input / teclado ────────────────────────────────────────────────
[input]
xkb_layout = es
kb_repeat_rate = 25
kb_repeat_delay = 600

# Core ──────────────────────────────────────────────────────────
[core]

# Solo los plugins necesarios para reproducir el comportamiento
# de tu rc.xml + gestión básica de ventanas.
# Se han excluido a propósito: animate, wobbly, cube, fisheye, zoom,
# alpha, invert, expo, vswitch, vswipe, grid, simple-tile, blur, wrot
# -> son los responsables de las animaciones/efectos.
plugins = \
  autostart \
  command \
  decoration \
  fast-switcher \
  grid \
  move \
  preserve-output \
  resize \
  place \
  window-rules \
  wm-actions

# Cerrar ventana activa (equivalente a <action name="Close"/>)
close_top_view = <alt> KEY_F4

# Fondo 100% negro (RGBA). Se ve siempre que nada más dibuje el fondo,
# así que además desactivamos el wallpaper de wf-shell más abajo.
background_color = 0 0 0 1

# Aero-snap: arrastrar una ventana contra un borde/esquina de la
# pantalla la ajusta a media pantalla / un cuarto de pantalla.
# move.activate ya es <super> BTN_LEFT por defecto (arrastrar con
# botón izq. + Super); aquí solo confirmamos snap explícitamente.
[move]
enable_snap = true
enable_snap_off = true
snap_threshold = 10

# El propio ajuste al soltar la ventana usa el plugin grid.
# type = none -> sin animación de encaje (crossfade/wobbly la tienen).
[grid]
type = none
duration = 0

# Autostart ─────────────────────────────────────────────────────
[autostart]
# No lanzar wf-panel / wf-background (que pintaría un wallpaper
# por defecto encima del color negro de arriba).
autostart_wf_shell = false

# Programas que quieras lanzar al iniciar Wayfire, igual que el
# autostart de labwc (~/.config/labwc/autostart). El nombre a la
# izquierda es libre (solo debe ser único); el valor es el comando.
retrobox_load = /var/penguin/juegos/retrobox/resources/wayfire/retrobox-wayfire-session
# notifs = mako
# idle = swayidle -w timeout 300 'swaylock'

# Cambiar entre ventanas (equivalente a A-Tab / A-S-Tab)
# fast-switcher no anima nada: cambia al instante.
[fast-switcher]
activate = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB

# Comandos / atajos ─────────────────────────────────────────────
[command]

# Cambiar pantallas y salidas de audio
binding_switch_display = <super> KEY_P
command_switch_display = /var/penguin/juegos/retrobox/resources/wayfire/retrobox-switch-display toggle

binding_switch_audio = <super> KEY_O
command_switch_audio = /var/penguin/juegos/retrobox/resources/wayfire/retrobox-switch-audio-out toggle

# Cambiar a Plasma
binding_exit_tty = <super> KEY_D
command_exit_tty = /var/penguin/juegos/retrobox/resources/wayfire/retrobox-exit-tty -n

# Terminal
binding_terminal = <super> KEY_T
command_terminal = kitty

# Screenshot
binding_screenshot = KEY_PRINT
command_screenshot = /var/penguin/juegos/retrobox/resources/utils/retrobox-screenshot

# Volumen PipeWire
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Silenciar micrófono
binding_mic_mute = KEY_MICMUTE
command_mic_mute = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Salir de Wayfire manualmente (W-S-e).
# Wayfire NO tiene un binding nativo de "salir del compositor" como
# labwc's <action name="Exit"/>. La forma habitual es matar el propio
# proceso; SIGINT suele producir un cierre limpio. Ajusta si tu setup
# usa otro método (systemd, un script propio como los de arriba, etc).
binding_quit = <super> <shift> KEY_E
command_quit = pkill -INT -x wayfire

# EmulationStation: mantenerlo borderless y a pantalla completa ─────
# Ajusta "emulationstation" al app_id/título real (comprueba en el
# log de Wayfire al lanzarlo, o usa "title contains ..." si el app_id
# no es fiable). window-rules no tiene una acción "fullscreen"; el
# equivalente robusto es maximizar + ocultar decoración.
[window-rules]
es_maximize_on_create = on created if app_id is "emulationstation" then maximize
# Se re-lanza esta regla cada vez que ES pierde el estado maximizado
# (por ejemplo al migrar de output cuando apagas una pantalla).
es_remaximize = on unmaximized if app_id is "emulationstation" then maximize

[decoration]
# border_size / title_height a 0 en vez de (o adem\u00e1s de) ignore_views:
# as\u00ed la barra de t\u00edtulo/borde nunca reserva espacio, sin depender de
# en qu\u00e9 orden se eval\u00faen decoration vs. el "maximize" de window-rules
# (esa carrera era justo lo que desplazaba la ventana hacia abajo).
border_size = 0
title_height = 0
ignore_views = app_id is "emulationstation"
