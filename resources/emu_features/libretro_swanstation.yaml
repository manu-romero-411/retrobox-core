emulator_name: libretro
core_name: swanstation
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: INTERNAL RESOLUTION
          value: swanstation_resolution_scale
          description: Multiplies the native PlayStation resolution. Bigger is sharper and slower.
          core_option: swanstation_GPU_ResolutionScale
          choices:
            - name: Auto (Default)
              value: auto
            - name: 1x (native)
              value: '1'
            - name: 2x
              value: '2'
            - name: 3x
              value: '3'
            - name: 4x
              value: '4'
            - name: 5x
              value: '5'
            - name: 6x
              value: '6'
            - name: 8x
              value: '8'
            - name: 10x
              value: '10'
            - name: 12x
              value: '12'
            - name: 16x
              value: '16'
