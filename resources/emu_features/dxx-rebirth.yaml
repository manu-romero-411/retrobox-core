emulator_name: "dxx-rebirth"
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: VSYNC
        value: use_vsync
        description: Fix screen tearing.
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
      - name: TEXTURE FILTERING
        value: rebirth_filtering
        description: Smooth textures on 3D objects.
        choices:
          - name: Classic (Default)
            value: 0
          - name: Blocky Filtered
            value: 1
          - name: Smooth
            value: 2
      - name: ANISOTROPIC FILTERING
        value: rebirth_anisotropy
        description: Improves clarity of distant textures.
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
      - name: 4x MULTISAMPLING
        value: rebirth_multisample
        description: ""
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
