emulator_name: vkquake3
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: vkquake3_api
        description: Choose which graphics API library to use.
        choices:
          - name: OpenGL
            value: opengl2
          - name: Vulkan
            value: vulkan
  ADVANCED OPTIONS:
    items:
      - name: GRAPHICS MEMORY
        value: ioquake3_mem
        description: "Select how much graphics memory is allocated for the GPU, may need modifying for some games / systems."
        choices:
          - name: 64MB
            value: 64
          - name: 128MB
            value: 128
          - name: 256MB (Default)
            value: 256
          - name: 512MB
            value: 512
