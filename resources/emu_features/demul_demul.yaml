emulator_name: demul
core_name: demul
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  GENERAL:
    items:
      - name: GAME ASPECT RATIO
        value: demulRatio
        description: ""
        choices:
          - name: Stretch
            value: 0
          - name: "4:3 (Default)"
            value: 1
          - name: "16:9"
            value: 2
      - name: VSYNC
        value: demulVSync
        description: Fix screen tearing.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
systems:
  - name: gaelco
    groups:
      GENERAL:
        items:
          - name: SET GAELCO SCALING AMOUNT
            value: demulScaling
            description: Set the amount of scaling from Gaelco's original resolution.
            choices:
              - name: 1x
                value: 1
              - name: 2x
                value: 2
              - name: 3x
                value: 3
              - name: 4x
                value: 4
              - name: 5x
                value: 5
              - name: 6x
                value: 6
