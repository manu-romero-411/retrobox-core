emulator_name: thextech
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  GENERAL:
    items:
      - name: FRAMESKIP
        value: frameskip
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: On (default)
            value: 1
          - name: Off
            value: 0
      - name: RENDERING MODE
        value: rendering_mode
        description: Better performance with hardware rendering.
        choices:
          - name: Hardware (default)
            value: hw
          - name: Software
            value: sw
          - name: Vsync
            value: vsync
