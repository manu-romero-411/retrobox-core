emulator_name: "ryujinx-emu"
features:
  - padtokeyboard
sharedFeatures:
  - discordrpc
  - videomode
  - power_profile
  - tdp
groups:
  SWITCH OPTIONS:
    submenus:
      CONTROLLERS:
        - name: AUTO CONTROLLER CONFIG
          value: ryu_auto_controller_config
          description: "Auto Controller Configuration Auto=On."
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: "INVERSE BUTTON A/X - X/Y"
          value: ryu_inverse_button
          description: Inverse Button A/X and X/Y For Xbox 
          choices:
            - name: Off
              value: false
            - name: On
              value: true
        - name: SDL_GAMECONTROLLERCONFIG
          value: ryu_sdl_game_controller_config
          description: "Use SDL_GAMECONTROLLERCONFIG from Batocera Auto=On. "
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: RUMBLE
          value: ryu_enable_rumble
          description: "Auto Controller Configuration Auto=On "
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: CONTROLLER 1 TYPE
          value: p1_pad
          description: "Choose Player 1 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
        - name: CONTROLLER 2 TYPE
          value: p2_pad
          description: "Choose Player 2 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
        - name: CONTROLLER 3 TYPE
          value: p3_pad
          description: "Choose Player 3 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
        - name: CONTROLLER 4 TYPE
          value: p4_pad
          description: "Choose Player 4 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
        - name: CONTROLLER 5 TYPE
          value: p5_pad
          description: "Choose Player 5 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
        - name: CONTROLLER 6 TYPE
          value: p6_pad
          description: "Choose Player 6 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
        - name: CONTROLLER 7 TYPE
          value: p7_pad
          description: "Choose Player 7 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
        - name: CONTROLLER 8 TYPE
          value: p8_pad
          description: "Choose Player 8 Pad Type Auto=Pro Controller"
          choices:
            - name: Pro Controller
              value: ProController
            - name: Joycon Pair
              value: JoyconPair
            - name: Left joycon
              value: JoyconLeft
            - name: Right Joycon
              value: JoyconRight
      SYSTEM:
        - name: DOCKED/HANDHELD
          value: ryu_docked_mode
          description: "Docked/Handheld mode Auto=Docked "
          choices:
            - name: Handheld
              value: 0
            - name: Docked
              value: 1
        - name: AUDIO DRIVER
          value: ryu_audio_backend
          description: Choose audio backend
          choices:
            - name: SDL2
              value: SDL2
            - name: OpenAL
              value: OpenAl
        - name: REGION
          value: system_region
          description: "System Region select Auto=USA"
          choices:
            - name: USA
              value: USA
            - name: Europe
              value: Europe
            - name: Japan
              value: Japan
            - name: Australia
              value: Australia
            - name: China
              value: China
            - name: Korea
              value: Korea
            - name: Taiwan
              value: Taiwan
        - name: LANGUAGE
          value: system_language
          description: "System language select Auto=American English"
          choices:
            - name: American English
              value: AmericanEnglish
            - name: Francais
              value: French
            - name: German
              value: German
            - name: Japanese
              value: Japanese
            - name: Italian
              value: Italian
            - name: Spanish
              value: Spanish
            - name: Chinese
              value: Chinese
            - name: Korean
              value: Korean
            - name: Dutch
              value: Dutch
            - name: Portuguese
              value: Portuguese
            - name: Russian
              value: Russian
            - name: Taiwanese
              value: Taiwanese
            - name: British English
              value: BritishEnglish
            - name: Canadian French
              value: CanadianFrench
            - name: Latina American Spanish
              value: LatinAmericanSpanish
            - name: Simplified Chinese
              value: SimplifiedChinese
            - name: Traditional Chinese
              value: TraditionalChinese
            - name: Brazilian Portuguese
              value: BrazilianPortuguese
        - name: PROFILED PERSISTENT TRANSLATION CACHE
          value: enable_ptc
          description: "PPTC Saves Translated functions for re-use Auto=On"
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: FS INTEGRITY CHECKS
          value: enable_fs_integrity_checks
          description: "Allows Ryujinx to load with some FS integrity issues in ROMs Auto=On"
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: MEMORY MANAGER MODE
          value: memory_manager_mode
          description: "Change how guest memory is mapped Auto=HostMappedUnsafe"
          choices:
            - name: Host Mapped Unsafe
              value: HostMappedUnsafe
            - name: Host Mapped
              value: HostMapped
            - name: Software
              value: SoftwarePageTable
        - name: "HACK: EXPAND DRAM"
          value: expand_ram
          description: "Expand DRAM to 6GB (Experimental) Auto=Off"
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: "HACK: IGNORE MISSING SERVICES"
          value: ignore_missing_services
          description: "Avoids some missing services crashing Ryujinx (Experimental) Auto=Off"
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
      RENDERING:
        - name: GRAPHICS API
          value: ryu_backend
          description: Choose which graphics API library to use
          choices:
            - name: OpenGl
              value: OpenGl
            - name: Vulkan
              value: Vulkan
        - name: ANTIALIASING
          value: anti_aliasing
          description: Anti aliasing FXAA/SMAA
          choices:
            - name: Off
              value: None
            - name: Fxaa
              value: Fxaa
            - name: Smaa Low
              value: SmaaLow
            - name: Smaa Medium 
              value: SmaaMedium
            - name: Smaa High
              value: SmaaHigh
            - name: Smaa Ultra
              value: SmaaUltra
        - name: TEXTURES FILTERING
          value: scaling_filter
          description: "Smooths out textures on 3D objetcs Auto=Bilinear"
          choices:
            - name: Bilinear
              value: Bilinear
            - name: "Nearest-Neighbor"
              value: Nearest
            - name: AMD's FidelityFX Super Resolution
              value: Fsr
            - name: Area 
              value: 3
        - name: ANISOTROPIC FILTERING
          value: max_anisotropy
          description: "Enhance the quality with on perspective textures Auto=Auto"
          choices:
            - name: Auto
              value: "-1"
            - name: 2x
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
            - name: 16x
              value: 16
        - name: RESOLUTION SCALE
          value: ryu_resolution_scale
          description: "Choose resolution scaling Auto=Native"
          choices:
            - name: 1x Native (720p/1080p)
              value: 1.0
            - name: 2x (1440p/2160p)
              value: 2.0
            - name: 3x (2160p/3240p)
              value: 3.0
            - name: 4x (2880p/4320p)
              value: 4.0
            - name: Custom 0.2x (144p/216p)
              value: 0.2
            - name: Custom 0.3x (216p/324p)
              value: 0.3
            - name: Custom 0.4x (288p/432p)
              value: 0.4
            - name: Custom 0.5x (360p/540p)
              value: 0.5
            - name: Custom 0.6x (432p/648p)
              value: 0.6
            - name: Custom 0.7x (504p/756p)
              value: 0.7
            - name: Custom 0.8x (576p/864p)
              value: 0.8
            - name: Custom 0.9x (648p/972p)
              value: 0.9
            - name: Custom 1.0x (720p/1080p)
              value: 1.0
            - name: Custom 1.1x (792p/1188p)
              value: 1.1
            - name: Custom 1.2x (864p/1296p)
              value: 1.2
            - name: Custom 1.3x (936p/1404p)
              value: 1.3
            - name: Custom 1.4x (1008p/1512p)
              value: 1.4
            - name: Custom 1.5x (1080p/1620p)
              value: 1.5
            - name: Custom 1.6x (1152p/1728p)
              value: 1.6
            - name: Custom 1.7x (1224p/1836p)
              value: 1.7
            - name: Custom 1.8x (1296p/1994p)
              value: 1.8
            - name: Custom 1.9x (1368p/2052p)
              value: 1.9
            - name: Custom 2.0x (1440p/2160p)
              value: 2.0
            - name: Custom 2.1x (1512p/2268p)
              value: 2.1
            - name: Custom 2.2x (1584p/2376p)
              value: 2.2
            - name: Custom 2.3x (1656p/2484p)
              value: 2.3
            - name: Custom 2.4x (1728p/2592p)
              value: 2.4
            - name: Custom 2.5x (1800p/2700p)
              value: 2.5
            - name: Custom 2.6x (1872p/2808p)
              value: 2.6
            - name: Custom 2.7x (1944p/2916p)
              value: 2.7
            - name: Custom 2.8x (2016p/3024p)
              value: 2.8
            - name: Custom 2.9x (2088p/3132p)
              value: 2.9
            - name: Custom 3.0x (2160p/3240p)
              value: 3.0
        - name: GRAPHICS MULTITHREADING
          value: backend_threading
          description: "Graphics Backend Multithreading Auto=Auto"
          choices:
            - name: Auto
              value: Auto
            - name: Off
              value: Off
            - name: On
              value: On
        - name: SHADER CACHE
          value: ryu_shadercache
          description: Enable Shader Cache
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: TEXTURE RECOMPRESSION
          value: ryu_texture_recompression
          description: "Enable Texture Recompression Auto=Off"
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
      DISPLAY:
        - name: VSYNC
          value: use_vsync
          description: Fix the heavy screen tearing in games
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: ASPECT RATIO
          value: aspect_ratio
          description: "Aspect Ratio Auto=16:9"
          choices:
            - name: "4:3"
              value: Fixed4x3
            - name: "16:9"
              value: Fixed16x9
            - name: "16:10"
              value: Fixed16x10
            - name: "21:9"
              value: Fixed21x9
            - name: "32:9"
              value: Fixed32x9
            - name: Stretch to Fit Window
              value: Stretched
