emulator_name: libretro
core_name: vice_xpet
features:
  - padtokeyboard
sharedFeatures:
  - rewind
  - autosave
groups:
  GENERAL:
    items:
      - name: MODEL TYPE
        value: pet_model
        description: ""
        choices:
          - name: 8032
            value: 8032
          - name: 2001
            value: 2001
          - name: 3008
            value: 3008
          - name: 3016
            value: 3016
          - name: 3032
            value: 3032
          - name: 3032B
            value: 3032B
          - name: 4016
            value: 4016
          - name: 4032
            value: 4032
          - name: 4032B
            value: 4032B
          - name: 8096
            value: 8096
          - name: 8296
            value: 8296
          - name: SUPERPET
            value: SUPERPET
      - name: COLOR FILTER
        value: vice_pet_external_palette
        description: Can be used to simulate colors of particular displays.
        choices:
          - name: default
            value: default
          - name: green
            value: green
          - name: amber
            value: amber
          - name: white
            value: white
      - name: ASPECT RATIO
        value: vice_aspect_ratio
        description: Change the output resolution ratio.
        choices:
          - name: PAL 576x312px
            value: pal
          - name: NTSC 492x262px
            value: ntsc
      - name: Button Options
        value: vice_retropad_options
        description: RetroPad Face Button Options.
        choices:
          - name: "B = Fire"
            value: disabled
          - name: "B = Fire, A = Up"
            value: jump
          - name: "Y = Fire"
            value: rotate
          - name: "Y = Fire, B = Up"
            value: rotate_jump
      - name: CONTROLLER PORT
        value: vice_joyport
        description: "Most games use port 2, some use port 1."
        choices:
          - name: Port 1
            value: 1
          - name: Port 2
            value: 2
      - name: CONTROLLER TYPE
        value: vice_joyport_type
        description: ""
        choices:
          - name: Joystick
            value: 1
          - name: Paddles
            value: 2
          - name: Mouse (1351)
            value: 3
          - name: "Trackball (Atari CX-22)"
            value: 6
          - name: Koalapad
            value: 10
  ADVANCED OPTIONS:
    items:
      - name: ZOOM/CROP (HIDE BORDERS)
        value: vice_zoom_mode
        description: Hides borders on many games. Some games used the borders.
        choices:
          - name: "Auto-disable zoom"
            value: auto_disable
          - name: Auto zoom
            value: automatic
          - name: Off
            value: disabled
          - name: small
            value: small
          - name: medium
            value: medium
          - name: maximum
            value: maximum
      - name: KEYBOARD PASSTHROUGH
        value: vice_keyboard_pass_through
        description: Keyboard shortcuts unavailable if passing through the keyboard.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
