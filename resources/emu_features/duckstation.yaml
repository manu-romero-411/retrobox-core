emulator_name: duckstation
features:
  - cheevos
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - use_guns
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    submenus:
      EMULATION:
        - name: EMULATION SPEED
          value: duckstation_clocking
          description: Determines the speed and the runahead behaviour of the system.
          choices:
            - name: Unlimited
              value: 0
            - name: "10%"
              value: .1
            - name: "20%"
              value: .2
            - name: "30%"
              value: .3
            - name: "40%"
              value: .4
            - name: "50%"
              value: .5
            - name: "60%"
              value: .6
            - name: "70%"
              value: .7
            - name: "80%"
              value: .8
            - name: "90%"
              value: .9
            - name: "100%"
              value: 1
            - name: "125%"
              value: 1.25
            - name: "150%"
              value: 1.5
            - name: "175%"
              value: 1.75
            - name: "200%"
              value: 2
            - name: "250%"
              value: 2.5
            - name: "300%"
              value: 3
            - name: "350%"
              value: 3.5
            - name: "400%"
              value: 4
            - name: "450%"
              value: 4.5
            - name: "500%"
              value: 5
            - name: "600%"
              value: 6
            - name: "700%"
              value: 7
            - name: "800%"
              value: 8
            - name: "900%"
              value: 9
            - name: "1000%"
              value: 10
        - name: SYNC TO HOST REFRESH RATE
          value: duckstation_hrr
          description: VSync and Audio Resampling need to be enabled.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: OPTIMAL FRAME PACING
          value: duckstation_ofp
          description: Ensure every frame the console renders is displayed to screen.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: CONSOLE REGION
          value: duckstation_region
          description: ""
          choices:
            - name: PAL
              value: PAL
            - name: "NTSC-U/C"
              value: "NTSC-U"
            - name: "NTSC-J"
              value: "NTSC-J"
        - name: FORCE BIOS
          value: duckstation_bios
          order: 102
          choices:
            - name: PSX ON PSP BIOS
              value: psxonpsp660.bin
            - name: PS1 JP (SCPH5500)
              value: scph5500.bin
            - name: PS1 US (SCPH5501)
              value: scph5501.bin
            - name: PS1 EU (SCPH5502)
              value: scph5502.bin
            - name: Version 2.0 (SCPH1001)
              value: scph1001.bin
            - name: Version 4.1 (SCPH7001)
              value: scph7001.bin
            - name: Version 4.5 (SCPH101)
              value: scph101.bin
      DISPLAY:
        - name: GRAPHICS API
          value: duckstation_gfxbackend
          description: Choose which graphics API library to use.
          choices:
            - name: Vulkan
              value: Vulkan
            - name: OpenGL
              value: OpenGL
            - name: Software
              value: Software
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing. CPU heavy.
          choices:
            - name: Off
              value: false
            - name: On
              value: true
        - name: THREADED PRESENTATION
          value: duckstation_threadedpresentation
          description: Improve performance if VSync is disabled and using Vulkan.
          choices:
            - name: Off
              value: false
            - name: On
              value: true
        - name: ASPECT RATIO
          value: duckstation_ratio
          description: Change the output resolution ratio.
          choices:
            - name: Match Window
              value: Auto (Match Window)
            - name: "4:3"
              value: "4:3"
            - name: "16:9"
              value: "16:9"
            - name: "19:9"
              value: "19:9"
            - name: "20:9"
              value: "20:9"
            - name: "PAR 1:1"
              value: "PAR 1:1"
        - name: CROP OVERSCAN
          value: duckstation_CropMode
          description: Zooms in to hide black borders. Borders are different per game.
          choices:
            - name: Off
              value: None
            - name: Only Overscan Area
              value: Overscan
            - name: All Borders
              value: Borders
        - name: INTEGER UPSCALING
          value: duckstation_integer
          description: May result in a sharper image in some 2D games.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: LINEAR UPSCALING
          value: duckstation_linear
          description: Enabling will smooth out the image.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: STRETCH TO FILL
          value: duckstation_stretch
          description: Fills the screen regardless of the aspect ratio. Doesn't work with Integer Upscaling.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: DISABLE INTERLACING
          value: duckstation_interlacing
          description: Force progressive render / scan.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: FORCE NTSC TIMINGS ON PAL
          value: duckstation_60hz
          description: "Hack. Increases most PAL games' speed by 17%."
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
      RENDERING:
        - name: RENDERING RESOLUTION
          value: duckstation_resolution_scale
          description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
          choices:
            - name: 1x native (320x240)
              value: 1
            - name: 2x (640x480)
              value: 2
            - name: 3x 720p (960x720)
              value: 3
            - name: 4x (1280x960)
              value: 4
            - name: 5x 1080p (1600x1200)
              value: 5
            - name: 6x 1440p (1920x1440)
              value: 6
            - name: 7x (2240x1680)
              value: 7
            - name: 8x (2560x1920)
              value: 8
            - name: 9x 4K (2880x2160)
              value: 9
            - name: 10x (3200x2400)
              value: 10
            - name: 11x (3520x2640)
              value: 11
            - name: 12x (3840x2880)
              value: 12
            - name: 13x (4160x3120)
              value: 13
            - name: 14x (4480x3360)
              value: 14
            - name: 15x (4800x3600)
              value: 15
            - name: 16x (5120x3840)
              value: 16
        - name: TEXTURE FILTERING
          value: duckstation_texture_filtering
          description: Enhancement. Smooth/upscale textures on 3D objects.
          choices:
            - name: "Nearest-Neighbor"
              value: Nearest
            - name: Bilinear
              value: Bilinear
            - name: Bilinear (No Edge Blending)
              value: BilinearBinAlpha
            - name: JINC2 (Slow)
              value: Jinc2
            - name: "JINC2 (Slow, No Edge Blending)"
              value: Jinc2BinAlpha
            - name: xBR (Very Slow)
              value: xBR
            - name: "xBR (Very Slow, No Edge Blending)"
              value: xBRBinAlpha
        - name: TRUE COLOUR RENDERING
          value: duckstation_truecolour
          description: "24-bit, disables dithering."
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: SCALED DITHERING
          value: duckstation_dithering
          description: Makes the dither pattern much less obvious at higher resolutions.
          choices:
            - name: Disabled
              value: false
            - name: Enabled (Default)
              value: true
        - name: WIDESCREEN HACK (GLITCHY)
          value: duckstation_widescreen_hack
          description: Enhancement. Only works with a 16/9 ratio and bezels disabled.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: "ANTI-ALIASING (MSAA/SSAA)"
          value: duckstation_antialiasing
          description: Enhancement. Smooth out jagged edges on 3D object polygons.
          choices:
            - name: Disabled (Default)
              value: 1
            - name: 2x MSAA
              value: 2
            - name: 4x MSAA
              value: 4
            - name: 8x MSAA
              value: 8
            - name: 16x MSAA
              value: 16
            - name: 32x MSAA
              value: 32
            - name: 2x SSAA
              value: "2-ssaa"
            - name: 4x SSAA
              value: "4-ssaa"
            - name: 8x SSAA
              value: "8-ssaa"
            - name: 16x SSAA
              value: "16-ssaa"
            - name: 32x SSAA
              value: "32-ssaa"
      CONTROLLERS:
        - name: JOYSTICK TO DPAD
          value: duckstation_digitalmode
          description: "Use Analog joysticks in addition to D-Pad for DualShock controllers."
          choices:
            - name: Off
              value: false
            - name: On
              value: true
        - name: CONTROLLER 1 TYPE
          value: duckstation_Controller1
          description: DualShock has rumble support. Not all games support DualShock.
          choices:
            - name: Not Connected
              value: None
            - name: PS1 Digital Controller
              value: DigitalController
            - name: PS1 Analog Joystick
              value: AnalogJoystick
            - name: DualShock / Xbox Type
              value: AnalogController
            - name: Namco GunCon
              value: GunCon
            - name: PlayStation Mouse
              value: PlayStationMouse
            - name: NeGcon (Rumble)
              value: NeGcon
        - name: CONTROLLER 2 TYPE
          value: duckstation_Controller2
          description: DualShock has rumble support. Not all games support DualShock.
          choices:
            - name: Not Connected
              value: None
            - name: PS1 Digital Controller
              value: DigitalController
            - name: PS1 Analog Joystick
              value: AnalogJoystick
            - name: DualShock / Xbox Type
              value: AnalogController
            - name: Namco GunCon
              value: GunCon
            - name: PlayStation Mouse
              value: PlayStationMouse
            - name: NeGcon (Rumble)
              value: NeGcon
    items:
      - name: ENABLE CHEATS
        value: duckstation_cheats
        description: Enable the cheat list (if available).
        choices:
          - name: Disabled (Default)
            value: false
          - name: Enabled
            value: true
      - name: "SHOW ON-SCREEN DISPLAY MESSAGES"
        value: duckstation_osd
        description: ""
        choices:
          - name: Disabled (Default)
            value: false
          - name: Enabled
            value: true
      - name: SHOW BIOS BOOTLOGO
        value: duckstation_PatchFastBoot
        description: Skipping it can break some games.
        choices:
          - name: Show
            value: false
          - name: Skip
            value: true
      - name: REWIND
        value: duckstation_rewind
        description: "System requirements at native; (RAM|VRAM)."
        choices:
          - name: Off
            value: false
          - name: "Per 0.05s, 5s total (550MB|100MB)"
            value: 5
          - name: "Per 0.1s, 10s total (1100MB|200MB)"
            value: 10
          - name: "Per 1s, 15s total (165MB|30MB)"
            value: 15
          - name: "Per 1s, 30s total (330MB|60MB)"
            value: 30
          - name: "Per 1s, 60s total (660MB|120MB)"
            value: 60
          - name: "Per 1s, 90s total (990MB|180MB)"
            value: 90
          - name: "Per 1s, 120s total (1320MB|240MB)"
            value: 120
      - name: ACHIEVEMENTS
        value: duckstation_achievements
        description: ""
        choices:
          - name: Disabled
            value: false
          - name: Enabled
            value: true
  AUDIO:
    items:
      - name: STRETCH MODE
        value: duckstation_audio_mode
        description: "When running outside of 100%, adjusts the temp instead of dropping frames."
        choices:
          - name: Off (Noisy)
            value: None
          - name: Resampling (Pirch Shift)
            value: Resample
          - name: "Time Stretch (Tempo Change, Best Sound)"
            value: TimeStretch
  ADVANCED OPTIONS:
    items:
      - name: LOAD CUSTOM TEXTURES
        value: duckstation_custom_textures
        description: Preload requires more RAM.
        choices:
          - name: Off
            value: false
          - name: Normal
            value: normal
          - name: Preload
            value: preload
      - name: ENABLE PGXP CORRECTIONS
        value: duckstation_pgxp
        description: "Reduces wobbly polygons & warping textures."
        choices:
          - name: Disabled
            value: false
          - name: Enabled (Default)
            value: true
      - name: ALLOW BOOTING WITHOUT SBI FILE
        value: duckstation_boot_without_sbi
        description: Allows loading protected games without subchannel information.
        choices:
          - name: Disabled (Default)
            value: false
          - name: Enabled
            value: true
      - name: CPU EXECUTION MODE
        value: duckstation_executionmode
        description: "Interpreter is the most accurate, but is the slowest."
        choices:
          - name: Interpreter (Slowest)
            value: Interpreter
          - name: Cached Interpreter (Faster)
            value: CachedInterpreter
          - name: Recompiler (Fastest)(Default)
            value: Recompiler
  LIGHT GUN:
    items:
      - name: CROSSHAIR
        value: duckstation_crosshair
        description: None
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
