emulator_name: libretro
sharedFeatures:
  - power_profile
  - tdp
  - ratio
  - shaderset
  - smooth
  - integerscale
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - hud_custom
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - ai_service_enabled
  - ai_target_lang
  - ai_service_url
  - ai_service_pause
  - audio_volume
  - bordersmode
groups:
  ADVANCED OPTIONS:
    items:
      - name: CONTROLLER TO LIGHT GUN
        value: lightgun_map
        description: Map controller inputs to light gun inputs.
        choices:
          - name: On
            value: true
          - name: Off
            value: false
  GENERAL:
    submenus:
      GAME RENDERING & SHADERS:
      - name: GAME ASPECT RATIO
        value: ratio
        description: Force the game to render in this aspect ratio. Not all systems support all ratios.
        choices:
          - name: 4/3
            value: 4/3
          - name: 16/9
            value: 16/9
          - name: Full
            value: full
          - name: 16/10
            value: 16/10
