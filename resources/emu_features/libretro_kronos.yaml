emulator_name: libretro
core_name: kronos
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: INTERNAL RESOLUTION
          value: kronos_resolution_mode
          description: Multiplies the native Saturn resolution. Needs a restart.
          choices:
            - name: Auto (Default)
              value: auto
            - name: 1x (original)
              value: original
            - name: 2x
              value: 2X
            - name: 4x
              value: 4X
            - name: 8x
              value: 8X
