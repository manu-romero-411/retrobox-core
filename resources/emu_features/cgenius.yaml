emulator_name: cgenius
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: ASPECT RATIO
        value: cgenius_aspect
        description: Choose your preferred aspect ratio.
        choices:
          - name: 4x3 (Default)
            value: "4:3"
          - name: 5x4
            value: "5:4"
          - name: 16x9
            value: "16:9"
          - name: 16x10
            value: "16:10"
          - name: disabled
            value: "0:0"
      - name: VIDEO FILTER
        value: cgenius_filter
        description: Choose your preferred video filter.
        choices:
          - name: None (Default)
            value: 1
          - name: Scale2x
            value: 2
          - name: Scale3x
            value: 3
          - name: Scale4x
            value: 4
      - name: VIDEO QUALITY
        value: cgenius_quality
        description: Choose your preferred video quality.
        choices:
          - name: nearest
            value: nearest
          - name: linear
            value: linear
          - name: best
            value: best
      - name: RENDER RESOLUTION
        value: cgenius_render
        description: Choose your preferred render resolution.
        choices:
          - name: 320x200
            value: 200
          - name: 320x240
            value: 240
          - name: 640x360
            value: 360
          - name: 640x480
            value: 480
      - name: CURSOR
        value: cgenius_cursor
        description: Enabled or disable the mouse cursor. Useful for CG's menus.
        choices:
          - name: Disabled (Default)
            value: false
          - name: Enabled
            value: true
