emulator_name: openmsx
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: LOADING SPEED
        value: openmsx_loading
        description: This can be convenient if you're using laserdiscs.
        choices:
          - name: Realistic Loading
            value: false
          - name: Full Speed (Default)
            value: true
      - name: DISK TYPE
        value: openmsx_disk
        description: Choose the appropriate media for disk image.
        choices:
          - name: Floppy Disk Image
            value: disk
          - name: Hard Disk Image
            value: hda
