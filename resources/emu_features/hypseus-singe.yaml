emulator_name: "hypseus-singe"
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - use_guns
systems:
  - name: singe
    groups:
      ADVANCED OPTIONS:
        items:
          - name: BLEND SPRITES (SINGE)
            value: singe_sprites
            description: Restore BLENDMODE outline on Singe sprites.
            choices:
              - name: Off
                value: 0
              - name: On
                value: 1
          - name: JOYSTICK TO CURSOR SENSITIVITY
            value: singe_joystick_range
            description: ""
            choices:
              - name: 5
                value: 5
              - name: 10
                value: 10
              - name: 15
                value: 15
              - name: 20
                value: 20
          - name: ABSOLUTE MOUSE INPUT
            value: singe_abs
            description: This option is required for some gun games when playing with a mouse.
            choices:
              - name: Off
                value: 0
              - name: On
                value: 1
      LIGHT GUN:
        items:
          - name: LIGHT GUN CROSSHAIRS
            value: singe_crosshair
            description: "Crosshairs in supported games e.g. ActionMax, Maddog II."
            choices:
              - name: Off
                value: 1
              - name: On
                value: 0
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: hypseus_api
        description: Choose which graphics API library to use. Vulkan may not work on all hardware.
        choices:
          - name: OpenGL
            value: OpenGL
          - name: Vulkan
            value: Vulkan
      - name: ASPECT RATIO
        value: hypseus_ratio
        description: "Not all games support stretching, depending on their video files."
        choices:
          - name: Original
            value: original
          - name: Stretch
            value: stretch
          - name: "Force 4:3"
            value: force_ratio
      - name: SCREEN ROTATION
        value: hypseus_rotate
        description: ""
        choices:
          - name: 0 degrees
            value: 0
          - name: 90 degrees
            value: 90
          - name: 270 degrees
            value: 270
      - name: BEZELS
        value: hypseus_bezels
        description: "Enable or disable bezels being added when content is a 4:3 aspect with a widescreen display."
        preset: switchauto
      - name: SMOOTH GAMES (BILINEAR FILTERING)
        value: hypseus_filter
        description: ""
        preset: switchauto
      - name: INVERT AXIS
        value: hypseus_axis
        description: Invert the vertical joystick axis on flight games.
        preset: switchauto
  ADVANCED OPTIONS:
    items:
      - name: SCANLINES
        value: hypseus_scanlines
        description: ""
        choices:
          - name: Off
            value: 0
          - name: Shunt 2
            value: 2
          - name: Shunt 3
            value: 3
          - name: Shunt 4
            value: 4
          - name: Shunt 5
            value: 5
          - name: Shunt 6
            value: 6
          - name: Shunt 7
            value: 7
          - name: Shunt 8
            value: 8
          - name: Shunt 9
            value: 9
          - name: Shunt 10
            value: 10
      - name: SDL TEXTURE ACCESS STREAMING
        value: hypseus_texturestream
        description: Can improve video performance. Do not use with ActionMax games or scanlines.
        preset: switchauto
      - name: CUSTOM CONTROLLER
        value: hypseus_joy
        description: Use controller settings manually defined in custom.ini.
        preset: switchauto
