emulator_name: mugen
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  ADVANCED OPTIONS:
    items:
      - name: ESYNC
        value: esync
        description: Can increase performance for games that stress the CPU.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: FSYNC
        value: fsync
        description: Can improve frame rates and responsiveness.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: PBA
        value: pba
        description: Vastly improves the speed of buffer maps.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
