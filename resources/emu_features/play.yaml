emulator_name: play
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: play_api
        description: Choose which graphics API library to use.
        choices:
          - name: OpenGL (Default)
            value: 0
          - name: Vulkan
            value: 1
      - name: OPENGL RENDERING RESOLUTION
        value: play_scale
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (~480)
            value: 1
          - name: 2x (~960)
            value: 2
          - name: 4x (~1920p)
            value: 4
          - name: 8x (~4320p / 8k)
            value: 8
          - name: 16x (~7680p / 16k)
            value: 16
      - name: PRESENTATION MODE
        value: play_mode
        description: ""
        choices:
          - name: Fill Screen
            value: 0
          - name: Fit Screen
            value: 1
          - name: Original Size
            value: 2
      - name: ENABLE WIDESCREEN
        value: play_widescreen
        description: Enable widescreen support.
        choices:
          - name: Disabled
            value: false
          - name: Enabled
            value: true
      - name: VSYNC
        value: use_vsync
        description: Fix screen tearing.
        choices:
          - name: Disabled
            value: false
          - name: Enabled
            value: true
      - name: SMOOTH GAMES (BILINEAR FILTERING)
        value: play_filter
        description: Only applicable when using OpenGL.
        choices:
          - name: Disabled
            value: false
          - name: Enabled
            value: true
      - name: LANGUAGE
        value: play_language
        description: Change the game's language.
        choices:
          - name: Japanese
            value: 0
          - name: English
            value: 1
          - name: French
            value: 2
          - name: Spanish
            value: 3
          - name: German
            value: 4
          - name: Italian
            value: 5
          - name: Dutch
            value: 6
          - name: Portuguese
            value: 7
          - name: Russian
            value: 8
          - name: Korean
            value: 9
          - name: Traditional Chinese
            value: 10
          - name: Simplified Chinese
            value: 11
