emulator_name: vpinball
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  EXPERT SETTINGS:
    items:
      - name: PER TABLE FOLDER
        value: vpinball_folders
        description: "Per Table Folder requires all files to be in the associated rom table folder. If disabled, consult the Wiki for further details."
        preset: switchauto
      - name: USE JOYPAD SOUTH BUTTON TO ADD CREDIT
        value: vpinball_pad_add_credit
        description: "This should not be necessary, unless you are not using the default pad2key mapping."
        preset: switchauto
      - name: ACCELEROMETER
        value: vpinball_pbw
        description: Internal accelerometer. Disable if you experience random tilts or unexpected ball behavior.
        preset: switchauto
  DISPLAY:
    items:
      - name: BALL TRAIL STRENGTH
        value: vpinball_balltrail
        description: Provides a ball trail to make the ball easier to follow.
        choices:
          - name: "0% (Default)"
            value: 0
          - name: "50%"
            value: 0.5
          - name: "60%"
            value: 0.6
          - name: "70%"
            value: 0.7
          - name: "80%"
            value: 0.8
          - name: "90%"
            value: 0.9
          - name: "100%"
            value: 1.0
      - name: VISUAL NUDGE STRENGTH
        value: vpinball_nudgestrength
        description: Affects just the visual effect of nudging.
        choices:
          - name: 0 (No Visual Effect)
            value: 0
          - name: "1%"
            value: 0.01
          - name: "2%"
            value: 0.02
          - name: "3%"
            value: 0.03
          - name: "4%"
            value: 0.04
      - name: MAXIMUM FRAMERATE
        value: vpinball_maxframerate
        description: Framerate limiter to reduce CPU utilisation.
        choices:
          - name: 0 (Defaults Unlimited)
            value: 0
          - name: 50
            value: 50
          - name: 60
            value: 60
          - name: 120
            value: 120
          - name: 144
            value: 144
      - name: VSYNC
        value: use_vsync
        description: "Fix screen tearing. Adaptive Sync (Default) synchronizes on video sync, except for late frames (below target FPS) which are displayed immediately."
        choices:
          - name: None
            value: 0
          - name: Vertical Sync
            value: 1
          - name: Adaptive Sync (Default)
            value: 2
      - name: PERFORMANCE PRESETS
        value: vpinball_presets
        description: Presets which can improve performance without manually editing the VPinballX.ini file to fine tune performance.
        choices:
          - name: Default Performance Settings
            value: defaults
          - name: "Low-end Computer"
            value: lowend
          - name: "High-end Computer"
            value: highend
          - name: Manual
            value: manual
      - name: ALTCOLOR
        value: vpinball_altcolor
        description: Alternative Coloured Dot Matrix Display (needs additional file).
        preset: switchauto
  WINDOWS POSITIONS:
    items:
      - name: PLAYFIELD
        value: vpinball_playfield
        description: Playfield configuration
        choices:
          - name: Manual
            value: manual
      - name: PINMAME DMD
        value: vpinball_pinmame
        description: "Extra DMD (Dot Matrix Display) window to display the score for tables with a pinmame rom. By default, settings come from the VPinballX.ini configuration file."
        choices:
          - name: "Top-Right Position, Small"
            value: topright_small
          - name: "Top-Right Position, Medium"
            value: topright_medium
          - name: "Top-Right Position, Large"
            value: topright_large
          - name: "Top-Left Position, Small"
            value: topleft_small
          - name: "Top-Left Position, Medium"
            value: topleft_medium
          - name: "Top-Left Position, Large"
            value: topleft_large
          - name: On screen 2 if available
            value: screen2
          - name: On screen 3 if available
            value: screen3
          - name: Disabled
            value: disabled
          - name: Manual
            value: manual
      - name: FLEX DMD
        value: vpinball_flexdmd
        description: "Extra DMD (Dot Matrix Display) window to display the score for tables without a rom. By default, settings come from the VPinballX.ini configuration file."
        choices:
          - name: "Top-Right Position, Small"
            value: topright_small
          - name: "Top-Right Position, Medium"
            value: topright_medium
          - name: "Top-Right Position, Large"
            value: topright_large
          - name: "Top-Left Position, Small"
            value: topleft_small
          - name: "Top-Left Position, Medium"
            value: topleft_medium
          - name: "Top-Left Position, Large"
            value: topleft_large
          - name: On screen 2 if available
            value: screen2
          - name: On screen 3 if available
            value: screen3
          - name: Disabled
            value: disabled
          - name: Manual
            value: manual
      - name: BACKGLASS (B2S)
        value: vpinball_b2s
        description: "Upright glass panel displaying some illuminated artwork. By default, settings come from the VPinballX.ini configuration file."
        choices:
          - name: "Top-Right Position, Small"
            value: topright_small
          - name: "Top-Right Position, Medium"
            value: topright_medium
          - name: "Top-Right Position, Large"
            value: topright_large
          - name: "Top-Left Position, Small"
            value: topleft_small
          - name: "Top-Left Position, Medium"
            value: topleft_medium
          - name: "Top-Left Position, Large"
            value: topleft_large
          - name: On screen 2 if available
            value: screen2
          - name: Disabled
            value: disabled
          - name: Manual
            value: manual
      - name: DISPLAY BACKGLASS DMD
        value: vpinball_b2sdmd
        description: "When the Backglass is activated, display the small additional part with the scores."
        preset: switchauto
      - name: DISPLAY BACKGLASS GRILL
        value: vpinball_b2sgrill
        description: "When the Backglass is activated, display the grill."
        preset: switchauto
      - name: DMD SIZE
        value: vpinball_dmdsize
        description: DMD window ratio
        choices:
          - name: 128x16
            value: 128x16
          - name: 128x32
            value: 128x32
          - name: 192x64
            value: 192x64
          - name: 256x64
            value: 256x64
      - name: INVERSE PLAYFIELD AND B2S
        value: vpinball_inverseplayfieldandb2s
        description: Inverse the Backglass and the Playfield. Usefull to use the Backglass as main screen for other emulators.
        choices:
          - name: On
            value: 1
          - name: Off
            value: 0
      - name: PLAYFIELD MODE
        value: vpinball_playfieldmode
        description: "FULLSCREEN gives you a top-down view on the playfield. For cabinet use or multi-window on desktop."
        choices:
          - name: DESKTOP
            value: 0
          - name: FULLSCREEN
            value: 1
          - name: FULL SINGLE SCREEN
            value: 2
  DISPLAY PHYSICAL SETUP:
    items:
      - name: ENABLE CUSTOM DISPLAY PHYSICAL SETUP
        value: vpinball_customphysicalsetup
        description: Enable the custom values below.
        preset: switchauto
      - name: SCREEN WIDTH
        value: vpinball_screenwidth
        description: Long visible screen edge (cm)
        preset: slider
        preset-parameters: 20 120 0.5 90
      - name: SCREEN HEIGHT
        value: vpinball_screenheight
        description: Short visible screen edge (cm)
        preset: slider
        preset-parameters: 10 80 0.5 50
      - name: SCREEN INCLINATION
        value: vpinball_screeninclination
        description: Screen inclination (degree)
        preset: slider
        preset-parameters: 0 90 0.5 0
      - name: SCREEN PLAYER Y
        value: vpinball_screenplayery
        description: Player distance from lower screen edge (cm)
        preset: slider
        preset-parameters: "-30 50 0.5 0"
      - name: SCREEN PLAYER Z
        value: vpinball_screenplayerz
        description: Player's eyes distance from lower screen edge (cm)
        preset: slider
        preset-parameters: 15 120 0.5 70
  AUDIO:
    items:
      - name: MUSIC VOLUME
        value: vpinball_musicvolume
        description: Adjust the music volume. Some tables may have its own settings.
        choices:
          - name: "0%"
            value: 0
          - name: "5%"
            value: 5
          - name: "10%"
            value: 10
          - name: "20%"
            value: 20
          - name: "30%"
            value: 30
          - name: "40%"
            value: 40
          - name: "50%"
            value: 50
          - name: "60%"
            value: 60
          - name: "70%"
            value: 70
          - name: "80%"
            value: 80
          - name: "90%"
            value: 90
          - name: "100%"
            value: 100
      - name: SOUND VOLUME
        value: vpinball_soundvolume
        description: Adjust the mechanical sounds of the table.
        choices:
          - name: "0%"
            value: 0
          - name: "5%"
            value: 5
          - name: "10%"
            value: 10
          - name: "20%"
            value: 20
          - name: "30%"
            value: 30
          - name: "40%"
            value: 40
          - name: "50%"
            value: 50
          - name: "60%"
            value: 60
          - name: "70%"
            value: 70
          - name: "80%"
            value: 80
          - name: "90%"
            value: 90
          - name: "100%"
            value: 100
      - name: ALTERNATIVE SOUND
        value: vpinball_altsound
        description: Alternative sounds for the table (needs additional files).
        preset: switchauto
