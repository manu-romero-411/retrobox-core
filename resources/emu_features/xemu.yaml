emulator_name: xemu
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: xemu_api
        description: Choose which graphics API library to use.
        choices:
          - name: OpenGL
            value: OPENGL
          - name: Vulkan
            value: VULKAN
      - name: SCALING MODE
        value: xemu_scaling
        description: Choose the scaling mode for the game screen.
        choices:
          - name: Original resolution
            value: center
          - name: Scale to best fit
            value: scale
          - name: Stretch to full
            value: stretch
      - name: ASPECT RATIO
        value: xemu_aspect
        description: Change the output resolution ratio.
        choices:
          - name: Native
            value: native
          - name: 4x3
            value: 4x3
          - name: 16x9
            value: 16x9
      - name: RENDERING RESOLUTION
        value: xemu_render
        description: ""
        choices:
          - name: 1x (640x480)
            value: 1
          - name: 2x (1280x960)
            value: 2
          - name: 3x (1920x1440)
            value: 3
          - name: 4x (2560x1920)
            value: 4
          - name: 5x (3200x2400)
            value: 5
          - name: 6x (3840x2880)
            value: 6
          - name: 7x (4480x3360)
            value: 7
          - name: 8x (5120x3840)
            value: 8
          - name: 9x (5760x4320)
            value: 9
          - name: 10x (6400x4800)
            value: 10
      - name: VSYNC
        value: xemu_vsync
        description: Fix screen tearing.
        choices:
          - name: Off
            value: false
          - name: On (Default)
            value: true
      - name: SHOW BIOS BOOTLOGO
        value: xemu_bootanim
        description: Enhancement.
        choices:
          - name: Show
            value: false
          - name: Skip
            value: true
      - name: USE DSP AUDIO
        value: xemu_use_dsp
        description: Improve audio accuracy (experimental).
        choices:
          - name: Enabled
            value: true
          - name: Disabled
            value: false
      - name: SYSTEM MEMORY
        value: xemu_memory
        description: Increase to 128 MiB for debug or homebrew applications.
        choices:
          - name: 64MiB (Default)
            value: 64
          - name: 128MiB
            value: 128
  NETWORK:
    submenus:
      NETWORK:
        - name: NETWORK TYPE
          value: xemu_networktype
          description: Nat to access internet from xemu machine. Udp for System Link. Default (Auto) disables network access.
          choices:
            - name: NAT
              value: nat
            - name: UDP Tunnel
              value: udp
        - name: UDP REMOTE ADDRESS
          value: xemu_udpremote
          description: Destination address and port to forward packets to. Leave this empty if you want to enter it manually in the xemu.toml configuration file.
          preset: input
        - name: UDP BIND ADDRESS
          value: xemu_udpbind
          description: Local address and port to receive packets on. Leave this empty if you want to enter it manually in the xemu.toml configuration file.
          preset: input
