emulator_name: libretro
core_name: nestopia
features:
  - netplay
sharedFeatures:
  - rewind
  - autosave
  - use_guns
groups:
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: nestopia_show_crosshair
        description: ""
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
  GENERAL:
    items:
      - name: REDUCE SPRITE FLICKERING
        value: nestopia_nospritelimit
        description: Enhancement. Remove the eight sprites per line limit.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
      - name: 4 PLAYER ADAPTER
        value: nestopia_select_adapter
        description: Manually activate the adapter for supported games.
        choices:
          - name: Autodetect
            value: automatic
          - name: NTSC (NES)
            value: ntsc
          - name: Famicom (FDS)
            value: famicom
  ADVANCED OPTIONS:
    items:
      - name: CROP OVERSCAN
        value: nestopia_cropoverscan
        description: Zooms in to hide black borders. Borders are different per game.
        choices:
          - name: None
            value: none
          - name: Horizontal
            value: h
          - name: Vertical
            value: v
          - name: Both
            value: both
      - name: COLOR FILTER
        value: nestopia_palette
        description: Can be used to simulate colors of particular displays.
        choices:
          - name: cxa2025as (US)
            value: cxa2025as
          - name: CXA2025AS (JP)
            value: cxa2025as_jp
          - name: royaltea
            value: royaltea
          - name: consumer
            value: consumer
          - name: canonical
            value: canonical
          - name: alternative
            value: alternative
          - name: rgb
            value: rgb
          - name: pal
            value: pal
          - name: Digital Prime FBX
            value: "digital-prime-fbx"
          - name: Magnum FBX
            value: "magnum-fbx"
          - name: Smooth V2 FBX
            value: "smoothv2-fbx"
          - name: "composite-direct-fbx"
            value: "composite-direct-fbx"
          - name: "pvm-style-d93-fbx"
            value: "pvm-style-d93-fbx"
          - name: "ntsc-hardware-fbx"
            value: "ntsc-hardware-fbx"
          - name: "nes-classic-fbx-fs"
            value: "nes-classic-fbx-fs"
          - name: Restored Wii VC
            value: "restored-wii-vc"
          - name: Wii Virtual Console
            value: "wii-vc"
          - name: Raw
            value: raw
          - name: custom
            value: custom
      - name: BLARGG NTSC FILTER
        value: nestopia_blargg_ntsc_filter
        description: "Core-powered video filter."
        choices:
          - name: Off
            value: disabled
          - name: Composite (color bleeding + artifacts)
            value: composite
          - name: SVideo (color bleeding only)
            value: svideo
          - name: RGB (crisp image)
            value: rgb
      - name: OVERCLOCK (UNSTABLE)
        value: nestopia_overclock
        description: Enhancement. Reduces system slowdown. Causes issues in some games.
        choices:
          - name: Off
            value: 1x
          - name: 2x
            value: 2x
