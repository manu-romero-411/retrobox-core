emulator_name: ymir
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: ASPECT RATIO
        value: ymir_aspect
        description: Change the output resolution ratio.
        choices:
          - name: "4:3"
            value: 1.3333333333333333
          - name: "3:2"
            value: 1.5
          - name: "16:10"
            value: 1.6
          - name: "16:9"
            value: 1.777777777777778
      - name: ROTATION
        value: ymir_rotation
        description: Change the rotation of the rendered image.
        choices:
          - name: Normal
            value: Normal
          - name: 90 degrees clockwise
            value: 90CW
          - name: 180 degrees
            value: 180
          - name: "90 degrees counter-clockwise"
            value: 90CCW
      - name: DEINTERLACE
        value: ymir_interlace
        description: Choose deinterlace option.
        choices:
          - name: Interlaced
            value: 0
          - name: "De-Interlaced"
            value: 1
      - name: TRANSPARENT MESHES
        value: ymir_meshes
        description: Choose to render meshes as transparent polygons.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
