emulator_name: corsixth
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  GENERAL:
    items:
      - name: USE NEW GRAPHICS
        value: cth_new_graphics
        description: Use new graphics created from CorsixTH project
        choices:
          - name: Enabled (Default)
            value: true
          - name: Disabled
            value: false
      - name: ENABLE SANDBOX MODE
        value: cth_free_build_mode
        description: Free Build or Sandbox mode. You cannot win or lose custom made maps if this is set to true. You also don't have to worry about money.
        choices:
          - name: Disabled (Default)
            value: false
          - name: Enabled
            value: true
      - name: PLAY INTRO MOVIE
        value: cth_play_intro
        description: Enable or Disable Intro movie (Enabled by default).
        choices:
          - name: Enabled (Default)
            value: true
          - name: Disabled
            value: false
