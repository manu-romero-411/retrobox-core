emulator_name: ares
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - hud
  - hud_corner
  - hud_custom
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - shaderset
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing. May bring latency
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: SCALING MODE
          value: ares_output
          description: 'How the picture fills the window: best fit, whole multiples of its size, or stretched to the window.'
          choices:
            - name: Best fit (Default)
              value: Scale
            - name: Integer scaling
              value: Integer
            - name: Stretch
              value: Stretch
        - name: ASPECT CORRECTION
          value: ares_aspect_correction
          description: Corrects the shape of the pixels of the original hardware.
          choices:
            - name: Standard (Default)
              value: Standard
            - name: None
              value: None
            - name: Anamorphic (widescreen)
              value: Anamorphic
        - name: COLOR EMULATION
          value: ares_color_emulation
          description: Accurately emulate original hardware color profiles.
          choices:
            - name: Disabled
              value: false
            - name: Enabled (Default)
              value: true
        - name: INTERFRAME BLENDING
          value: ares_interframe_blending
          description: Blend frames to simulate CRT motion blur.
          choices:
            - name: Disabled
              value: false
            - name: Enabled (Default)
              value: true
      AUDIO:
        - name: AUDIO VOLUME GAIN
          value: ares_audio_gain
          description: Set game audio level in dB. Ares can amplify up to +6 dB (twice the volume).
          choices:
            - name: '-12'
              value: "-12.0"
            - name: '-10'
              value: "-10.0"
            - name: '-8'
              value: "-8.0"
            - name: '-6'
              value: "-6.0"
            - name: '-4'
              value: "-4.0"
            - name: '-2'
              value: "-2.0"
            - name: 0 (No gain)
              value: 0
            - name: '+2'
              value: '2.0'
            - name: '+4'
              value: '4.0'
            - name: '+6'
              value: '6.0'
        - name: AUDIO LATENCY
          value: ares_audio_latency
          description: Adjust audio buffer latency in milliseconds.
          choices:
            - name: "20 ms"
              value: 20
            - name: "40 ms (Default)"
              value: 40
            - name: "80 ms"
              value: 80
      EMULATION:
        - name: FAST BOOT
          value: ares_fast_boot
          description: Skip system boot animation and intro sequences.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: REWIND
          value: ares_rewind
          description: Enable gameplay rewind functionality.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
  ADVANCED OPTIONS:
    submenus:
      PERFORMANCE:
        - name: THREADED RENDERER
          value: ares_threaded_renderer
          description: Enable multi-threaded rendering for improved performance.
          choices:
            - name: Disabled
              value: false
            - name: Enabled (Default)
              value: true
        - name: RUN AHEAD
          value: ares_run_ahead
          description: Reduce input latency by running frames ahead.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
