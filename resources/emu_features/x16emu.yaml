emulator_name: x16emu
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: x16emu_scale
        description: Enhancement. Increase the rendering resolution.
        choices:
          - name: 640x480
            value: 1
          - name: 1280x960 (Default)
            value: 2
          - name: 1920x1440
            value: 3
          - name: 2560x1920
            value: 4
      - name: ASPECT RATIO
        value: x16emu_ratio
        description: Change the output resolution ratio.
        choices:
          - name: 4x3 (Default)
            value: "4:3"
          - name: 16x9
            value: "16:9"
      - name: IMAGE QUALITY
        value: x16emu_quality
        description: Change image scaling algorithm quality.
        choices:
          - name: Nearest pixel sampling
            value: nearest
          - name: Linear filtering
            value: linear
          - name: Anisotropic filtering
            value: best
