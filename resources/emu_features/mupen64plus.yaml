emulator_name: mupen64plus
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
groups:
  GENERAL:
    submenus:
      CONTROLLER 1:
        - name: CONTROLLER TYPE
          value: "mupen64-controller1"
          description: Useful for N64 style controllers. Limited hotkeys for controllers without dedicated hotkey.
          choices:
            - name: RetroPad (Default)
              value: retropad
            - name: N64
              value: n64
        - name: SENSITIVITY
          value: "mupen64-sensitivity1"
          description: Apply a multiplier to the joystick's input to lower or increase responsiveness.
          choices:
            - name: 0.5x
              value: 0.5
            - name: 0.6x
              value: 0.6
            - name: 0.7x
              value: 0.7
            - name: 0.8x
              value: 0.8
            - name: 0.9x
              value: 0.9
            - name: 1x (Default)
              value: 1.0
            - name: 1.1x
              value: 1.1
            - name: 1.2x
              value: 1.2
            - name: 1.3x
              value: 1.3
            - name: 1.4x
              value: 1.4
            - name: 1.5x
              value: 1.5
        - name: DEADZONE
          value: "mupen64-deadzone1"
          description: The area around the joystick's neutral position where input is ignored. Can help reduce unintended inputs.
          choices:
            - name: "0%"
              value: 0.0
            - name: "1% (Default)"
