    items:
      - name: GAME ASPECT RATIO
        value: mupen64plus_ratio
        description: ""
        choices:
          - name: "4:3"
            value: 4/3
          - name: "16:9"
            value: 16/9
  ADVANCED OPTIONS:
    items:
      - name: FRAMESKIP (GL64MK2 ONLY)
        value: mupen64plus_frameskip
        description: "Skip frames to improve performance, at the cost of choppy motion."
        choices:
          - name: Off
            value: 0
          - name: Autodetect
            value: automatic
          - name: 1
            value: 1
          - name: 2
            value: 2
          - name: 3
            value: 3
          - name: 4
            value: 4
          - name: 5
            value: 5
      - name: AUDIO SYNC
        value: mupen64plus_AudioSync
        description: Enable second audio limiter. Improves audio quality at the cost of performance.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: AUDIO BUFFER (SAMPLES)
        value: mupen64plus_AudioBuffer
        description: "Lower values reduce audio latency and improve performance, but can cause audio issues."
        choices:
          - name: Very High
            value: Very High
          - name: High
            value: High
          - name: Medium
            value: Medium
          - name: Low
            value: Low
      - name: "TEXTURE MIP-MAPPING (BLUR)"
        value: mupen64plus_Mipmapping
        description: Smooth textures on distant 3D objects based on angle.
        choices:
          - name: Off
            value: 0
          - name: nearest
            value: 1
          - name: bilinear
            value: 2
          - name: trilinear
            value: 3
      - name: ANISOTROPIC FILTERING
        value: mupen64plus_Anisotropic
        description: "Enhancement. Improves clarity of distant textures when mip-mapping is enabled."
        choices:
          - name: Off
            value: 0
          - name: 2x
            value: 2
          - name: 4x
            value: 4
          - name: 8x
            value: 8
          - name: 16x
            value: 16
      - name: "ANTI-ALIASING (MSAA)"
        value: mupen64plus_AntiAliasing
        description: Enhancement. Smooth out jagged edges on 3D object polygons.
        choices:
          - name: Off
            value: 0
          - name: 2x
            value: 2
          - name: 4x
            value: 4
          - name: 8x
            value: 8
          - name: 16x
            value: 16
      - name: TEXTURE UPSCALING (RICE ONLY)
        value: mupen64plus_TextureEnhancement
        description: Upscale textures on 3D objects.
        choices:
          - name: Off
            value: 0
          - name: 2X
            value: 1
          - name: 2XSAI
            value: 2
          - name: HQ2X
            value: 3
          - name: LQ2X
            value: 4
          - name: HQ4X
            value: 5
          - name: Sharpen
            value: 6
          - name: Sharpen More
            value: 7
          - name: External
            value: 8
          - name: Mirrored
            value: 9
      - name: LOAD CUSTOM TEXTURES
        value: mupen64plus_LoadHiResTextures
        description: ""
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: DISABLE 4MB EXPANSION RAM PACK
        value: mupen64plus_DisableExtraMem
        description: Required by some games.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: READ FRAMEBUFFER EVERY FRAME (GLIDE64MK2)
        value: mupen64plus_fb_read_always
        description: "Required for some effects in-game (Banjo Kazooie and DK64 transitions), can cause slowdown."
        choices:
          - name: Game default
            value: "-1"
          - name: Disable
            value: 0
          - name: Enable
            value: 1
      - name: CHEATS
        value: mupen64plus_cheats
        description: "Pass custom cheats argument directly to mupen64plus using --cheats."
        preset: input
