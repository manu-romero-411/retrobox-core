emulator_name: model2emu
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: model2_renderRes
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 640x480
            value: 0
          - name: 800x600
            value: 1
          - name: 1024x768
            value: 2
          - name: 1280x1024
            value: 3
          - name: Screen Resolution (Default)
            value: 4
      - name: ENABLE WIDESCREEN
        value: model2_ratio
        description: Enable widescreen support.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: ENABLE SCANLINES
        value: model2_scanlines
        description: Enable scanlines for roms that support it.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: ENABLE SOFTWARE RENDERER
        value: model2_Software
        description: Use if you're having graphical issues or GPU problems with this emulator.
        choices:
          - name: Off (Default)
            value: 0
          - name: On
            value: 1
      - name: "X-INPUT"
        value: model2_xinput
        description: "Enable X-Input mode for Xbox type controllers."
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: RUMBLE
        value: model2_forceFeedback
        description: "Only some games support rumble. Requires X-Input mode and may not be compatible with all controllers."
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
  LIGHT GUN:
    items:
      - name: SHOW LIGHT GUN CROSSHAIRS
        value: model2_crossHairs
        description: ""
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
  ADVANCED OPTIONS:
    items:
      - name: FAKE GOURAUD
        value: model2_fakeGouraud
        description: "Tries to guess Per-vertex colour (gouraud) from the Model2 per-poly information (flat)."
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: BILINEAR FILTERING
        value: model2_bilinearFiltering
        description: Smooth textures.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: TRILINEAR FILTERING
        value: model2_trilinearFiltering
        description: Enables mipmap usage and trilinear filtering. Doesn't work with some games.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: FILTER TILEMAPS
        value: model2_filterTilemaps
        description: "Enables bilinear filtering on tilemaps. Looks good, but can cause some stretch artifacts."
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: FORCE MANAGED
        value: model2_forceManaged
        description: Forces the DX driver to use Managed textures instead of Dynamic.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: "ENABLE MIP-MAP"
        value: model2_enableMIP
        description: "Enables Direct3D Automip-map generation."
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: ENABLE MESH TRANSPARENCY
        value: model2_meshTransparency
        description: Enabled meshed polygons for translucency.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: "ENABLE FULL-SCREEN ANTI-ALIASING"
        value: model2_fullscreenAA
        description: "Enable full-screen antialiasing in Direct3D."
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: ENABLE RAW INPUT
        value: model2_useRawInput
        description: "Read mouse through Rawinput, allowing 2 mice for 2 player shooting games."
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
