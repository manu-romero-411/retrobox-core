emulator_name: gzdoom
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: gz_api
        description: Choose which graphics API library to use.
        choices:
          - name: OpenGL (Default)
            value: 0
          - name: Vulkan
            value: 1
      - name: VSYNC
        value: use_vsync
        description: Fix screen tearing. With Some games you need to turn VSync on in the games options.
        choices:
          - name: Disabled
            value: False
          - name: Enabled
            value: True
