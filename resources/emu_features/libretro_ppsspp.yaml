emulator_name: libretro
core_name: ppsspp
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: RENDERING RESOLUTION
          value: ppsspp_internal_resolution
          description: Multiplies the native PSP resolution. Bigger is sharper and slower; Vulkan needs a restart.
          choices:
            - name: Auto (Default)
              value: auto
            - name: 1x (480x272)
              value: 480x272
            - name: 2x (960x544)
              value: 960x544
            - name: 3x (1440x816)
              value: 1440x816
            - name: 4x (1920x1088)
              value: 1920x1088
            - name: 5x (2400x1360)
              value: 2400x1360
            - name: 6x (2880x1632)
              value: 2880x1632
            - name: 7x (3360x1904)
              value: 3360x1904
            - name: 8x (3840x2176)
              value: 3840x2176
            - name: 9x (4320x2448)
              value: 4320x2448
            - name: 10x (4800x2720)
              value: 4800x2720
