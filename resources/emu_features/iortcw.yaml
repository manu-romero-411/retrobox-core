emulator_name: iortcw
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    submenus:
      GRAPHICS:
        - name: RENDERER
          value: iortcw_api
          description: Choose your preferred renderer.
          choices:
            - name: Standard OpenGL (Default)
              value: opengl1
            - name: Enhanced OpenGL
              value: rend2
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing.
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
        - name: REFRESH RATE
          value: iortcw_fps
          description: Set the desired maximum refresh rate when Vsync is off.
          choices:
            - name: 30 fps
              value: 30
            - name: 50 fps
              value: 50
            - name: 60 fps (Default)
              value: 60
            - name: 75 fps
              value: 75
            - name: 120 fps
              value: 120
        - name: ANISOTROPIC FILTERING
          value: iortcw_filtering
          description: Improves clarity of distant textures.
          choices:
            - name: 2x (Default)
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
            - name: 16x
              value: 16
        - name: "ANTI-ALIASING"
          value: iortcw_aa
          description: Enhancement. Smooth out jagged edges on 3D object polygons.
          choices:
            - name: None (Default)
              value: 0
            - name: 2x
              value: 2
            - name: 4x
              value: 4
            - name: 8x
              value: 8
            - name: 16x
              value: 16
    items:
      - name: SKIP INTRO VIDEO
        value: iortcw_skip_video
        description: Skip the initial intro video.
        choices:
          - name: Play (Default)
            value: 0
          - name: Skip
            value: 1
      - name: LANGUAGE
        value: iortcw_language
        description: Change the game's language.
        choices:
          - name: English (Default)
            value: 0
          - name: French
            value: 1
          - name: German
            value: 2
          - name: Italian
            value: 3
          - name: Spanish
            value: 4
