emulator_name: dhewm3
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: BRIGHTNESS
        value: dhewm3_brightness
        description: Change the game's brightness.
        choices:
          - name: "100% (Default)"
            value: 1
          - name: "120%"
            value: 1.2
          - name: "140%"
            value: 1.4
          - name: "160%"
            value: 1.6
          - name: "180%"
            value: 1.8
          - name: "200% (Maximum)"
            value: 2
      - name: LANGUAGE
        value: dhewm3_language
        description: Change the game's language. Game files require the supported language strings in the .pk4 files.
        choices:
          - name: English
            value: english
          - name: Spanish
            value: spanish
          - name: Italian
            value: italian
          - name: German
            value: german
          - name: French
            value: french
          - name: Russian
            value: russian
          - name: Polish
            value: polish
          - name: Korean
            value: korean
          - name: Japanese
            value: japanese
          - name: Chinese
            value: chinese
