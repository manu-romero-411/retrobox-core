emulator_name: theforceengine
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    submenus:
      GRAPHICS:
        - name: RENDERING RESOLUTION
          value: force_render_res
          description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
          choices:
            - name: 200p
              value: 200
            - name: 400p
              value: 400
            - name: 480p
              value: 480
            - name: 600p
              value: 600
            - name: 720p
              value: 720
            - name: 768p
              value: 768
            - name: 800p
              value: 800
            - name: 960p
              value: 960
            - name: 1050p
              value: 1050
            - name: 1080p
              value: 1080
            - name: 1200p
              value: 1200
            - name: 1392p
              value: 1392
            - name: 1440p
              value: 1440
            - name: 1536p
              value: 1536
            - name: 2160p
              value: 2160
        - name: WIDESCREEN
          value: force_widescreen
          description: Enable widescreen support.
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing.
          choices:
            - name: Disabled
              value: 0
            - name: Enabled (Default)
              value: 1
        - name: REFRESH RATE
          value: force_rate
          description: Set the desired maximum refresh rate when Vsync is off.
          choices:
            - name: 30 fps
              value: 30
            - name: 50 fps
              value: 50
            - name: 60 fps (Default)
              value: 60
            - name: 75 fps
              value: 75
            - name: 120 fps
              value: 120
            - name: 144 fps
              value: 144
            - name: 240 fps
              value: 240
        - name: GRAPHICS RENDERER
          value: force_api
          description: Choose which graphics renderer to use.
          choices:
            - name: Classic Software
              value: 0
            - name: GPU / OpenGL (Default)
              value: 1
        - name: COLOUR MODE
          value: force_colour
          description: ""
          choices:
            - name: "8-bit (Classic)"
              value: 0
            - name: "8-bit Interpolated"
              value: 1
            - name: True Colour
              value: 2
        - name: HD TEXTURES
          value: force_hd
          description: "Choose to render high definition graphics textures. Requires OpenGL, True Colour and the enhanced.gob file."
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
        - name: BILINEAR FILTER
          value: force_bilinear
          description: ""
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
        - name: MIPMAPPING
          value: force_mipmapping
          description: ""
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
        - name: CROSSHAIR
          value: force_crosshair
          description: ""
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
        - name: BLOOM
          value: force_postfx
          description: Choose to use Bloom post processing.
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
    items:
      - name: MENU SOUNDS
        value: force_menu_sound
        description: Enable / Disable sound in menus.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled (Default)
            value: 1
      - name: DIGITAL AUDIO
        value: force_digital_audio
        description: "Enable 16-channel iMuse Digital Audio."
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
      - name: FIGHT MUSIC
        value: force_fight_music
        description: Enable / Disable fight music.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled (Default)
            value: 1
      - name: AUTO AIM
        value: force_auto_aim
        description: Enable / Disable automatic aiming.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled (Default)
            value: 1
      - name: SHOW SECRET MESSAGES
        value: force_secret_msg
        description: Enable / Disable showing secret found messages.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled (Default)
            value: 1
      - name: AUTOMATICALLY RUN
        value: force_auto_run
        description: ""
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
      - name: BOBBA FETT FIX
        value: force_boba
        description: Bobba Fett Face Player Fix
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
      - name: SMOOTH VUES
        value: force_smooth_vues
        description: ""
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
  ADVANCED OPTIONS:
    items:
      - name: SKIP CUTSCENES
        value: force_skip_cutscenes
        description: Choose to enable or disable cutscenes.
        choices:
          - name: Show All
            value: show
          - name: Skip Initial
            value: initial
          - name: Skip All
            value: skip
