emulator_name: cemu
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
  - discordrpc
groups:
  GENERAL:
    submenus:
      SCREEN:
        - name: GRAPHICS API
          value: cemu_gfxbackend
          description: Graphics API. Auto uses Vulkan, or OpenGL when Vulkan is not available on this system.
          choices:
            - name: Auto (Default)
              value: auto
            - name: Vulkan
              value: 1
            - name: OpenGL
              value: 0
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing.
          choices:
            - name: Off (Default)
              value: 0
            - name: Double buffering
              value: 1
            - name: Triple buffering
              value: 2
        - name: ASPECT RATIO
          value: cemu_aspect
          description: Change the output resolution ratio.
          choices:
            - name: Keep aspect ratio (Default)
              value: 0
            - name: Stretch
              value: 1
        - name: UPSCALE FILTER
          value: cemu_upscale
          description: Choose upscaling method.
          choices:
            - name: Bilinear
              value: 0
            - name: Bicubic
              value: 1
            - name: Hermite (Default)
              value: 2
            - name: Nearest Neighbour
              value: 3
        - name: DOWNSCALE FILTER
          value: cemu_downscale
          description: Choose downscaling method.
          choices:
            - name: Bilinear (Default)
              value: 0
            - name: Bicubic
              value: 1
            - name: Hermite
              value: 2
            - name: Nearest Neighbour
              value: 3
      AUDIO:
        - name: AUDIO VOLUME GAIN
          value: cemu_audio_gain
          description: Set game audio level in dB. Cemu cannot amplify, so 0 is the loudest.
          choices:
            - name: '-12'
              value: "-12.0"
            - name: '-10'
              value: "-10.0"
            - name: '-8'
              value: "-8.0"
            - name: '-6'
              value: "-6.0"
            - name: '-4'
              value: "-4.0"
            - name: '-2'
              value: "-2.0"
            - name: 0 (No gain)
              value: 0
        - name: AUDIO CHANNELS
          value: cemu_audio_channels
          description: Choose the audio output type.
          choices:
            - name: Stereo (Default)
              value: 1
            - name: Surround
              value: 2
        - name: AUDIO OUTPUT
          value: cemu_audio_config
          description: Set the first audio output device automatically.
          choices:
            - name: Keep the one set in Cemu - choose if there is no audio
              value: false
            - name: Automatic (Default)
              value: true
      EMULATION:
        - name: CONSOLE LANGUAGE
          value: cemu_console_language
          description: Choose console language. Not all games may support the language choice.
          choices:
            - name: Current language
              value: ui
            - name: Japanese
              value: ja_JP
            - name: English
              value: en_US
            - name: French
              value: fr_FR
            - name: German
              value: de_DE
            - name: Italian
              value: it_IT
            - name: Spanish
              value: es_ES
            - name: Chinese
              value: zh_CN
            - name: Korean
              value: ko_KR
            - name: Dutch
              value: nl_NL
            - name: Portuguese
              value: pt_PT
            - name: Russian
              value: ru_RU
            - name: Taiwanese
              value: zh_TW
      DECORATIONS:
        - name: ENABLE PERFORMANCE OVERLAY
          value: cemu_overlay
          description: Enable Cemu's performance overlay.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
        - name: ENABLE NOTIFICATIONS
          value: cemu_notifications
          description: "Enable notifications of cache, controller events etc."
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
  CONTROLS:
    submenus:
      CONTROLLERS:
        - name: RUMBLE
          value: cemu_rumble
          description: Set the controller rumble strength if supported.
          choices:
            - name: Off (Default)
              value: 0
            - name: "25%"
              value: 0.25
            - name: "50%"
              value: 0.5
            - name: "75%"
              value: 0.75
            - name: "100%"
              value: 1
        - name: CONTROLLER COMBINATION
          value: cemu_controller_combination
          description: Pro Controller required for games that require shake motions.
          choices:
            - name: GamePad + 4 Pro Controller
              value: 0
            - name: GamePad + 4 Sideway Wiimote
              value: 1
            - name: 5 Pro Controller
              value: 2
            - name: 5 Sideway Wiimote
              value: 3
            - name: Wii U Classic Controller
              value: 4
        - name: ENABLE MOUSE
          value: cemu_touchpad
          description: Enable mouse input to simulate touchscreen.
          choices:
            - name: Disabled (Default)
              value: 0
            - name: Enabled
              value: 1
        - name: ENABLE GAMEPAD VIEW
          value: cemu_gamepad
          description: Enable gamepad view for games that have interaction across two screens. Use Hotkey+R2 to switch screens.
          choices:
            - name: Disabled (Default)
              value: false
            - name: Enabled
              value: true
  ADVANCED OPTIONS:
    submenus:
      PERFORMANCE:
        - name: ASYNC SHADER COMPILE (VULKAN ONLY)
          value: cemu_async
          description: Speed up shader compilation.
          choices:
            - name: Off
              value: false
            - name: On (Default)
              value: true
