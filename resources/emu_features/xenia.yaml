  ADVANCED OPTIONS:
    items:
      - name: CLEAR MEMORY PAGE STATE
        value: xenia_page_state
        description: Refresh state of memory pages to enable gpu written data. (Use for 'Team Ninja' Games to fix missing character models).
        choices:
          - name: Disabled
            value: False
          - name: Enabled
            value: True
      - name: RENDER TARGET PATH
        value: xenia_target_path
        description: Render target emulation path to use on Direct3D 12. Try changing if you have render issues.
        choices:
          - name: Any
            value: any
          - name: RTV (Default)
            value: rtv
          - name: ROV
            value: rov
      - name: QUERY OCCLUSION
        value: xenia_query_occlusion
        description: The sample count of every tile will be incremented on every EVENT_WRITE_ZPD by this number. Setting this to 0 means everything is reported as occluded.
        choices:
          - name: 0
            value: 0
          - name: 10
            value: 10
          - name: 50
            value: 50
          - name: 100
            value: 100
          - name: 250
            value: 250
          - name: 500
            value: 500
          - name: 750
            value: 750
          - name: 1000 (Default)
            value: 1000
      - name: READBACK RESOLVE
        value: xenia_readback_resolve
        description: "D3D12, read render-to-texture results on the CPU. Needed in some games, but causes mid-frame synchronization, so it has a huge performance impact."
        choices:
          - name: Disabled
            value: False
          - name: Enabled
            value: True
      - name: HARD TEXTURE CACHE MEMORY LIMIT
        value: xenia_limit_hard
        description: Maximum host texture memory usage (in megabytes) above which textures will be destroyed as soon as possible.
        choices:
          - name: 768MB (Default)
            value: 768
          - name: 1536MB
            value: 1536
          - name: 2304MB
            value: 2034
          - name: 3072MB
            value: 3072
          - name: 3840MB
            value: 3840
          - name: 4096MB
            value: 4096
          - name: 5120MB
            value: 5120
          - name: 6144MB
            value: 6144
      - name: TEXTURE MEMORY SCALE SIZE
        value: xenia_limit_render_to_texture
        description: Part of the host texture memory budget (in megabytes) that will be scaled by the current drawing resolution scale.
        choices:
          - name: 24MB (Default)
            value: 24
          - name: 48MB
            value: 48
          - name: 72MB
            value: 72
          - name: 96MB
            value: 96
      - name: SOFT TEXTURE CACHE MEMORY LIMIT
        value: xenia_limit_soft
        description: Maximum host texture memory usage (in megabytes) above which old textures will be destroyed. Set below hard limit.
        choices:
          - name: 384MB (Default)
            value: 384
          - name: 768MB
            value: 768
          - name: 1536MB
            value: 1536
          - name: 2048MB
            value: 2048
          - name: 3072MB
            value: 3072
          - name: 4096MB
            value: 4096
      - name: SOFT TEXTURE CACHE MEMORY TIMEOUT
        value: xenia_limit_soft_lifetime
        description: Seconds a texture should be unused to be considered old enough to be deleted if texture memory usage exceeds Soft Texture Cache limit.
        choices:
          - name: 15s
            value: 15
          - name: 30s (Default)
            value: 30
          - name: 45s
            value: 45
          - name: 60s
            value: 60
      - name: MOUNT CACHE
        value: xenia_cache
        description: Enable cache mount. Can improve performance and compatibility in some games.
        choices:
          - name: Disabled
            value: False
          - name: Enabled
            value: True
