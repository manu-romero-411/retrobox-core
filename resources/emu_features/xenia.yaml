emulator_name: xenia
sharedFeatures:
  - powermode
  - tdp
  - videomode
groups:
  GENERAL:
    items:
      - name: GRAPHICS API
        value: xenia_api
        description: Choose which graphics API library to use. D3D12 may yield better results with faster GPUs.
        choices:
          - name: D3D12 (Default)
            value: D3D12
          - name: Native Vulkan
            value: Vulkan
      - name: VSYNC
        value: use_vsync
        description: Fix screen tearing.
        choices:
          - name: Disabled
            value: False
          - name: Enabled
            value: True
      - name: XBOX LIVE ARCADE
        value: xenia_license
        description: "This option enables the ability to play Xbox Live Arcade games. May cause compatibility issues with non-XBLA games."
        choices:
          - name: No licenses enabled
            value: 0
          - name: XBLA license enabled (Default)
            value: 1
          - name: All possible licenses (Not recommended)
            value: "-1"
      - name: UI PROMPTS
        value: xenia_headless
        description: Choose to display UI prompts or accept defaults.
        choices:
          - name: Enabled (Default)
            value: False
          - name: Disabled
            value: True
      - name: CONSOLE COUNTRY
