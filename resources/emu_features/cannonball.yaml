emulator_name: cannonball
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  GENERAL:
    items:
      - name: ASPECT RATIO
        value: ratio
        description: Change the output resolution ratio.
        choices:
          - name: "4:3"
            value: 0
          - name: "16:9"
            value: 1
      - name: HIGH RESOLUTION MODE
        value: highResolution
        description: Improves both sprite scaling and road rendering. Does not affect the car sprite.
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
