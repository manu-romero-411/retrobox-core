emulator_name: ppsspp
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - rewind
  - discordrpc
groups:
  GENERAL:
    submenus:
      RENDERING:
        - name: GRAPHICS API
          value: gfxbackend
          description: Choose which graphics API library to use.
          choices:
            - name: OpenGL
              value: 0 (OPENGL)
            - name: Vulkan
              value: 3 (VULKAN)
        - name: RENDERING RESOLUTION
          value: internal_resolution
          description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
          choices:
            - name: 1x (480x272)
              value: 1
            - name: 2x (960x544)
              value: 2
            - name: 3x 720p (1440x816)
              value: 3
            - name: 4x 1080p (1920x1088)
              value: 4
            - name: 5x (2400x1360)
              value: 5
            - name: 6x (2880x1632)
              value: 6
            - name: 7x (3360x1904)
              value: 7
            - name: 8x 4K (3840x2176)
              value: 8
            - name: 9x (4320x2448)
              value: 9
            - name: 10x (4800x2720)
              value: 10
        - name: VSYNC
          value: vsync
          description: "Enable for more fluidity, disable if screen tearing."
          choices:
            - name: Disable
              value: 0
            - name: Enable
              value: 1
      FRAMESKIP CONTROL:
        - name: FRAME SKIPPING
          value: frameskip
          description: "Skip frames to improve performance, at the cost of choppy motion."
          choices:
            - name: Off
              value: 0
            - name: 1
              value: 1
            - name: 2
              value: 2
            - name: 3
              value: 3
            - name: 4
              value: 4
            - name: 5
              value: 5
            - name: 6
              value: 6
            - name: 7
              value: 7
            - name: 8
              value: 8
        - name: AUTO FRAMESKIP
          value: autoframeskip
          description: Automatically reduce frameskip if the system has spare overhead.
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
      SPEED HACKS:
        - name: SKIP BUFFER EFFECTS
          value: skip_buffer_effects
          description: "Skip buffer effects faster but may not render some games. Disables resolution, MSAA, auto frameskip and duplicate frames to 60Hz."
          choices:
            - name: Buffered rendering
              value: False
            - name: Skip buffer effects
              value: True
        - name: DISABLE CULLING
          value: disable_culling
          description: "The PSP will cull triangles that are outside a 4096x4096 clipping box, and also triangles crossing the Z=1 plane if clipping is enabled."
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: SKIP GPU READBACKS
          value: skip_gpu_readbacks
          description: "In some games, this can fix severe slowdowns, but can also cause graphical issues."
          choices:
            - name: No (Default)
              value: 0
            - name: Skip
              value: 1
            - name: Copy to texture
              value: 2
        - name: LAZY TEXTURE CACHING
          value: lazy_texture_caching
          description: Faster but can cause text problems in some games.
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: SPLINE/BEZIER CURVES QUALITY
          value: curves_quality
          description: Allows reducing the visual quality of these curves for higher performance.
          choices:
            - name: Low
              value: 0
            - name: Medium
              value: 1
            - name: High
              value: 2
      PERFORMANCE:
        - name: RENDER DUPLICATE FRAMES TO 60 HZ
          value: duplicate_frames
          description: "If a game runs at 30hz, PPSSPP wtill push 60 frames to the monitor."
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: BUFFER GRAPHICS COMMANDS
          value: buffer_graphics
          description: "CPU-GPU latency limit. Lower values improve latency but may reduce performance."
          choices:
            - name: No Buffer
              value: 1
            - name: Up to 1
              value: 2
            - name: Up to 2 (Default)
              value: 3
        - name: SOFTWARE SKINNING
          value: software_skinning
          description: "Runs \"skinning\" on the CPU instead of the GPU, means that draw calls from the game can more easily be combined, which often improves things."
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: HARDWARE TESSELLATION
          value: hardware_tessellation
          description: Uses hardware to make curves.
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
      TEXTURE SCALING:
        - name: TEXTURE UPSCALING TYPE
          value: texture_scaling_type
          description: "xBRZ - a sharpening upscale algorithm, Bicubic - a smooth look, Hybrid - uses bicubic for smooth areas."
          choices:
            - name: xBRZ (Default)
              value: 0
            - name: Hybrid
              value: 1
            - name: Bicubic
              value: 2
            - name: Hybrid + Bicubic
              value: 3
        - name: TEXTURE UPSCALING LEVEL
          value: texture_scaling_level
          description: There is generally no point in going beyond 4x texture scaling unless you are running at very high resolutions.
          choices:
            - name: Off (Default)
              value: 1
            - name: 2x
              value: 2
            - name: 3x
              value: 3
            - name: 4x
              value: 4
            - name: 5x
              value: 5
        - name: TEXTURE DEPOSTERIZE
          value: texture_deposterize
          description: Fix texture banding when upscaling.
          choices:
            - name: Off
              value: False
            - name: On
              value: True
      TEXTURE FILTERING:
        - name: ANISOTROPIC FILTERING
          value: anisotropic_filtering
          description: Improves clarity of distant textures.
          choices:
            - name: Off
              value: 0
            - name: 2x
              value: 1
            - name: 4x
              value: 2
            - name: 8x
              value: 3
            - name: 16x
              value: 4
        - name: TEXTURE FILTERING
          value: texture_filtering
          description: Smooth textures on 3D objects.
          choices:
            - name: Nearest
              value: 2
            - name: Linear
              value: 3
            - name: Auto Max Quality
              value: 4
        - name: SMART 2D TEXTURE FILTERING
          value: smart_2d
          description: "When enabled and upscaling, textures look better than linear filtering for a lot of 2D art."
          choices:
            - name: Off
              value: False
            - name: On
              value: True
  ADVANCED OPTIONS:
    items:
      - name: GAME CHEATS
        value: enable_cheats
        description: Enables Action Replay cheats.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
