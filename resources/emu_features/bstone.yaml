emulator_name: bstone
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: ENABLE WIDESCREEN
        value: bstone_widescreen
        description: Enable widescreen support for game rendering.
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
      - name: VSYNC
        value: bstone_vsync
        description: Fix screen tearing.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled (Default)
            value: 1
      - name: STRETCH UI MENU
        value: bstone_ui_stretched
        description: ""
        choices:
          - name: Disabled (Default)
            value: 0
          - name: Enabled
            value: 1
