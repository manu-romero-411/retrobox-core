emulator_name: openmohaa
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    submenus:
      VIDEO:
        - name: COLOUR DEPTH
          value: mohaa_colour
          description: Choose the emulated colour depth.
          choices:
            - name: Default
              value: 0
            - name: "16-bit"
              value: 16
            - name: "32-bit"
              value: 32
        - name: TEXTURE DETAIL
          value: mohaa_texture
          description: Choose the level of texture detail.
          choices:
            - name: Low
              value: 2
            - name: Medium
              value: 1
            - name: High
              value: 0
        - name: TEXTURE COLOUR DEPTH
          value: mohaa_texture_colour
          description: Choose the texture colour depth.
          choices:
            - name: Default
              value: 0
            - name: "16-bit"
              value: 16
            - name: "32-bit"
              value: 32
        - name: TEXTURE FILTER
          value: mohaa_texture_filter
          description: Choose the texture filter type.
          choices:
            - name: Bilinear
              value: GL_LINEAR_MIPMAP_NEAREST
            - name: Trilinear
              value: gl_linear_mipmap_linear
        - name: WALL DECALS
          value: mohaa_decals
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: WEATHER EFFECTS
          value: mohaa_weather
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: BRIGHTNESS
          value: mohaa_brightness
          description: Change the game's brightness.
          preset: sliderauto
          preset-parameters: 0.50 3.00 .10
        - name: TEXTURE COMPRESSION
          value: mohaa_compression
          description: Increases texture quality.
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
      ADVANCED OPTIONS:
        - name: VIEW MODEL
          value: mohaa_view
          description: Choose the character view type.
          choices:
            - name: None
              value: 0
            - name: Gun Only
              value: 1
            - name: Full
              value: 2
        - name: SHADOWS
          value: mohaa_shadows
          description: Choose the amount of shadow detail.
          choices:
            - name: None
              value: 0
            - name: Simple
              value: 1
            - name: Complex
              value: 2
        - name: TERRAIN DETAIL
          value: mohaa_terrain
          description: Choose the level of terrain detail.
          choices:
            - name: Low
              value: 0
            - name: Medium
              value: 1
            - name: High Detail
              value: 2
            - name: Max Detail
              value: 3
        - name: MODEL DETAIL
          value: mohaa_model
          description: Choose the level of model detail.
          choices:
            - name: Lowest
              value: 0
            - name: Low
              value: 1
            - name: Medium
              value: 2
            - name: High
              value: 3
            - name: Higher
              value: 4
            - name: Highest
              value: 5
        - name: EFFECTS DETAIL
          value: mohaa_effects
          description: Choose the level of effects detail.
          choices:
            - name: Minimum
              value: 0
            - name: Lower
              value: 1
            - name: Low
              value: 2
            - name: Medium
              value: 3
            - name: High
              value: 4
            - name: Higher
              value: 5
            - name: Max
              value: 6
        - name: CURVE DETAIL
          value: mohaa_curve
          description: Choose the level of curve detail.
          choices:
            - name: Lowest
              value: 0
            - name: Low
              value: 1
            - name: Medium
              value: 2
            - name: High
              value: 3
        - name: SUBTITLES
          value: mohaa_subtitles
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: REAL DYNAMIC LIGHTING
          value: mohaa_dynamic_lighting
          description: ""
          choices:
            - name: Off
              value: 1
            - name: On
              value: 0
        - name: FULL ENTITY LIGHTING
          value: mohaa_entity_lighting
          description: ""
          choices:
            - name: Off
              value: 1
            - name: On
              value: 0
        - name: VOLUMETRIC SMOKE
          value: mohaa_smoke
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: WEAPONS BAR
          value: mohaa_weapons
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: CROSSHAIR
          value: mohaa_crosshair
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
