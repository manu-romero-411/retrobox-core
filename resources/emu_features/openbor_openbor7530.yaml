emulator_name: openbor
core_name: openbor7530
groups:
  GENERAL:
    items:
      - name: VSYNC
        value: use_vsync
        description: Fix screen tearing.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled
            value: 1
      - name: LIMIT FPS
        value: openbor_limit
        description: Limit FPS to reduce high CPU usage.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled
            value: 1
      - name: RUMBLE
        value: openbor_rumble
        description: Only some games feature rumble. Not compatible with all controllers.
        choices:
          - name: Disabled
            value: 0
          - name: Enabled
            value: 1
