          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 2 INPUT MAPPING
          value: pd_controller2_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 3 INPUT MAPPING
          value: pd_controller3_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 4 INPUT MAPPING
          value: pd_controller4_mapping
          description: Use Megadrive to automap inputs for a Megadrive style controller with a 6 button layout.
          choices:
            - name: Retropad (Default)
              value: retropad
            - name: Megadrive
              value: megadrive
        - name: CONTROLLER 1 TYPE
          value: picodrive_controller1
          description: ""
          choices:
            - name: Joypad 3 Button
