            - name: Joypad 6 Button
              value: 6 button pad
    items:
      - name: REDUCE SPRITE FLICKERING
        value: picodrive_sprlim
        description: Enhancement. Remove the eighty sprites per line limit.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
  ADVANCED OPTIONS:
    items:
      - name: CROP OVERSCAN
        value: picodrive_cropoverscan
        description: Zooms in to hide black borders.
        choices:
          - name: Off
            value: disabled
          - name: On
            value: enabled
systems:
  - name: sega32x
    groups:
      GENERAL:
        items:
          - name: AUTO WIDESCREEN
            value: "picodrive-autowidescreen"
            description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
            choices:
              - name: Off
                value: False
              - name: On
                value: True
