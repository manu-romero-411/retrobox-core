          choices:
            - name: Legacy Evdev
              value: Evdev
            - name: Sony DS
              value: Sony
        - name: RUMBLE
          value: rpcs3_rumble4
          description: Enable controller rumble capabilities if supported by the controller.
          preset: switchon
      CONTROLLER 5:
        - name: PS3 CONTROLLER
          value: rpcs3_controller5
          description: "Default uses SDL2, otherwise enable controller specific capabilities. Sony DS won't work with clone controllers."
          choices:
            - name: Legacy Evdev
              value: Evdev
            - name: Sony DS
              value: Sony
        - name: RUMBLE
          value: rpcs3_rumble5
          description: Enable controller rumble capabilities if supported by the controller.
          preset: switchon
