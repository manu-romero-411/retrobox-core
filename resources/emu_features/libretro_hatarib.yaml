emulator_name: libretro
core_name: hatarib
features:
  - padtokeyboard
sharedFeatures:
  - autosave
groups:
  GENERAL:
    items:
      - name: ATARI MACHINE TYPE
        value: hatarib_machine
        description: Choose your desired Atari machine type.
        choices:
          - name: ST
            value: 0
          - name: Mega ST
            value: 1
          - name: STE
            value: 2
          - name: Mega STE
            value: 3
          - name: TT
            value: 4
          - name: Falcon
            value: 5
      - name: ATARI ST MEMORY SIZE
        value: hatarib_memory
        description: Choose your desired Atari ST memory size.
        choices:
          - name: 1 MB
            value: 1024
          - name: 2 MB
            value: 2048
          - name: 2.5 MB
            value: 2560
          - name: 4 MB
            value: 4096
          - name: 8 MB
            value: 8192
          - name: 10 MB
            value: 10240
          - name: 14 MB
            value: 14336
      - name: ATARI MONITOR TYPE
        value: hatarib_monitor
        description: Choose your desired Atari Monitor.
        choices:
          - name: "Monochrome High-Resolution"
            value: 0
          - name: "RGB Colour Low/Medium-Resolution"
            value: 1
          - name: VGA
            value: 2
          - name: TV
            value: 3
      - name: ASPECT RATIO
        value: hatarib_ratio
        description: Choose your desired pixel aspect ratio.
        choices:
          - name: Square Pixels
            value: 0
          - name: Atari Monitor
            value: 1
          - name: NTSC TV
            value: 2
          - name: PAL TV
            value: 3
      - name: SCREEN BORDERS
        value: hatarib_borders
        description: "Atari ST monitors had a visible border around the main screen area, but most software does not display anything in it."
        choices:
          - name: Hide
            value: 0
          - name: Full
            value: 1
          - name: "Crop 720p (240, 480)"
            value: 2
          - name: "Crop 1080p (270, 540)"
            value: 3
      - name: PAUSE SCREEN DISPLAY
        value: hatarib_pause
        description: Choose your desired pause screen display type.
        choices:
          - name: Help and Information
            value: 2
          - name: Floppy Disk List
            value: 3
          - name: Bouncing Box
            value: 4
          - name: Snow
            value: 5
          - name: Darken
            value: 1
          - name: No Indicator
            value: 0
      - name: LANGUAGE
        value: hatarib_language
        description: "Emutos language && region setting."
        choices:
          - name: English (us)
            value: 0
          - name: German (de)
            value: 1
          - name: French (fr)
            value: 2
          - name: British English (uk)
            value: 3
          - name: Spanish (es)
            value: 4
          - name: Italian (it)
            value: 5
          - name: Swedish (se)
            value: 6
          - name: Swiss French (ch)
            value: 7
          - name: Swiss German (ch)
            value: 8
          - name: Turkish (tr)
            value: 9
          - name: Finnish (fi)
            value: 10
          - name: Norwegian (no)
            value: 11
          - name: Danish (dk)
            value: 12
          - name: Arabic (ar)
            value: 13
          - name: Netherlands (nl)
            value: 14
          - name: Czech (cz)
            value: 15
          - name: Hungarian (hg)
            value: 16
          - name: Poland (pl)
            value: 17
          - name: Russian (ru)
            value: 18
          - name: Greek (gk)
            value: 19
      - name: ATARI HARD DRIVE TYPE
        value: hatarib_drive
        description: Choose your Atari hard drive type for the .hd extension file.
        choices:
          - name: IDE (Default)
            value: IDE
          - name: ACSI
            value: ACSI
  ADVANCED OPTIONS:
    items:
      - name: ATARI CPU TYPE
        value: hatarib_cpu
        description: Choose your desired Atari CPU type.
        choices:
          - name: 68000
            value: 0
          - name: 68010
            value: 1
          - name: 68020
            value: 2
          - name: 68030
            value: 3
          - name: 68040
            value: 4
          - name: 68060
            value: 5
      - name: ATARI CPU CLOCK RATE
        value: hatarib_cpu_clock
        description: Choose your desired Atari CPU clock rate.
        choices:
          - name: 8 MHz
            value: 8
          - name: 16 MHz
            value: 16
          - name: 32 MHz
            value: 32
