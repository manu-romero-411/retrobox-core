emulator_name: dolphin
core_name: dolphin
sharedFeatures:
  - tdp
  - videomode
  - bezel
  - bezel_stretch
  - hud
  - hud_corner
  - bezel.tattoo
  - bezel.tattoo_corner
  - bezel.tattoo_file
  - bezel.resize_tattoo
  - use_wheels
  - wheel_rotation
  - wheel_deadzone
  - wheel_midzone
  - discordrpc
groups:
  GENERAL:
    submenus:
      DISPLAY:
        - name: GAME ASPECT RATIO
          value: dolphin_aspect_ratio
          description: "The final output image, unrelated to the Wii's emulated NAND setting."
          choices:
            - name: Automatic ratio
              value: 0
            - name: "Force 16:9"
              value: 1
            - name: "Force 4:3"
              value: 2
            - name: Stretch to window
              value: 3
      RENDERING:
        - name: GRAPHICS API
          value: gfxbackend
          description: Choose which graphics API library to use.
          choices:
            - name: OpenGL
              value: OGL
            - name: Vulkan
              value: Vulkan
        - name: RENDERING RESOLUTION
          value: internal_resolution
          description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
          choices:
            - name: 1x native (640x528)
              value: 1
            - name: 2x 720p (1280x1056)
              value: 2
            - name: 3x 1080p (1920x1584)
              value: 3
            - name: 4x 1440p (2560x2112)
              value: 4
            - name: 5x (3200x2640)
              value: 5
            - name: 6x 4K (3840x3168)
              value: 6
            - name: 7x (4480x3696)
              value: 7
            - name: 8x 5K (5120x4224)
              value: 8
  CONTROLS:
    submenus:
      GAMECUBE CONTROLLER 1:
        - name: GAMECUBE PORT 1 TYPE
          value: dolphin_port_1_type
          description: Change what's plugged into the virtual GameCube ports.
          choices:
            - name: None
              value: 0
            - name: Standard Controller
              value: 6a
            - name: GameCube Controller
              value: 6b
            - name: GameCube Adapter for Wii U
              value: 12
            - name: Steering Wheel
              value: 8
            - name: Dance Mat
              value: 9
            - name: DK Bongos
              value: 10
            - name: Keyboard
              value: 7
        - name: ROTATE FACE BUTTONS
          value: alt_mappings_1
          description: "Moves South to West, West to North, etc. Standard controller type only."
          preset: switchauto
        - name: DEADZONE
          value: deadzone_1
          description: Set joystick deadzone.
          choices:
            - name: "0%"
              value: 0.0
            - name: "5% (Default)"
              value: 5.0
            - name: "10%"
              value: 10.0
            - name: "15%"
              value: 15.0
            - name: "20%"
              value: 20.0
            - name: "25%"
              value: 25.0
            - name: "30%"
              value: 30.0
        - name: JOYSTICK GATE SIZE
          value: jsgate_size_1
          description: Set virtual joysticks gate size. Smaller increases sensitivity. Larger decreases it.
          choices:
            - name: Smaller
              value: smaller
            - name: Normal (Default)
              value: normal
            - name: Larger
              value: larger
