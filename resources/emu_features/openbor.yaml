emulator_name: openbor
sharedFeatures:
  - power_profile
  - tdp
  - videomode
groups:
  GENERAL:
    items:
      - name: SCREEN RATIO
        value: openbor_ratio
        description: "Stretch games to full-screen, but may distort the aspect ratio"
        choices:
          - name: Normal
            value: 0
          - name: Stretch
            value: 1
      - name: VIDEO FILTER
        value: openbor_filter
        description: "Apply a post-processing effect."
        choices:
          - name: Simple 2x
            value: 0
          - name: Bilinear
            value: 1
          - name: 2xSaI
            value: 2
          - name: Super 2xSaI
            value: 3
          - name: Super Eagle
            value: 4
          - name: Advance Mame2x
            value: 5
          - name: Lq2x
            value: 6
          - name: Hq2x
            value: 7
          - name: ScanLines
            value: 8
          - name: ScanLines TV
            value: 9
          - name: TV 2x
            value: 10
          - name: Dot Matrix
            value: 11
