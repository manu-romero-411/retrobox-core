emulator_name: openjkdf2
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    submenus:
      GENERAL:
        - name: CUTSCENES
          value: jkdf2_scenes
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: CUTSCENE SUBTITLES
          value: jkdf2_subs
          description: Enable full subtitles on cutscenes.
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: MAP ROTATION
          value: jkdf2_map_rotate
          description: Enable rotation on overlay map.
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: MISSION START
          value: jkdf2_start
          description: Disable mission start confirmation.
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
      GAMEPLAY:
        - name: AUTO AIMING
          value: jkdf2_aiming
          description: Enable auto aiming.
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: AIMING CROSSHAIR
          value: jkdf2_crosshair
          description: Enable aiming crosshair.
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: LIGHTSABER CAMERA
          value: jkdf2_saber_camera
          description: "Enable lightsaber auto-camera."
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: LIGHTSABER CROSSHAIR
          value: jkdf2_saber_cross
          description: Show Crosshair with lightsaber.
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: FIST CROSSHAIR
          value: jkdf2_fist_cross
          description: Show Crosshair with fist.
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: WEAPON WAGGLE
          value: jkdf2_waggle
          description: Disable weapon waggle.
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: CROSSHAIR SIZE
          value: jkdf2_cross_size
          description: Set the crosshair size.
          preset: sliderauto
          preset-parameters: 0.0 2.00 .20
        - name: CROSSHAIR LINE THICKNESS
          value: jkdf2_cross_line
          description: Set the crosshair line thickness.
          preset: sliderauto
          preset-parameters: 1.00 3.00 .20
      WEAPON PICKUP:
        - name: PICKUP WEAPON
          value: jkdf2_pickup
          description: Automatic pickup weapon.
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: NO DANGEROUS WEAPONS
          value: jkdf2_dangerous
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: NO WEAKER WEAPONS
          value: jkdf2_weaker
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: KEEP LIGHTSABER
          value: jkdf2_saber
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
      SWITCH WEAPON:
        - name: AUTO SWITCH WEAPON
          value: jkdf2_switch
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: NO DANGEROUS WEAPONS
          value: jkdf2_switch_dangerous
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
      RELOAD WEAPON:
        - name: AUTOMATICALLY RELOAD WEAPON
          value: jkdf2_reload
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: KEEP LIGHTSABER
          value: jkdf2_reload_saber
          description: ""
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
      DISPLAY:
        - name: FIELD OF VIEW
          value: jkdf2_fov
          description: Set the field of view.
          preset: sliderauto
          preset-parameters: 40 170 5
        - name: FOV VERTICAL
          value: jkdf2_fov_vert
          description: Field of view is vertical (Hor+).
          choices:
            - name: Disabled
              value: 0
            - name: Enabled
              value: 1
        - name: ASPECT
          value: jkdf2_aspect
          description: "Use 1:1 aspect."
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: FPS LIMIT
          value: jkdf2_fps
          description: Set the fps limit.
          preset: sliderauto
          preset-parameters: 0 360 10
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing.
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: HIDPI
          value: jkdf2_hidpi
          description: Enable high dots per inch.
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: TEXTURE FILTERING
          value: jkdf2_texture
          description: ""
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: BLOOM
          value: jkdf2_bloom
          description: Choose to use Bloom post processing.
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: SSAO
          value: jkdf2_ssao
          description: Choose Screen Space Ambient Occlusion for better lighting.
          choices:
            - name: Disabled
              value: False
            - name: Enabled
              value: True
        - name: GAMMA
          value: jkdf2_gamma
          description: "Choose the amount of Gamma which changes how light or dark mid-range tones appear."
          preset: sliderauto
          preset-parameters: 0.40 3.00 .20
        - name: HUD SCALE
          value: jkdf2_hud_scale
          description: "Choose the size of the heads-up display."
          preset: sliderauto
          preset-parameters: 0.40 3.00 .20
        - name: SSAA Multiplier
          value: jkdf2_ssaa_multiple
          description: Enhancement. Smooth out jagged edges on 3D object polygons.
          choices:
            - name: 1x (Default)
              value: 1.0
            - name: 2x
              value: 2.0
            - name: 4x
              value: 4.0
    items:
      - name: DIFFICULTY
        value: jkdf2_difficulty
        description: Choose difficulty for the game.
        choices:
          - name: Easy
            value: 0
          - name: Medium
            value: 1
          - name: Hard
            value: 2
  ADVANCED OPTIONS:
    items:
      - name: KEEP CORPSES
        value: jkdf2_corpses
        description: Choose to keep corpses present.
        choices:
          - name: Disabled
            value: False
          - name: Enabled
            value: True
