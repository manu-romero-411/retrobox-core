emulator_name: openjk
features:
  - padtokeyboard
sharedFeatures:
  - powermode
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    submenus:
      VIDEO:
        - name: COLOUR DEPTH
          value: openjk_colour
          description: Choose the emulated colour depth.
          choices:
            - name: Default
              value: None
            - name: "16-bit"
              value: 16
            - name: "32-bit"
              value: 32
        - name: GEOMETRIC DETAIL
          value: openjk_detail
          description: Choose the level of geometric detail.
          choices:
            - name: Low
              value: Low
            - name: Medium
              value: Medium
            - name: High
              value: High
        - name: TEXTURE DETAIL
          value: openjk_texture
          description: Choose the level of texture detail.
          choices:
            - name: Low
              value: 3
            - name: Medium
              value: 2
            - name: High
              value: 1
            - name: Very High
              value: 0
        - name: TEXTURE QUALITY
          value: openjk_texture_quality
          description: Choose the depth of texture quality.
          choices:
            - name: Default
              value: 0
            - name: "16-bit"
              value: 16
            - name: "32-bit"
              value: 32
        - name: TEXTURE FILTER
          value: openjk_texture_filter
          description: Choose the texture filter type.
          choices:
            - name: Bilinear
              value: GL_LINEAR_MIPMAP_NEAREST
            - name: Trilinear
              value: GL_LINEAR_MIPMAP_LINEAR
        - name: DETAILED SHADERS
          value: openjk_shaders
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: VSYNC
          value: use_vsync
          description: Fix screen tearing.
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: BRIGHTNESS
          value: openjk_brightness
          description: Change the game's brightness.
          preset: sliderauto
          preset-parameters: 0.50 3.00 .10
        - name: SHADOWS
          value: openjk_shadows
          description: Choose shadow details.
          choices:
            - name: None
              value: 0
            - name: Simple
              value: 1
            - name: Volumetric
              value: 2
        - name: DYNAMIC LIGHTS
          value: openjk_lights
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: DYNAMIC GLOW
          value: openjk_glow
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: LIGHT FLARES
          value: openjk_flares
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: WALL MARKS
          value: openjk_wall
          description: ""
          choices:
            - name: Off
              value: 0
            - name: On
              value: 1
        - name: ANISTROPIC FILTER
          value: openjk_anistropic
          description: Improves clarity of distant textures.
          preset: sliderauto
          preset-parameters: 0.00 16.00 .50
    items:
      - name: DRAW CROSSHAIR
        value: openjk_crosshair
        description: ""
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: IDENTIFY TARGET
        value: openjk_target
        description: ""
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: SLOW MOTION DEATH
        value: openjk_death
        description: Choose slow motion death option.
        choices:
          - name: Never
            value: 0
          - name: Player
            value: 1
          - name: "Player, Last Enemy Jedi"
            value: 2
          - name: "Player, Any Enemy Jedi"
            value: 3
          - name: "Player, Last Enemy in Group"
            value: 4
          - name: "Player, Any Enemy"
            value: 5
          - name: All + Enemy Jedi Dodge
            value: 6
      - name: 1ST PERSON GUNS
        value: openjk_guns
        description: ""
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: MODEL DISMEMBERMENT
        value: openjk_dismember
        description: ""
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: VIEW SWAYING
        value: openjk_sway
        description: ""
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: TEXT
        value: openjk_text
        description: Choose text language.
        choices:
          - name: English
            value: english
          - name: French
            value: french
          - name: German
            value: deutsch
          - name: Spanish
            value: spanish
      - name: VOICE
        value: openjk_voice
        description: Choose voice language.
        choices:
          - name: English
            value: english
          - name: French
            value: french
          - name: German
            value: deutsch
          - name: Spanish
            value: spanish
      - name: SUBTITLES
        value: openjk_subtitles
        description: Choose when to enable subtitles.
        choices:
          - name: None
            value: 0
          - name: In Cinematics
            value: 2
          - name: All voiceovers
            value: 1
