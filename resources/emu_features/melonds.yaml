emulator_name: melonds
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    submenus:
      FIRMWARE SETTINGS:
        - name: USE FIRMWARE SETTINGS
          value: melonds_use_fw_settings
          description: Use language and username from the NDS Firmware.
          choices:
            - name: on (Default)
              value: False
            - name: off
              value: True
        - name: LANGUAGE
          value: melonds_language
          description: Select language will be used if 'Use Firmware Settings' is disabled or if firmware file was not found.
          choices:
            - name: Japanese
              value: 0
            - name: English (Default)
              value: 1
            - name: French
              value: 2
            - name: German
              value: 3
            - name: Italian
              value: 4
            - name: Spanish
              value: 5
        - name: BIRTH MONTH
          value: melonds_month
          description: The month of your birthay.
          choices:
