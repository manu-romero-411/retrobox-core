    items:
      - name: LIMIT FRAME RATE
        value: melonds_framerate
        description: ""
        choices:
          - name: No Limit
            value: False
          - name: As game specifies
            value: True
      - name: ENABLE POLYGON SPLITTING
        value: melonds_polygons
        description: Enhancement. Enables improved polygon splitting.
        choices:
