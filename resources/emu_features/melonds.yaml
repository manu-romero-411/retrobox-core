              value: 10
            - name: November
              value: 11
            - name: December
              value: 12
            - name: Don't Override
              value: 1
        - name: BIRTH DAY
          value: melonds_day
          description: The day within the month of your birthday.
          choices:
            - name: 1st
              value: 1
            - name: 2nd
              value: 2
            - name: 3rd
              value: 3
            - name: 4th
              value: 4
