emulator_name: libretro
core_name: yabasanshiro
sharedFeatures:
  - autosave
groups:
  GENERAL:
    items:
      - name: RENDERING RESOLUTION
        value: resolution_mode
        description: Enhancement. Increase the rendering resolution. Makes 3D objects clearer.
        choices:
          - name: 1x (320x240)
            value: original
          - name: 2x (640x480)
            value: 2x
          - name: 4x (1280x960)
            value: 4x
          - name: 720p
            value: 720p
          - name: 1080p
            value: 1080p
          - name: 4K
            value: 4k
      - name: AUTO WIDESCREEN
        value: "yabasanshiro-autowidescreen"
        description: Automatically sets aspect ratio to 16/9 for games that natively support it. 2D elements like HUD/UI may be stretched.
        choices:
          - name: Off
            value: False
          - name: On
            value: True
      - name: MULTITAP
        value: multitap_yabasanshiro
        description: Allows up to 7 or 12 controllers in supported games.
        choices:
          - name: Off
            value: disabled
          - name: Port1
            value: port1
          - name: Port2
            value: port2
          - name: Port1+2
            value: port12
      - name: CONTROLLER 1 TYPE
        value: controller1_saturn
        description: Not all games support 3D pad.
        choices:
          - name: Saturn Pad
            value: 1
          - name: Saturn 3D Pad
            value: 5
      - name: CONTROLLER 2 TYPE
        value: controller2_saturn
        description: Not all games support 3D pad.
        choices:
          - name: Saturn Pad
            value: 1
          - name: Saturn 3D Pad
            value: 5
      - name: LANGUAGE
        value: yabasanshiro_language
        description: Change the system's language.
        choices:
          - name: English (Default)
            value: english
          - name: Spanish
            value: spanish
          - name: French
            value: french
          - name: Deutsch
            value: deutsch
          - name: Italian
            value: italian
          - name: Japanese
            value: japanese
