emulator_name: libretro
core_name: bsnes_hd
groups:
  CONTROLS:
    submenus:
      PORT 1:
        - name: CONTROLLER TYPE
          value: controller1_bsnes_hd
          description: Device plugged into port 1.
          retroarch_option: input_libretro_device_p1
          choices:
            - name: Gamepad (Default)
              value: auto
            - name: Mouse
              value: '2'
      PORT 2:
        - name: CONTROLLER TYPE
          value: controller2_bsnes_hd
          description: Device plugged into port 2 (light guns are set in LIGHT GUNS).
          retroarch_option: input_libretro_device_p2
          choices:
            - name: Gamepad (Default)
              value: auto
            - name: Mouse
              value: '2'
            - name: Multitap
              value: '257'
