emulator_name: "fallout1-ce"
features:
  - padtokeyboard
sharedFeatures:
  - power_profile
  - tdp
  - videomode
  - bezel
  - bezel_stretch
groups:
  GENERAL:
    items:
      - name: GAME DIFFICULTY
        value: fout1_game_difficulty
        description: Choose the games difficulty.
        choices:
          - name: Easy
            value: 0
          - name: Normal (Default)
            value: 1
          - name: Hard
            value: 2
      - name: COMBAT DIFFICULTY
        value: fout1_combat_difficulty
        description: Choose the combat difficulty.
        choices:
          - name: Wimpy
            value: 0
          - name: Normal (Default)
            value: 1
          - name: Rough
            value: 2
      - name: VIOLENCE LEVEL
        value: fout1_violence_level
        description: Choose the preferred violence level.
        choices:
          - name: None
            value: 0
          - name: Minimal
            value: 1
          - name: Normal (Default)
            value: 2
          - name: Maximum Blood
            value: 3
      - name: SUBTITLES
        value: fout1_subtitles
        description: ""
        choices:
          - name: Off
            value: 0
          - name: On
            value: 1
      - name: LANGUAGE
        value: fout1_language
        description: Change the game's language.
        choices:
          - name: English (Default)
            value: english
          - name: French
            value: french
          - name: German
            value: german
          - name: Italian
            value: italian
          - name: Spanish
            value: spanish
